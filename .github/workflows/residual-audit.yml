name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile heap-core byte count
        run: |
          python3 - <<'PY'
          ranges=[(0x104E0,0x1083F),(0x10974,0x109C1),(0x10C46,0x10C6D)]
          parts=[b-a for a,b in ranges]
          exact=sum(parts)
          historical_delta=979
          print('component bytes:',parts)
          print('exact verified bytes:',exact)
          print('historical progress delta:',historical_delta)
          assert parts==[863,77,39]
          assert exact==979
          assert exact==historical_delta
          PY
