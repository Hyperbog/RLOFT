name: CODE.1 residual pass 42
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply pass 42
        run: python3 Code1/fix_residual_pass42.py
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Verify pass 42 accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text()
          ledger=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69360u;' in cpp
          assert '- explicitly classified residual below: **996 bytes**' in ledger
          assert '  - embedded tables: **196 bytes**' in ledger
          assert '  - alignment/zero/padding: **538 bytes**' in ledger
          assert '  - proven generic non-code (alignment/data subtype not uniquely recoverable from preserved evidence): **262 bytes**' in ledger
          assert '- residual still requiring classification: **46 bytes**' in ledger
          assert '## Remaining exact unresolved islands after pass 42' in ledger
          block=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)\n<!-- RESIDUAL-RANGES-END -->',ledger,re.S).group(1)
          rows=[]
          for raw in block.splitlines():
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| ([0-9]+)',raw.strip()); assert m,raw
              a,b=int(m.group(1),16),int(m.group(2),16); n=int(m.group(4)); assert b-a+1==n
              rows.append((a,b,m.group(3)))
          assert sum(b-a+1 for a,b,_ in rows)==996
          assert sum(b-a+1 for a,b,c in rows if c=='alignment')==538
          assert sum(b-a+1 for a,b,c in rows if c=='table')==196
          assert sum(b-a+1 for a,b,c in rows if c=='noncode')==262
          assert 69360 + 996 + 46 == 70402
          for r in [(0x1462,0x1463),(0x6054,0x605f),(0x9bd7,0x9bdf),(0x9c98,0x9c9f),(0x9e89,0x9e8b),(0x9eae,0x9eaf),(0xa00e,0xa00f),(0xa059,0xa05b),(0xa21a,0xa21b),(0xae0b,0xae0b),(0xbe61,0xbe6f)]:
              assert any(a==r[0] and b==r[1] and c=='alignment' for a,b,c in rows),r
          print('pass42 verified: 69360 translated + 996 classified + 46 unresolved = 70402')
          PY
      - name: Commit pass 42
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm Code1/fix_residual_pass42.py
          git add Code1/RESIDUAL_LEDGER.md Code1/PROGRESS.md Code1/STAGING_LEDGER.md Code1/DECOMPILATION_CONTINUITY.md
          git diff --cached --check
          git commit -m "Classify CODE.1 residual pass 42"
          git push origin HEAD:code1-decompilation
