name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Trace progress ledger totals
        run: |
          python3 - <<'PY'
          import re,subprocess
          commits=subprocess.check_output(['git','rev-list','--reverse','code1-decompilation','--','Code1/PROGRESS.md'],text=True).split()
          cur_pat=re.compile(r'Current verified translated bytes:\s*\*\*([0-9,]+)\*\*')
          total_pat=re.compile(r'Total integrated verified translated bytes:\s*\*\*([0-9,]+)\*\*')
          prev=None; rows=[]
          for sha in commits:
              try: body=subprocess.check_output(['git','show',f'{sha}:Code1/PROGRESS.md'],text=True,errors='ignore')
              except subprocess.CalledProcessError: continue
              m=cur_pat.search(body) or total_pat.search(body)
              if not m: continue
              val=int(m.group(1).replace(',',''))
              if val!=prev:
                  subj=subprocess.check_output(['git','show','-s','--format=%s',sha],text=True).strip()
                  rows.append((sha,val,None if prev is None else val-prev,subj))
                  prev=val
          print('PROGRESS LEDGER CHANGES >= 28k')
          for sha,val,delta,subj in rows:
              if val>=28000:
                  ds='initial' if delta is None else f'{delta:+d}'
                  print(f'{sha[:12]} {val:6d} {ds:>8} {subj}')
          print('\nDECREASES')
          for sha,val,delta,subj in rows:
              if delta is not None and delta<0: print(f'{sha[:12]} {val:6d} {delta:+d} {subj}')
          print('\nVALUES 32k..45k')
          for sha,val,delta,subj in rows:
              if 32000<=val<=45000:
                  ds='initial' if delta is None else f'{delta:+d}'
                  print(f'{sha[:12]} {val:6d} {ds:>8} {subj}')
          PY
