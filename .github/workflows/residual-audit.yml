name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Diagnose batch 10 exact intervals
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          script=Path('Code1/integrate_mid_ui_batch_10.py').read_text()
          sa=re.compile(r'static_assert\(0x([0-9A-Fa-f]+)u-0x([0-9A-Fa-f]+)u==([0-9]+)u\)')
          code=[]
          for end,start,n in sa.findall(script):
              a,b,n=int(start,16),int(end,16),int(n)
              if b-a==n:code.append((a,b))
          merged=[]
          for a,b in sorted(code):
              if merged and a<=merged[-1][1]:merged[-1][1]=max(merged[-1][1],b)
              else:merged.append([a,b])
          print('all exact batch10 asserted bytes:',sum(b-a for a,b in merged))
          for a,b in merged:print(f'{a:05X}..{b-1:05X} {b-a}')
          print('\nSCRIPT CHECKPOINT/EXCLUSION LINES')
          for no,line in enumerate(script.splitlines(),1):
              low=line.lower()
              if any(k in low for k in ('3941','3,941','interrupt','excluded','alignment','71c8','767c','87c1')):
                  print(f'{no}: {line[:1200]}')
          selected=[(0x071C8,0x072A0),(0x0767C,0x080BA),(0x08270,0x08336),(0x08398,0x08490),(0x084A0,0x087C2)]
          print('\nBY PROVISIONAL SELECTED SPAN')
          for x,y in selected:
              n=sum(max(0,min(b,y)-max(a,x)) for a,b in merged if b>x and a<y)
              print(f'{x:05X}..{y-1:05X} span={y-x} asserted={n} complement={y-x-n}')
          outside=[]
          for a,b in merged:
              cur=[(a,b)]
              for x,y in selected:
                  nxt=[]
                  for c,d in cur:
                      if y<=c or x>=d:nxt.append((c,d));continue
                      if c<x:nxt.append((c,x))
                      if y<d:nxt.append((y,d))
                  cur=nxt
              outside.extend(cur)
          print('outside provisional spans:',sum(b-a for a,b in outside))
          for a,b in outside:print(f' outside {a:05X}..{b-1:05X} {b-a}')
          PY
