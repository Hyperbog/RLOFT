name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile increased batch 02 byte count
        run: |
          python3 - <<'PY'
          # The checkpoint explicitly lists 884 newly counted helper bytes and
          # simultaneously promotes the two previously uncounted early renderers.
          helpers=[57,159,223,116,79,1,179,70]
          renderer_a=0x649-0x4B0
          renderer_b=0x7E2-0x64C
          helper_total=sum(helpers)
          renderer_total=renderer_a+renderer_b
          exact=helper_total+renderer_total
          print('batch02 helper bytes:',helper_total)
          print('batch02 renderer bytes:',renderer_total)
          print('batch02 exact verified bytes:',exact)
          print('batch02 historical progress delta:',1699)
          assert helper_total==884
          assert renderer_a==409 and renderer_b==406 and renderer_total==815
          assert exact==1699
          PY
