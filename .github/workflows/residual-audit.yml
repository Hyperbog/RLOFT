name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile exact batch 08 byte count
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('Code1/integrate_mid_runtime_batch_08.py').read_text()
          sa=re.compile(r'static_assert\(0x([0-9A-Fa-f]+)u-0x([0-9A-Fa-f]+)u==([0-9]+)u\)')
          ranges=[]
          for end,start,n in sa.findall(s):
              a,b,n=int(start,16),int(end,16),int(n)
              assert b-a==n,(hex(a),hex(b),n)
              ranges.append((a,b))
          ranges.sort()
          assert all(ranges[i][1] <= ranges[i+1][0] for i in range(len(ranges)-1))
          exact=sum(b-a for a,b in ranges)
          advertised=[(0x59AC,0x6054),(0x6184,0x6654),(0x6654,0x6852)]
          raw=sum(b-a for a,b in advertised)
          progress_delta=3671
          print('batch08 exact asserted ranges:',len(ranges))
          print('batch08 exact asserted code bytes:',exact)
          print('batch08 advertised raw span bytes:',raw)
          print('batch08 advertised progress delta:',progress_delta)
          print('delta minus exact asserted:',progress_delta-exact)
          print('delta minus raw advertised spans:',progress_delta-raw)
          print('raw advertised minus exact asserted:',raw-exact)
          print('ranges:')
          for a,b in ranges: print(f'{a:05X}..{b-1:05X} {b-a}')
          assert exact==3384,exact
          assert raw==3446,raw
          assert progress_delta-exact==287
          assert progress_delta-raw==225
          PY
