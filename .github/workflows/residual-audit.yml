name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Trace legacy startup and low-level accounting
        run: |
          echo '=== startup introduction ==='
          git log --all --reverse -S'translate_cc1c_ccdd' --format='COMMIT %H %s' -p -- Code1/Code1.cpp Code1/PROGRESS.md Code1/STAGING_LEDGER.md | head -n 1200
          echo '=== startup inventory 259 history ==='
          git log --all --reverse -S'Startup/recovery regions through `CD96`: **259 bytes**' --format='COMMIT %H %s' -p -- Code1/PROGRESS.md | head -n 1200
          echo '=== low-level introduction ==='
          git log --all --reverse -S'function_dde0' --format='COMMIT %H %s' -p -- Code1/Code1.cpp Code1/PROGRESS.md Code1/STAGING_LEDGER.md | head -n 1600
          echo '=== low-level 663 inventory history ==='
          git log --all --reverse -S'Low-level/runtime port/vector/fill/PIT/conversion routines' --format='COMMIT %H %s' -p -- Code1/PROGRESS.md | head -n 1200
