name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Find explicit non-code comments missing from ledger
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          cpp=Path('Code1/Code1.cpp').read_text()
          ledger=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          lm=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)\n<!-- RESIDUAL-RANGES-END -->',ledger,re.S);assert lm
          covered=[]
          for line in lm.group(1).splitlines():
            m=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \|',line)
            if m: covered.append((int(m.group(1),16),int(m.group(2),16)+1))
          def uncovered(a,b):
            parts=[(a,b)]
            for c,d in covered:
              out=[]
              for x,y in parts:
                if d<=x or c>=y: out.append((x,y)); continue
                if x<c: out.append((x,c))
                if d<y: out.append((d,y))
              parts=out
            return parts

          rows=[]
          range_re=re.compile(r'\b([0-9A-Fa-f]{3,5})\.\.([0-9A-Fa-f]{3,5})\b')
          single_re=re.compile(r'(?<![0-9A-Fa-f])([0-9A-Fa-f]{3,5})(?![0-9A-Fa-f])')
          keywords=('align','padding',' nop','nop.','zero byte','zero bytes','zero/alignment','lookup table','jump table','address table',' is data',' remains data')
          for no,line in enumerate(cpp.splitlines(),1):
            s=line.strip()
            if not s.startswith('//'): continue
            low=' '+s.lower()
            if not any(k in low for k in keywords): continue
            matched=False
            for m in range_re.finditer(s):
              a,b=int(m.group(1),16),int(m.group(2),16)+1
              if not (0<=a<b<=0x11302): continue
              u=uncovered(a,b)
              if u:
                rows.append((no,s,a,b,u)); matched=True
            if matched: continue
            # Single-address comments are accepted only for explicit NOP/alignment wording.
            if any(k in low for k in (' nop','alignment','padding')):
              vals=[]
              for m in single_re.finditer(s):
                v=int(m.group(1),16)
                if 0<=v<0x11302: vals.append(v)
              for v in vals[:1]:
                u=uncovered(v,v+1)
                if u: rows.append((no,s,v,v+1,u))

          seen=set(); total=0
          print('EXPLICIT CURRENT-SOURCE NONCODE COMMENTS NOT FULLY LEDGERED')
          for no,s,a,b,u in rows:
            key=(a,b,tuple(u))
            if key in seen: continue
            seen.add(key)
            n=sum(y-x for x,y in u); total+=n
            print(f'line {no}: {s}')
            print('  source range',f'{a:05X}..{b-1:05X}','uncovered',','.join(f'{x:05X}..{y-1:05X}' for x,y in u),'bytes',n)
          print('candidate uncovered bytes:',total)
          PY
