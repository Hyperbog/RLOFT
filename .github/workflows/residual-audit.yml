name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Mine preserved residual classifications
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('Code1/Code1.cpp').read_text()
          ledger=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          pat=re.compile(r'static_assert\(0x([0-9A-Fa-f]+)u-0x([0-9A-Fa-f]+)u==([0-9]+)u\)')
          iv=[]
          for end,start,n in pat.findall(text):
              a=int(start,16); b=int(end,16); n=int(n)
              if b-a==n and 0<=a<b<=0x11302: iv.append((a,b))
          iv.sort(); merged=[]
          for a,b in iv:
              if merged and a<=merged[-1][1]: merged[-1][1]=max(merged[-1][1],b)
              else: merged.append([a,b])
          gaps=[]; p=0
          for a,b in merged:
              if p<a:gaps.append((p,a))
              p=max(p,b)
          if p<0x11302:gaps.append((p,0x11302))
          lm=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)\n<!-- RESIDUAL-RANGES-END -->',ledger,re.S)
          classified=[]
          for line in lm.group(1).splitlines():
              m=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \|',line)
              if m: classified.append((int(m.group(1),16),int(m.group(2),16)+1))
          def subtract(parts,cuts):
              out=[]
              for a,b in parts:
                  cur=[(a,b)]
                  for c,d in cuts:
                      nxt=[]
                      for x,y in cur:
                          if d<=x or c>=y: nxt.append((x,y)); continue
                          if x<c:nxt.append((x,c))
                          if d<y:nxt.append((d,y))
                      cur=nxt
                  out.extend(cur)
              return out
          remaining=subtract(gaps,classified)
          small=[(a,b) for a,b in remaining if b-a<=32]
          print('small unclassified assert-gap islands:',len(small),'bytes:',sum(b-a for a,b in small))
          strong=('align','padding',' nop','nop ','zero byte','zero bytes','zero/alignment','data/alignment',' is data','jump table','address table','lookup table','excluded')
          files=[]
          for p in Path('Code1').rglob('*'):
              if not p.is_file(): continue
              try: body=p.read_text()
              except UnicodeDecodeError: continue
              files.append((p,body.splitlines()))
          print('\nPRESERVED STRONG-EVIDENCE HITS')
          hit_ranges=[]
          for a,b in small:
              addr_forms=set()
              for v in {a,b-1}:
                  addr_forms.update({f'{v:X}',f'{v:04X}',f'{v:05X}',f'{v:x}',f'{v:04x}',f'{v:05x}'})
              hits=[]
              for p,lines in files:
                  for no,line in enumerate(lines,1):
                      low=line.lower()
                      if not any(k in low for k in strong): continue
                      if any(form in line for form in addr_forms): hits.append((str(p),no,line.strip()))
              if hits:
                  hit_ranges.append((a,b))
                  print(f'[{a:05X}..{b-1:05X} {b-a} bytes]')
                  for p,no,line in hits[:12]: print(f'  {p}:{no}: {line}')
          print('\nstrong-evidence candidate ranges:',len(hit_ranges),'bytes:',sum(b-a for a,b in hit_ranges))
          PY
