name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Trace mouse/copy fold history
        run: |
          echo '=== introduction of function_d08c ==='
          git log --all --reverse -S'function_d08c' --format='COMMIT %H %s' -p -- Code1/Code1.cpp | head -n 500
          echo '=== introduction of function_d1e8 ==='
          git log --all --reverse -S'function_d1e8' --format='COMMIT %H %s' -p -- Code1/Code1.cpp | head -n 500
          echo '=== files/history mentions D08C D153 D1E8 D239 ==='
          git log --all --format='COMMIT %H %s' -p -- Code1 | grep -Ei -B4 -A8 'D08C|D153|D1E8|D239' | head -n 1200 || true
