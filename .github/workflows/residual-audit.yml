name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile exact batch 07 byte count
        run: |
          python3 - <<'PY'
          # Preserved batch-07 evidence defines one raw span and enumerates every
          # alignment/data island excluded from its verified-byte count.
          span=(0x4978,0x59AC)
          excluded=[
            (0x4A0A,0x4A0C),(0x4B17,0x4B18),(0x4C7F,0x4C80),
            (0x4D51,0x4D54),(0x4EEE,0x4EF0),(0x508A,0x508C),
            (0x522F,0x5230),(0x527A,0x527C),(0x52AA,0x52AC),
            (0x53B1,0x53B4),(0x53E2,0x53E4),(0x5451,0x5454),
            (0x550B,0x550C),(0x55DB,0x55DC),(0x577D,0x5780),
            (0x57DB,0x57DC),(0x5879,0x5880)]
          raw=span[1]-span[0]
          excluded_bytes=sum(b-a for a,b in excluded)
          exact=raw-excluded_bytes
          print('batch07 raw span bytes:',raw)
          print('batch07 excluded alignment/data bytes:',excluded_bytes)
          print('batch07 exact verified bytes:',exact)
          print('batch07 historical progress delta:',4111)
          assert raw==4148
          assert excluded_bytes==37
          assert exact==4111
          PY
