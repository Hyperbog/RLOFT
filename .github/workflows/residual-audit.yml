name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Map remaining batch 08 residual gaps
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          script=Path('Code1/integrate_mid_runtime_batch_08.py').read_text()
          ledger=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          sa=re.compile(r'static_assert\(0x([0-9A-Fa-f]+)u-0x([0-9A-Fa-f]+)u==([0-9]+)u\)')
          code=[]
          for end,start,n in sa.findall(script):
              a,b,n=int(start,16),int(end,16),int(n)
              assert b-a==n
              code.append((a,b))
          code.sort()
          spans=[(0x59AC,0x6054),(0x6184,0x6654),(0x6654,0x6852)]
          def subtract(parts,cuts):
              out=[]
              for a,b in parts:
                  cur=[(a,b)]
                  for c,d in cuts:
                      nxt=[]
                      for x,y in cur:
                          if d<=x or c>=y:nxt.append((x,y));continue
                          if x<c:nxt.append((x,c))
                          if d<y:nxt.append((d,y))
                      cur=nxt
                  out.extend(cur)
              return out
          complement=subtract(spans,code)
          assert sum(b-a for a,b in complement)==62
          lm=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)\n<!-- RESIDUAL-RANGES-END -->',ledger,re.S);assert lm
          classified=[]
          for line in lm.group(1).splitlines():
              m=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \|',line)
              if m:classified.append((int(m.group(1),16),int(m.group(2),16)+1))
          remaining=subtract(complement,classified)
          print('batch08 raw advertised bytes:',sum(b-a for a,b in spans))
          print('batch08 exact asserted code bytes:',sum(b-a for a,b in code))
          print('batch08 complement bytes:',sum(b-a for a,b in complement))
          print('already classified complement bytes:',62-sum(b-a for a,b in remaining))
          print('remaining batch08 complement bytes:',sum(b-a for a,b in remaining))
          print('remaining ranges:')
          for a,b in remaining:print(f'{a:05X}..{b-1:05X} {b-a}')
          PY
