name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile exact batch 03 byte count
        run: |
          python3 - <<'PY'
          # Exact static_assert lengths from integrate_mid_ui_batch_03.py.
          lengths=[330,461,252,264,138,125,27]
          exact=sum(lengths)
          print('batch03 exact verified bytes:',exact)
          print('batch03 historical progress delta:',1597)
          assert exact==1597
          # Coarse inventory spans include five internal alignment bytes; exact
          # asserted code, not coarse span length, controls the verified count.
          coarse=(0x15AE-0x1464)+(0x1EE1-0x1A04)+(0x1EFF-0x1EE4)
          print('batch03 coarse span bytes:',coarse)
          print('coarse minus exact:',coarse-exact)
          assert coarse==1602 and coarse-exact==5
          PY
