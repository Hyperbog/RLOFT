name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Find preserved references into unresolved islands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,zlib,base64
          residual=[
            (0x000EB,0x000EC),(0x007E2,0x007E4),(0x01462,0x01464),(0x04977,0x04978),
            (0x06054,0x06060),(0x080BA,0x080BC),(0x0826E,0x08270),(0x08336,0x08338),
            (0x087C2,0x087C4),(0x08E1F,0x08E20),(0x09BD7,0x09BE0),(0x09C98,0x09CA0),
            (0x09E89,0x09E8C),(0x09EAE,0x09EB0),(0x0A00E,0x0A010),(0x0A059,0x0A05C),
            (0x0A21A,0x0A21C),(0x0A5C6,0x0A5C8),(0x0A675,0x0A678),(0x0AE0B,0x0AE0C),
            (0x0BE61,0x0BE70),(0x0CC19,0x0CC1C),(0x0D8CE,0x0D8D0),(0x0DC8D,0x0DC90),
            (0x0DDD8,0x0DDE0),(0x0E3B3,0x0E3B4),(0x0F742,0x0F750),(0x0F7B3,0x0F7B8),
            (0x0F8BD,0x0F8C4),(0x0FC97,0x0FC98)]
          def decoded(p):
              s=p.read_text(errors='ignore')
              m=re.fullmatch(r"import zlib,base64\s*\nexec\(zlib\.decompress\(base64\.b85decode\('(.+)'\)\)\)\s*",s,re.S)
              if m:
                  try:return zlib.decompress(base64.b85decode(m.group(1))).decode('utf-8','replace')
                  except Exception:return s
              return s
          files=[]
          for p in sorted(Path('Code1').glob('*')):
              if p.suffix not in ('.py','.cpp','.md'):continue
              if p.name.startswith(('fix_residual_pass','fix_accounting_pass')):continue
              files.append((p,decoded(p) if p.suffix=='.py' else p.read_text(errors='ignore')))
          for a,b in residual:
              vals=[]
              # Search every address in each small island; require a hex-ish token boundary.
              for v in range(a,b):
                  h=f'{v:X}'
                  rx=re.compile(r'(?i)(?<![0-9A-F])0?'+re.escape(h)+r'(?![0-9A-F])')
                  for p,s in files:
                      for i,line in enumerate(s.splitlines(),1):
                          if rx.search(line):
                              vals.append((v,p.name,i,line.strip()[:700]))
              print(f'\n[{a:05X}..{b-1:05X}] refs={len(vals)}')
              for v,name,i,line in vals[:20]:print(f'  {v:05X} {name}:{i}: {line}')
          PY
