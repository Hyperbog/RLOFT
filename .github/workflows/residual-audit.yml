name: CODE.1 residual verifier
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
      - 'Code1/Code1.cpp'
      - 'Code1/RESIDUAL_LEDGER.md'
      - 'Code1/PROGRESS.md'
      - 'Code1/DECOMPILATION_CONTINUITY.md'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Verify current residual accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text()
          ledger=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69360u;' in cpp
          assert '- verified translated code: **69,360 bytes**' in ledger
          assert '- explicitly classified residual below: **937 bytes**' in ledger
          assert '  - embedded tables: **196 bytes**' in ledger
          assert '  - alignment/zero/padding: **479 bytes**' in ledger
          assert '  - proven generic non-code (alignment/data subtype not uniquely recoverable from preserved evidence): **262 bytes**' in ledger
          assert '- residual still requiring classification: **105 bytes**' in ledger
          assert 69360 + 937 + 105 == 70402
          block=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)\n<!-- RESIDUAL-RANGES-END -->',ledger,re.S).group(1)
          rows=[]
          for raw in block.splitlines():
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| ([0-9]+)',raw.strip()); assert m,raw
              a,b=int(m.group(1),16),int(m.group(2),16); n=int(m.group(4)); assert b-a+1==n
              rows.append((a,b,m.group(3)))
          assert sum(b-a+1 for a,b,_ in rows)==937
          assert sum(b-a+1 for a,b,c in rows if c=='table')==196
          assert sum(b-a+1 for a,b,c in rows if c=='alignment')==479
          assert sum(b-a+1 for a,b,c in rows if c=='noncode')==262
          for x,y in zip(rows,rows[1:]): assert x[1] < y[0],(x,y)
          print('CODE.1 accounting verified: 69360 translated + 937 classified + 105 unresolved = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
