name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Extract residual integration evidence
        run: |
          mkdir -p residual-evidence
          python3 - <<'PY'
          from pathlib import Path
          import re,zlib,base64
          names=[
            'integrate_runtime_startup_batch_12.py','integrate_low_graphics_batch_13.py','integrate_batch14.py',
            'integrate_batch16.py','integrate_batch17.py','integrate_f750.py','integrate_f7b8.py','integrate_f8c4.py',
            'integrate_mid_runtime_batch_08.py','integrate_mid_asset_batch_11.py','integrate_mid_ui_batch_10.py',
            'integrate_runtime_tail_batch.py','fix_tail_script.py']
          wrap=re.compile(r"import zlib,base64\s*\nexec\(zlib\.decompress\(base64\.b85decode\('(.+)'\)\)\)\s*",re.S)
          for name in names:
            p=Path('Code1')/name
            if not p.exists(): continue
            s=p.read_text()
            m=wrap.fullmatch(s)
            if m:
              s=zlib.decompress(base64.b85decode(m.group(1))).decode('utf-8','replace')
            (Path('residual-evidence')/name).write_text(s)
          cpp=Path('Code1/Code1.cpp').read_text()
          targets=[0x000EB,0x01462,0x04977,0x06054,0x087C2,0x08E1F,0x09BD7,0x09C98,0x09E89,0x09EAE,0x0A00E,0x0A059,0x0A21A,0x0A5C6,0x0A675,0x0AE0B,0x0BE61,0x0CC19,0x0D8CE,0x0DDD8,0x0E3B3,0x0F742,0x0F7B3,0x0F8BD,0x0FC97]
          out=[]
          lines=cpp.splitlines()
          for t in targets:
            out.append(f'===== {t:05X} =====')
            pats=(f'{t:X}',f'{t+1:X}',f'{t-1:X}')
            hits=[]
            for i,line in enumerate(lines):
              up=line.upper()
              if any(re.search(r'(?<![0-9A-F])0?'+re.escape(x)+r'(?![0-9A-F])',up) for x in pats):
                hits.append((i,line))
            for i,_ in hits[:8]:
              out.extend(lines[max(0,i-3):min(len(lines),i+4)])
              out.append('---')
          Path('residual-evidence/code1-neighbors.txt').write_text('\n'.join(out))
          PY
      - name: Upload residual integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: code1-residual-integration-evidence
          path: residual-evidence
          retention-days: 7
