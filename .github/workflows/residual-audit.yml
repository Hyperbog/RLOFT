name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Find preserved exclusion evidence missing from ledger
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          ledger=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          lm=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)\n<!-- RESIDUAL-RANGES-END -->',ledger,re.S);assert lm
          covered=[]
          for line in lm.group(1).splitlines():
            m=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \|',line)
            if m: covered.append((int(m.group(1),16),int(m.group(2),16)+1))
          def uncovered(a,b):
            parts=[(a,b)]
            for c,d in covered:
              out=[]
              for x,y in parts:
                if d<=x or c>=y: out.append((x,y)); continue
                if x<c: out.append((x,c))
                if d<y: out.append((d,y))
              parts=out
            return parts

          range_re=re.compile(r'\b([0-9A-Fa-f]{3,5})\.\.([0-9A-Fa-f]{3,5})\b')
          evidence=('alignment','align','padding','zero byte','zero bytes','zero-fill','nop','lookup table','jump table','address table','table data','classified as data','remains data','is data','excluded')
          candidates={}
          for p in sorted(Path('Code1').rglob('*')):
            if not p.is_file() or p.suffix.lower() not in {'.md','.cpp','.py','.txt'}: continue
            try: lines=p.read_text(errors='ignore').splitlines()
            except Exception: continue
            for no,line in enumerate(lines,1):
              low=line.lower()
              if not any(k in low for k in evidence): continue
              for m in range_re.finditer(line):
                a,b=int(m.group(1),16),int(m.group(2),16)+1
                if not (0<=a<b<=0x11302): continue
                u=uncovered(a,b)
                if not u: continue
                key=(a,b)
                candidates.setdefault(key,[]).append((str(p),no,line.strip(),u))

          print('PRESERVED EXCLUSION-RANGE CANDIDATES NOT FULLY LEDGERED')
          total=0
          for (a,b),hits in sorted(candidates.items()):
            # Prefer small exact ranges; broad narrative ranges are printed but not counted as safe.
            u=hits[0][3]; n=sum(y-x for x,y in u)
            exact=(b-a)<=64
            if exact: total+=n
            print(f'[{a:05X}..{b-1:05X}] span={b-a} uncovered={n} exact={exact}')
            print('  uncovered:',','.join(f'{x:05X}..{y-1:05X}' for x,y in u))
            for p,no,line,_ in hits[:6]: print(f'  {p}:{no}: {line[:1200]}')
          print('small/exact candidate uncovered bytes (overlaps possible):',total)
          PY
