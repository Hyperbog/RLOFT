name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile heap-growth byte count
        run: |
          python3 - <<'PY'
          ranges=[(0x1083F,0x10974),(0x109C1,0x10C46)]
          exact=sum(b-a for a,b in ranges)
          historical_delta=954
          print('1083F..10973:',ranges[0][1]-ranges[0][0])
          print('109C1..10C45:',ranges[1][1]-ranges[1][0])
          print('exact verified bytes:',exact)
          print('historical progress delta:',historical_delta)
          assert ranges[0][1]-ranges[0][0]==309
          assert ranges[1][1]-ranges[1][0]==645
          assert exact==954
          assert exact==historical_delta
          PY
