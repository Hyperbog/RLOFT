name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Trace pre-batch-06 progress changes
        run: |
          python3 - <<'PY'
          import re,subprocess
          commits=subprocess.check_output(['git','rev-list','--reverse','code1-decompilation','--','Code1/PROGRESS.md'],text=True).split()
          pats=[re.compile(r'Current verified translated bytes:\s*\*\*([0-9,]+)\*\*'),re.compile(r'Total integrated verified translated bytes:\s*\*\*([0-9,]+)\*\*')]
          prev=None
          for sha in commits:
              try: body=subprocess.check_output(['git','show',f'{sha}:Code1/PROGRESS.md'],text=True,errors='ignore')
              except subprocess.CalledProcessError: continue
              m=next((p.search(body) for p in pats if p.search(body)),None)
              if not m: continue
              val=int(m.group(1).replace(',',''))
              if val==prev: continue
              subj=subprocess.check_output(['git','show','-s','--format=%s',sha],text=True).strip()
              delta=None if prev is None else val-prev
              if val<=28889:
                  print(f'{sha[:12]} value={val} delta={"initial" if delta is None else delta:+} subject={subj}' if delta is not None else f'{sha[:12]} value={val} delta=initial subject={subj}')
              prev=val
          PY
