name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile runtime-tail byte count
        run: |
          python3 - <<'PY'
          start=0x10C6F
          end_exclusive=0x11302
          exact=end_exclusive-start
          historical_delta=1683
          print('runtime-tail range: 10C6F..11301')
          print('exact verified bytes:',exact)
          print('historical progress delta:',historical_delta)
          assert exact==1683
          assert exact==historical_delta
          PY
