name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Decode integration-script evidence around unresolved boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,zlib,base64
          targets=['6054','6060','9BD7','9BE0','BE61','BE70','DDD8','DDE0','F742','F750','F7B3','F7B8','F8BD','F8C4','FC97','FC98']
          def decoded(p):
              s=p.read_text(errors='ignore')
              m=re.fullmatch(r"import zlib,base64\s*\nexec\(zlib\.decompress\(base64\.b85decode\('(.+)'\)\)\)\s*",s,re.S)
              if m:
                  try:return zlib.decompress(base64.b85decode(m.group(1))).decode('utf-8','replace')
                  except Exception as e:
                      print('DECODE_FAIL',p,e);return s
              return s
          hits=0
          for p in sorted(Path('Code1').glob('*.py')):
              s=decoded(p); lines=s.splitlines()
              for i,line in enumerate(lines):
                  up=line.upper()
                  if not any(re.search(r'(?<![0-9A-F])'+t+r'(?![0-9A-F])',up) for t in targets): continue
                  hits+=1
                  print(f'\n=== {p} line {i+1} ===')
                  for q in lines[max(0,i-5):min(len(lines),i+6)]: print(q[:1800])
          print('\nTOTAL_CONTEXT_HITS',hits)
          PY
