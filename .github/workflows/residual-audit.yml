name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile exact batch 04 byte count
        run: |
          python3 - <<'PY'
          ranges=[
            (0x1F24,0x2197),(0x24D4,0x266C),
            (0x28E4,0x2991),(0x2994,0x2A61)]
          exact=sum(b-a for a,b in ranges)
          print('batch04 exact verified bytes:',exact)
          print('batch04 historical progress delta:',1413)
          for a,b in ranges: print(f'{a:05X}..{b-1:05X} {b-a}')
          assert exact==1413
          PY
