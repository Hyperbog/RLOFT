name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Map next residual candidates
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('Code1/Code1.cpp').read_text()
          ledger=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          sa=re.compile(r'static_assert\(0x([0-9A-Fa-f]+)u-0x([0-9A-Fa-f]+)u==([0-9]+)u\)')
          code=[]
          for end,start,n in sa.findall(text):
              a,b,n=int(start,16),int(end,16),int(n)
              if b-a==n and 0<=a<b<=0x11302:code.append((a,b))
          code.sort();merged=[]
          for a,b in code:
              if merged and a<=merged[-1][1]:merged[-1][1]=max(merged[-1][1],b)
              else:merged.append([a,b])
          gaps=[];p=0
          for a,b in merged:
              if p<a:gaps.append((p,a))
              p=max(p,b)
          if p<0x11302:gaps.append((p,0x11302))
          lm=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)\n<!-- RESIDUAL-RANGES-END -->',ledger,re.S);assert lm
          classified=[]
          for line in lm.group(1).splitlines():
              m=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \|',line)
              if m:classified.append((int(m.group(1),16),int(m.group(2),16)+1))
          def subtract(parts,cuts):
              out=[]
              for a,b in parts:
                  cur=[(a,b)]
                  for c,d in cuts:
                      nxt=[]
                      for x,y in cur:
                          if d<=x or c>=y:nxt.append((x,y));continue
                          if x<c:nxt.append((x,c))
                          if d<y:nxt.append((d,y))
                      cur=nxt
                  out.extend(cur)
              return out
          rem=subtract(gaps,classified)
          small=[(a,b) for a,b in rem if b-a<=20]
          print('remaining unclassified assert-gap islands <=20 bytes:',len(small),'bytes',sum(b-a for a,b in small))
          for a,b in small:print(f'{a:05X}..{b-1:05X} {b-a}')
          PY
