name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile exact batch 05 byte count
        run: |
          python3 - <<'PY'
          ranges=[
            (0x2A64,0x2DF9),(0x2DFC,0x3020),(0x3020,0x3135),
            (0x3138,0x3205),(0x3208,0x32F4),(0x32F4,0x334A),
            (0x334C,0x3404),(0x3404,0x37BE),(0x37C0,0x3882),
            (0x3884,0x38A4)]
          exact=sum(b-a for a,b in ranges)
          print('batch05 exact verified bytes:',exact)
          print('batch05 historical progress delta:',3633)
          for a,b in ranges: print(f'{a:05X}..{b-1:05X} {b-a}')
          assert exact==3633
          PY
