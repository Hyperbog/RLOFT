name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Trace large residual boundaries through commit diffs
        run: |
          python3 - <<'PY'
          import subprocess,re
          groups=[
            ('6054..605F','6054|6060|60B2|6184'),
            ('9BD7..9BDF','9BD7|9BE0'),
            ('9C98..9C9F','9C98|9CA0'),
            ('BE61..BE6F','BE61|BE70'),
            ('DDD8..DDDF','DDD8|DDE0'),
            ('F742..F74F','F742|F750'),
            ('F7B3..F7B7','F7B3|F7B8'),
            ('F8BD..F8C3','F8BD|F8C4')]
          for label,pat in groups:
            print('\n===== '+label+' =====')
            cmd=['git','log','--all','--date-order','--format=COMMIT %H %s','-p','-G',pat,'--','Code1']
            try:s=subprocess.check_output(cmd,text=True,errors='replace')
            except subprocess.CalledProcessError as e:s=e.output or ''
            # Keep only hunks containing a boundary token plus nearby lines.
            lines=s.splitlines(); out=[]
            for i,line in enumerate(lines):
              if re.search(pat,line,re.I):
                lo=max(0,i-6);hi=min(len(lines),i+10)
                chunk='\n'.join(lines[lo:hi])
                if chunk not in out: out.append(chunk)
            for chunk in out[:18]: print(chunk+'\n---')
            print('MATCHING_CONTEXTS',len(out))
          PY
