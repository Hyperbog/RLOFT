name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Trace verified counter history
        run: |
          python3 - <<'PY'
          import re,subprocess
          commits=subprocess.check_output(['git','rev-list','--reverse','code1-decompilation','--','Code1/Code1.cpp'],text=True).split()
          pat=re.compile(r'kVerifiedTranslatedBytes\s*=\s*([0-9]+)u')
          prev=None
          rows=[]
          for sha in commits:
              try:
                  body=subprocess.check_output(['git','show',f'{sha}:Code1/Code1.cpp'],text=True,errors='ignore')
              except subprocess.CalledProcessError:
                  continue
              m=pat.search(body)
              if not m:continue
              val=int(m.group(1))
              if val!=prev:
                  subj=subprocess.check_output(['git','show','-s','--format=%s',sha],text=True).strip()
                  rows.append((sha,val,None if prev is None else val-prev,subj))
                  prev=val
          print('VERIFIED COUNTER CHANGES')
          for sha,val,delta,subj in rows:
              if val>=28000 or any(k in subj.lower() for k in ('batch 07','batch 08','batch 09','batch 10','batch 11','batch 12','account','audit')):
                  ds='initial' if delta is None else f'{delta:+d}'
                  print(f'{sha[:12]}  {val:6d}  {ds:>8}  {subj}')
          print('\nDECREASES / CORRECTIONS')
          for sha,val,delta,subj in rows:
              if delta is not None and delta<0:
                  print(f'{sha[:12]}  {val:6d}  {delta:+d}  {subj}')
          print('\nBATCH08 ANCHOR')
          for sha,val,delta,subj in rows:
              if 'batch 08' in subj.lower() or (36000<=val<=37000):
                  ds='initial' if delta is None else f'{delta:+d}'
                  print(f'{sha[:12]}  {val:6d}  {ds:>8}  {subj}')
          print('\nCURRENT',rows[-1][1] if rows else 'missing')
          PY
