name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile integration-script byte accounting
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          sa=re.compile(r'static_assert\(0x([0-9A-Fa-f]+)u-0x([0-9A-Fa-f]+)u==([0-9]+)u\)')
          repl=re.compile(r"kVerifiedTranslatedBytes=([0-9]+)u.*?kVerifiedTranslatedBytes=([0-9]+)u",re.S)
          print('INTEGRATOR ASSERT/COUNTER RECONCILIATION')
          for p in sorted(Path('Code1').glob('*.py')):
              if not (p.name.startswith('integrate_') or p.name.startswith('fix_')): continue
              s=p.read_text(errors='ignore')
              ranges=[]
              for end,start,n in sa.findall(s):
                  a,b,n=int(start,16),int(end,16),int(n)
                  if b-a==n: ranges.append((a,b))
              if not ranges: continue
              # unique union of all machine intervals explicitly introduced/referenced by script
              merged=[]
              for a,b in sorted(set(ranges)):
                  if merged and a<=merged[-1][1]: merged[-1][1]=max(merged[-1][1],b)
                  else: merged.append([a,b])
              asum=sum(b-a for a,b in merged)
              deltas=[]
              # capture common replacement forms locally, not across the whole file greedily
              for m in re.finditer(r"replace\([^\n]*kVerifiedTranslatedBytes=([0-9]+)u[^\n]*kVerifiedTranslatedBytes=([0-9]+)u",s):
                  old,new=map(int,m.groups()); deltas.append(new-old)
              for m in re.finditer(r"old_total\s*=\s*([0-9]+).*?new_total\s*=\s*([0-9]+)",s,re.S):
                  old,new=map(int,m.groups()); deltas.append(new-old)
              print(f'\n{p.name}: asserts={len(ranges)} merged={len(merged)} bytes={asum} deltas={deltas}')
              if len(merged)<=24:
                  print(' intervals:', ' '.join(f'{a:05X}..{b-1:05X}' for a,b in merged))
              # Print explicit accounting/exclusion commentary in this script.
              for no,line in enumerate(s.splitlines(),1):
                  low=line.lower()
                  if any(k in low for k in ('verified bytes','integrated **','excluding','excluded','alignment','zero bytes','table data','lookup data','not counted')):
                      if re.search(r'[0-9A-Fa-f]{4,5}',line): print(f'  L{no}: {line.strip()[:420]}')
          PY
