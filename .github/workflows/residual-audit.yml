name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Inspect decoded batch 12 local gaps
        run: |
          python3 - <<'PY'
          import ast,base64,zlib,re
          from pathlib import Path
          src=Path('Code1/integrate_runtime_startup_batch_12.py').read_text()
          tree=ast.parse(src)
          strings=[n.value for n in ast.walk(tree) if isinstance(n,ast.Constant) and isinstance(n.value,str)]
          decoded=zlib.decompress(base64.b85decode(max(strings,key=len))).decode()
          lines=decoded.splitlines()
          print('DECODED LINES 60..82')
          for no in range(60,83):
              if no<=len(lines):print(f'{no}: {lines[no-1]}')
          print('\nCURRENT REPOSITORY HITS FOR UNRESOLVED BATCH12 GAP ADDRESSES')
          targets=['9C98','9C9F','9E89','9E8B','9EAE','9EAF','A00E','A00F','A5C6','A5C7','A675','A677']
          for p in Path('Code1').rglob('*'):
              if not p.is_file():continue
              try:body=p.read_text()
              except UnicodeDecodeError:continue
              for no,line in enumerate(body.splitlines(),1):
                  up=line.upper()
                  if any(re.search(r'(?<![0-9A-F])'+t+r'(?![0-9A-F])',up) for t in targets):
                      print(f'{p}:{no}: {line[:900]}')
          PY
