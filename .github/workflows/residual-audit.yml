name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply residual pass 41
        run: python3 Code1/fix_residual_pass41.py
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Verify pass 41 accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          ledger=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          assert '- explicitly classified residual below: **937 bytes**' in ledger
          assert '- residual still requiring classification: **105 bytes**' in ledger
          assert '## Remaining exact unresolved islands after pass 41' in ledger
          block=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)\n<!-- RESIDUAL-RANGES-END -->',ledger,re.S).group(1)
          rows=[]
          for raw in block.splitlines():
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| ([0-9]+)',raw.strip()); assert m,raw
              a,b=int(m.group(1),16),int(m.group(2),16); rows.append((a,b,m.group(3)))
          assert sum(b-a+1 for a,b,_ in rows)==937
          assert sum(b-a+1 for a,b,c in rows if c=='noncode')==262
          assert any(a==0xA5C6 and b==0xA5C7 and c=='noncode' for a,b,c in rows)
          assert any(a==0xA675 and b==0xA677 and c=='noncode' for a,b,c in rows)
          print('pass41 accounting verified: classified=937 unresolved=105 translated=69360')
          PY
      - name: Commit pass 41 results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Code1/RESIDUAL_LEDGER.md Code1/PROGRESS.md Code1/STAGING_LEDGER.md Code1/DECOMPILATION_CONTINUITY.md
          git diff --cached --check
          git commit -m "Classify CODE.1 residual pass 41"
          git push origin HEAD:code1-decompilation
