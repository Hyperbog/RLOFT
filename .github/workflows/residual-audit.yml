name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Inspect batch 08 gap evidence
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('Code1/integrate_mid_runtime_batch_08.py').read_text()
          targets=[
            (0x6054,0x605f),(0x631f,0x631f),(0x633b,0x633b),(0x6357,0x6357),
            (0x63a2,0x63a3),(0x63b7,0x63b7),(0x63d5,0x63d7),(0x63f1,0x63f3),
            (0x6409,0x640b),(0x648d,0x648f),(0x6632,0x6633),(0x6672,0x6673),
            (0x66a7,0x66a7),(0x6743,0x6743),(0x67c7,0x67c7),(0x67f2,0x67f3),
            (0x6823,0x6823)]
          lines=s.splitlines()
          print('BATCH08 TARGET REFERENCES')
          for a,b in targets:
              hits=[]
              for no,line in enumerate(lines,1):
                  up=line.upper()
                  forms=[]
                  for v in {a,b}:
                      forms += [f'{v:X}',f'{v:04X}',f'{v:05X}']
                  if any(re.search(r'(?<![0-9A-F])'+re.escape(f)+r'(?![0-9A-F])',up) for f in forms):
                      hits.append((no,line.strip()))
              print(f'[{a:05X}..{b:05X}]')
              for no,line in hits[:12]: print(f'  {no}: {line[:1200]}')
          print('\nALL EXPLICIT ALIGNMENT/ZERO/PADDING LINES')
          for no,line in enumerate(lines,1):
              low=line.lower()
              if any(k in low for k in ('alignment',' padding','nop','zero byte','zero/alignment')):
                  print(f'{no}: {line[:1200]}')
          # Show exact code asserts and complements only for 6184..6851, without
          # treating the stale aggregate prose total as evidence.
          sa=re.compile(r'static_assert\(0x([0-9A-Fa-f]+)u-0x([0-9A-Fa-f]+)u==([0-9]+)u\)')
          code=[]
          for end,start,n in sa.findall(s):
              a,b,n=int(start,16),int(end,16),int(n)
              if b-a==n and 0x6184<=a and b<=0x6852: code.append((a,b))
          merged=[]
          for a,b in sorted(code):
              if merged and a<=merged[-1][1]:merged[-1][1]=max(merged[-1][1],b)
              else:merged.append([a,b])
          print('\n6184..6851 span',0x6852-0x6184,'asserted',sum(b-a for a,b in merged),'complement',(0x6852-0x6184)-sum(b-a for a,b in merged))
          comp=[];p=0x6184
          for a,b in merged:
              if p<a:comp.append((p,a))
              p=max(p,b)
          if p<0x6852:comp.append((p,0x6852))
          for a,b in comp:print(f' complement {a:05X}..{b-1:05X} {b-a}')
          PY
