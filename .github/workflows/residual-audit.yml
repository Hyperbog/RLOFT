name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile exact batch 06 byte count
        run: |
          python3 - <<'PY'
          # Preserved batch-06 integration lists the exact translated subranges.
          ranges=[
            (0x38A4,0x3C55),(0x3C58,0x40FB),(0x40FC,0x44E1),
            (0x44E4,0x451F),(0x4520,0x45EF),(0x45FC,0x4977)]
          exact=sum(b-a for a,b in ranges)
          print('batch06 exact verified bytes:',exact)
          print('batch06 historical progress delta:',4286)
          for a,b in ranges: print(f'{a:05X}..{b-1:05X} {b-a}')
          assert exact==4286
          PY
