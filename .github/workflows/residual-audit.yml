name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Inspect historical context around large residual boundaries
        run: |
          python3 - <<'PY'
          import re,subprocess
          targets=['6054','6060','9BD7','9BE0','BE61','BE70','DDD8','DDE0','F742','F750','F7B3','F7B8','F8BD','F8C4','FC97','FC98']
          history=subprocess.check_output(['git','log','--all','--format=@@COMMIT %H %s','-p','--','Code1'],text=True,errors='ignore').splitlines()
          current='unknown'
          seen=set()
          for i,line in enumerate(history):
              if line.startswith('@@COMMIT '): current=line
              up=line.upper()
              if not any(re.search(r'(?<![0-9A-F])'+t+r'(?![0-9A-F])',up) for t in targets): continue
              # Skip enormous compressed payload lines; they cannot provide readable neighborhood evidence.
              if len(line)>3000: continue
              key=(current,i)
              if key in seen: continue
              seen.add(key)
              lo=max(0,i-4); hi=min(len(history),i+5)
              print('\n===',current,'===')
              for j in range(lo,hi):
                  if len(history[j])<=3000: print(history[j][:2000])
          PY
