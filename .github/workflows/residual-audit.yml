name: CODE.1 residual audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/residual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Reconcile batch 09 residual complement
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          script=Path('Code1/integrate_mid_graphics_batch_09.py').read_text()
          ledger=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          sa=re.compile(r'static_assert\(0x([0-9A-Fa-f]+)u-0x([0-9A-Fa-f]+)u==([0-9]+)u\)')
          code=[]
          for end,start,n in sa.findall(script):
              a,b,n=int(start,16),int(end,16),int(n)
              if b-a==n: code.append((a,b))
          selected=[(0x06854,0x071C8),(0x072A0,0x0766A)]
          code_in=[]
          for a,b in code:
              if any(x<=a and b<=y for x,y in selected): code_in.append((a,b))
          merged=[]
          for a,b in sorted(code_in):
              if merged and a<=merged[-1][1]: merged[-1][1]=max(merged[-1][1],b)
              else: merged.append([a,b])
          code_bytes=sum(b-a for a,b in merged)
          span_bytes=sum(y-x for x,y in selected)
          assert code_bytes==3324,(code_bytes,merged)
          assert span_bytes==3390,span_bytes
          complement=[]
          for x,y in selected:
              p=x
              for a,b in merged:
                  if b<=x or a>=y: continue
                  aa=max(a,x); bb=min(b,y)
                  if p<aa: complement.append((p,aa))
                  p=max(p,bb)
              if p<y: complement.append((p,y))
          assert sum(b-a for a,b in complement)==66
          lm=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)\n<!-- RESIDUAL-RANGES-END -->',ledger,re.S); assert lm
          classified=[]
          for line in lm.group(1).splitlines():
              m=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \|',line)
              if m: classified.append((int(m.group(1),16),int(m.group(2),16)+1))
          def subtract(parts,cuts):
              out=[]
              for a,b in parts:
                  cur=[(a,b)]
                  for c,d in cuts:
                      nxt=[]
                      for x,y in cur:
                          if d<=x or c>=y:nxt.append((x,y));continue
                          if x<c:nxt.append((x,c))
                          if d<y:nxt.append((d,y))
                      cur=nxt
                  out.extend(cur)
              return out
          novel=subtract(complement,classified)
          overlap=66-sum(b-a for a,b in novel)
          print('batch09 selected span bytes:',span_bytes)
          print('batch09 exact asserted code bytes:',code_bytes)
          print('batch09 proven complement bytes:',66)
          print('already classified overlap:',overlap)
          print('new classifiable bytes:',sum(b-a for a,b in novel))
          print('\nBATCH09 COMPLEMENT')
          for a,b in complement: print(f'{a:05X}..{b-1:05X} {b-a:3d}')
          print('\nNOVEL BATCH09 CLASSIFICATIONS')
          for a,b in novel: print(f'{a:05X}..{b-1:05X} {b-a:3d}')
          PY
