name: Integrate CODE.2 batch 17
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch17.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 17
        run: python3 Code2/integrate_batch17.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 56834u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1009u;' in cpp
          assert 'static_assert(0x0B6F1u-0x0B518u==473u);' in cpp
          assert 'static_assert(0x0B73Du-0x0B6F4u==73u);' in cpp
          assert 'static_assert(0x0C6D7u-0x0B950u==3463u);' in cpp
          assert 'void (*call_1c77c)(u32,u32)=nullptr;' in cpp
          assert 'b.call_1c77c(token,0x320u);' in cpp
          assert 'if(rank==6u)counter=value;' in cpp
          assert 'else if(rank==7u)offset=value;' in cpp
          assert 'else if(rank==8u)threshold=value;' in cpp
          assert 'result=0xFFFFFFFEu;' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,z,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); z=int(z,16); n=int(n)
              assert z-a+1==n,(line,z-a+1,n)
              total+=n
          assert total==1009,total
          assert 56834+total==57843
          assert 239698-57843==181855
          assert '**57,843 / 239,698 = 24.1316% (24.13%)**' in prog
          print('CODE.2 batch 17 accounting verified: 56834 + 1009 = 57843')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch17.zb64 Code2/integrate_batch17.py .github/workflows/integrate-code2-batch17.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 17'
          git push origin code1-decompilation
