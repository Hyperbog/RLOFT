name: Native Original Startup - Windows CI

on:
  push:
    branches: [native-engine]
    paths:
      - 'Shared/StartupPresentation/**'
      - 'Shared/BootFlow/**'
      - 'NativeEngine/src/native_startup_visuals.cpp'
      - 'NativeEngine/src/native_original_startup_audit_main.cpp'
      - 'NativeEngine/tests/native_startup_visuals_tests.cpp'
      - 'NativeEngine/src/win32_native_startup.cpp'
      - 'NativeEngine/src/win32_native_gpu_exploration.cpp'
      - 'NativeEngine/src/native_party_start.cpp'
      - 'NativeEngine/include/rloft_native/native_party_start.hpp'
      - 'NativeEngine/tests/native_party_start_tests.cpp'
      - 'NativeEngine/include/rloft_native/native_win32_gpu_exploration.hpp'
      - 'NativeEngine/include/rloft_native/native_startup_visuals.hpp'
      - 'NativeEngine/include/rloft_native/native_win32_startup.hpp'
      - 'NativeEngine/src/win32_native_assets.cpp'
      - 'NativeEngine/CMakeLists.txt'
      - '.github/workflows/native-startup-windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-source-original-startup-windows
  cancel-in-progress: false

jobs:
  windows-startup-build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out exact verified native-engine source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out original owner-source media read-only for startup validation
        uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: original-source
          persist-credentials: false
          sparse-checkout: |
            MASTER/Ravenloft - Strahd's Possession/RLOFT
            MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT
          sparse-checkout-cone-mode: false
      - name: Install Python for native original-media fixture
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone Windows x64 NativeEngine with shared CODE.2 startup window
        shell: pwsh
        run: |
          & ./NativeEngine/Windows/Build-NativeAssets-Windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render actual original startup source without modifying game media
        shell: pwsh
        run: |
          $media = Join-Path (Get-Location) "original-source/MASTER/Ravenloft - Strahd's Possession/RLOFT"
          if (-not (Test-Path (Join-Path $media "RES0"))) {
            throw "Original installed game RES0 is absent"
          }
          $files = @("RES0", "RES1", "RES7", "RES8", "CODE.1", "OBJECTS.DAT", "LEVELS.DAT", "T", "COLORS", "INIT")
          $before = @($files | ForEach-Object {
            (Get-FileHash -LiteralPath (Join-Path $media $_) -Algorithm SHA256).Hash
          })
          $audit = Join-Path (Get-Location) "build/native-assets-windows-x64/Release/rloft_native_startup_audit.exe"
          if (-not (Test-Path $audit)) { throw "Original startup audit was not built" }
          $reportText = & $audit $media
          if ($LASTEXITCODE -ne 0) { throw "Real original CODE.2/CODE.1 startup composition failed" }
          $report = ($reportText | Out-String) | ConvertFrom-Json
          if ($report.character_opening_frames -ne 70) {
            throw "Expected 70 source-backed CODE.1 opening frames"
          }
          if ($report.character_equipment_rows_verified -ne 90) {
            throw "Expected 90 original CODE.1 starting-equipment source rows"
          }
          if ($report.original_first_party_level -ne 22 -or
              -not $report.original_first_party_spawn_cell_passable) {
            throw "Original LEVELS.DAT level22 (4,4) party start was not certified"
          }
          if ($report.writes_to_original -ne 0) {
            throw "Original media mutation detected in startup audit report"
          }
          $after = @($files | ForEach-Object {
            (Get-FileHash -LiteralPath (Join-Path $media $_) -Algorithm SHA256).Hash
          })
          for ($i = 0; $i -lt $files.Length; ++$i) {
            if ($before[$i] -cne $after[$i]) {
              throw "Original game $($files[$i]) changed during startup audit"
            }
          }
          Write-Host "NATIVE_REAL_ORIGINAL_CODE2_CODE1_STARTUP_SOURCE_PASS"
      - name: Verify actual shipped CINE00/CINE12 ANM frames and immutable CD source
        shell: pwsh
        run: |
          $media = Join-Path (Get-Location) "original-source/MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT"
          $files = @("CINE00.ANM", "CINE12.ANM", "RES0", "T", "COLORS")
          foreach ($name in $files) {
            if (-not (Test-Path (Join-Path $media $name))) {
              throw "Original CD source $name missing"
            }
          }
          $before = @($files | ForEach-Object {
            (Get-FileHash -LiteralPath (Join-Path $media $_) -Algorithm SHA256).Hash
          })
          $audit = Join-Path (Get-Location) "build/native-assets-windows-x64/Release/rloft_native_anm_audit.exe"
          if (-not (Test-Path $audit)) { throw "Original ANM audit executable missing" }
          & $audit $media
          if ($LASTEXITCODE -ne 0) { throw "Original ANM decoder failed on owner-source CINE00/CINE12" }
          $after = @($files | ForEach-Object {
            (Get-FileHash -LiteralPath (Join-Path $media $_) -Algorithm SHA256).Hash
          })
          for ($i = 0; $i -lt $files.Length; ++$i) {
            if ($before[$i] -cne $after[$i]) {
              throw "Read-only original CD file $($files[$i]) changed"
            }
          }
          Write-Host "NATIVE_ORIGINAL_CINE00_CINE12_FRAME_PASS"
      - name: Preserve checksum-tagged media-free Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RLOFT-Native-A1-Original-Startup-Windows-x64
          path: |
            NativeEngine/Windows/dist/RLOFT-NativeEngine-Windows-x64-ASSET-PREVIEW.zip
            NativeEngine/Windows/dist/RLOFT-NativeEngine-Windows-x64-ASSET-PREVIEW.zip.sha256
          if-no-files-found: error
          retention-days: 30
