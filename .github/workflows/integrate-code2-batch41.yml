name: Integrate CODE.2 batch 41

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch41.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 41
        run: python Code2/.integrate_batch41.py
      - name: Verify accounting and anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 122860u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2456u;' in code
          assert '**125,316 / 239,698 = 52.2808% (52.28%)**' in progress
          assert 'void function_1c77c(Machine& m,Application41Boundary& b,u32 slot,u32 text_index) noexcept' in code
          assert '*dg(m,0xC050u)^=1u; // encoded XOR BYTE PTR; upper three bytes are untouched.' in code
          assert 'static constexpr u32 kFunction1ca2cDispatch[35]' in code
          assert '0x1CD15u,0x1CCF8u,0x1CCDBu,0x1CC59u,0x1CC68u,0x1CD32u,0x1CA7Au' in code
          assert 'function_1c924(m,b,text):function_1ca2c(m,criteria[i]);' in code
          assert 'static_assert((0x1C924u-0x1C77Cu)+(0x1C99Fu-0x1C924u)+' in code
          assert '1C9A0..1CA2B | table | 140' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2456,total
          assert 122860+2456==125316
          assert 239698-125316==114382
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch41_fragment.cpp Code2/.integrate_batch41.py .github/workflows/integrate-code2-batch41.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 41"
          git push origin HEAD:code1-decompilation
