name: Integrate CODE.2 batch 47
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch47.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 47
        run: python Code2/integrate_batch47.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 141234u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2670u;' in c
          assert 'static_assert(0x210AFu-0x20E08u==679u);' in c
          assert 'static_assert(0x21702u-0x214B8u==586u);' in c
          assert 'MOVZX word followed by CMP -1 cannot recognize FFFFh' in c
          assert 'const u32 env_base_after=load_le32(dg(m,0x255D8u));' in c
          assert 'store_le16(dg(m,0x2193Cu+actor_off+slot*2u),static_cast<u16>(current));' in c
          assert '**143,904 / 239,698 = 60.0355% (60.04%)**' in p
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2670,total
          print('accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary integration files
        run: |
          rm -f Code2/batch47.staging.cpp Code2/integrate_batch47.py .github/workflows/integrate-code2-batch47.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 47'
          git push origin HEAD:code1-decompilation
