name: Integrate CODE.2 Batch 102
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch102.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 102
        run: |
          git merge-base --is-ancestor 97ab11795a2e7b45951a980b47cb61f95ca57ddf HEAD
          test "$(git hash-object Code2/.batch102.fragment.cpp)" = "fe2b7f43dd8466a8d9daf2cd023f6f22b50bf665"
          test "$(git hash-object Code2/.batch102_integrate.py)" = "c6cd701986cab0b053209a6a1304ecd6703e2b11"
          grep -F 'static_assert(0x33E6Bu-0x33E28u==67u);' Code2/.batch102.fragment.cpp
      - name: Integrate Batch 102
        run: python Code2/.batch102_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch102_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime102Boundary','function_33de0','function_33e28','rep_stosb_es','0x50F8u','0x148u','0xFE94u+ebx','edi-=0x90u','edi+=0x10u']:
              assert x in c,x
          for x in ['33E26..33E27 | alignment | 2','33E6B..33E6B | alignment | 1']:
              assert x in l,x
          assert '219,528 / 239,698 = 91.5852% (91.59%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 102
        run: |
          cp Code2/.batch102_integrate.py /tmp/batch102_integrate.py
          rm -f Code2/.batch102.fragment.cpp Code2/.batch102_integrate.py .github/workflows/integrate-code2-batch102.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 102"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch102_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`33E6C`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 102"
          git push origin HEAD:code1-decompilation
