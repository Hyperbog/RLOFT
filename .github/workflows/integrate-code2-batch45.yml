name: Integrate CODE.2 batch 45
# retrigger after replacing the corrupted compressed payload
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch45.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 45
        run: python Code2/integrate_batch45.py
      - name: Verify accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 136130u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2634u;' in c
          assert 'static_assert(0x20294u-0x1FC14u==1664u);' in c
          assert '1F858..1F86B | table | 20' in l
          assert '**Total proven non-code/data:** **2,634 bytes**.' in l
          assert '**138,764 / 239,698 = 57.8912% (57.89%)**' in p
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2634,total
          print('accounting/anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm -f Code2/batch45.zb64 Code2/integrate_batch45.py .github/workflows/integrate-code2-batch45.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 45'
          git push origin HEAD:code1-decompilation
