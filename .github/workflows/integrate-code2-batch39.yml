name: Integrate CODE.2 batch 39

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch39.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 39
        run: python Code2/.integrate_batch39.py
      - name: Verify accounting and anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 120353u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2311u;' in code
          assert '**122,664 / 239,698 = 51.1744% (51.17%)**' in progress
          assert 'void function_1c0c0(Machine& m,u32 raw_value) noexcept' in code
          assert 'return app39_sar32(selected,count); // SAR returns FFFFFFFFh for selected bit 31.' in code
          assert 'if(now<=load_le32(dg(m,0xCF54u)))return; // encoded unsigned JBE.' in code
          assert 'const u32 product=random*sides;' in code
          assert 'b.call_3131c(index*4u+4u,0u,handle0);' in code
          assert 'while(length!=0u)' in code
          assert '==829u);' in code
          assert '1C121..1C123 | alignment | 3' in ledger
          assert '1C409..1C40B | alignment | 3' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2311,total
          assert 120353+2311==122664
          assert 239698-122664==117034
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch39_fragment.cpp Code2/.integrate_batch39.py .github/workflows/integrate-code2-batch39.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 39"
          git push origin HEAD:code1-decompilation
