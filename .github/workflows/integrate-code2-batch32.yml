name: Integrate CODE.2 batch 32

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch32.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 32
        run: python Code2/.integrate_batch32.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 106569u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2147u;' in code
          assert '**106,569**' in progress and '**2,147**' in progress
          assert '**108,716 / 239,698 = 45.3554% (45.36%)**' in progress
          assert 'void function_181b4(Machine& m,Application32Boundary& b,s32 target_level) noexcept' in code
          assert 'bool legacy=false;' in code
          assert 'live_ebx=3u;' in code
          assert 'app32_read_local(b,ignored_count,2u,handle);' in code
          assert 'if(static_cast<s32>(text_count)<0x7FF)' in code
          assert 'b.early->call_1c160(0x20u,live_ebx)' in code
          assert 'b.call_30d30(0x198E0u,0u,0x8000u);' in code
          assert 'static_assert(0x18D8Cu-0x181B4u==3032u);' in code
          assert '18D8C..18D8F | noncode | 4' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2147,total
          assert 106569+2147==108716
          assert 239698-108716==130982
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch32_fragment.cpp.gz.b64 Code2/.integrate_batch32.py .github/workflows/integrate-code2-batch32.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 32"
          git push origin HEAD:code1-decompilation
