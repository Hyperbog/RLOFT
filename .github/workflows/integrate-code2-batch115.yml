name: Integrate CODE.2 Batch 115
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch115.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 115
        run: |
          git merge-base --is-ancestor f4439f832c2f2c499dd50ad8ceeae1c13f01587e HEAD
          test "$(git hash-object Code2/.batch115.fragment.cpp)" = "d4774347ce3c646ea904840b41baefb2077407ad"
          test "$(git hash-object Code2/.batch115_integrate.py)" = "03350584d09290150c8bf1be31c98125ea6e0a55"
          grep -F 'static_assert(0x358D1u-0x35878u==89u);' Code2/.batch115.fragment.cpp
          grep -F 'static_assert(0x358D4u-0x358D1u==3u);' Code2/.batch115.fragment.cpp
          grep -F 'REPNE MOVSD/MOVSB' Code2/.batch115.fragment.cpp
      - name: Integrate Batch 115
        run: python Code2/.batch115_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch115_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          for x in ['Runtime115Boundary','function_35878','copy_ds_to_es','call_38407','call_38106','call_3967c']:
              assert x in c,x
          assert 'b.copy_ds_to_es(m.cpu.ds,source+offset,m.cpu.es,destination,length);' in c
          assert 'b.call_38407(source,offset,0u)' in c
          assert 'b.call_38106(source,destination,length)' in c
          assert 'b.call_3967c?b.call_3967c(source):0u' in c
          assert 'constexpr u32 kVerifiedTranslatedBytes = 221820u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 4468u;' in c
          assert '226,288 / 239,698 = 94.4055% (94.41%)' in p
          assert '358D1..358D3 | alignment | 3' in l
          PY
          git diff --check
      - name: Commit substantive Batch 115
        run: |
          cp Code2/.batch115_integrate.py /tmp/batch115_integrate.py
          rm -f Code2/.batch115.fragment.cpp Code2/.batch115_integrate.py .github/workflows/integrate-code2-batch115.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 115"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch115_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`358D4`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 115"
          git push origin HEAD:code1-decompilation
