name: DOSDis Windows desktop build and synthetic regressions
# Owner-approved automatic desktop verification (2026-10-11).
# Scoped to DOSDis code and tests. Never include proprietary DOS game files.
on:
  workflow_dispatch:
  push:
    branches:
      - disassembler-foundation
    paths:
      - '.github/workflows/disassembler-core.yml'
      - 'Tools/Disassembler/src/**'
      - 'Tools/Disassembler/tests/**'
      - 'Tools/Disassembler/build-windows.ps1'
      - 'Tools/Disassembler/Directory.Build.*'
      - 'Tools/Disassembler/*.sln*'
  pull_request:
    branches:
      - disassembler-foundation
    paths:
      - '.github/workflows/disassembler-core.yml'
      - 'Tools/Disassembler/src/**'
      - 'Tools/Disassembler/tests/**'
      - 'Tools/Disassembler/build-windows.ps1'
      - 'Tools/Disassembler/Directory.Build.*'
      - 'Tools/Disassembler/*.sln*'
permissions:
  contents: read
concurrency:
  group: dosdis-win-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows desktop and regression test projects
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @(
            'src/DosDis.Desktop/DosDis.Desktop.csproj',
            'tests/DosDis.Smoke/DosDis.Smoke.csproj',
            'tests/DosDis.ProjectSmoke/DosDis.ProjectSmoke.csproj'
          )) {
            dotnet build $project --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run synthetic tests (no original game files)
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet run --project tests/DosDis.Smoke --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/DosDis.ProjectSmoke --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable self-contained Windows desktop
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet publish src/DosDis.Desktop/DosDis.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/windows-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md,THIRD_PARTY_NOTICES.md -Destination dist/windows-desktop/
          $benchmark = 'dist/windows-desktop/benchmarks/strahd-code1-object1-classification.json'
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "Windows desktop package is missing original-free CODE.1 benchmark manifest"
          }
          $reference = Get-Content -LiteralPath $benchmark -Raw | ConvertFrom-Json
          if ($reference.objectByteLength -ne 70402 -or
              $reference.expectedTranslatedBytes -ne 69361 -or
              $reference.expectedExcludedBytes -ne 1041 -or
              $reference.exclusions.Count -ne 282) {
            throw "Packaged CODE.1 classification reference differs from pinned ledger"
          }
          Write-Host "PASS: desktop package includes pinned original-byte-free CODE.1 benchmark manifest"
      - name: Upload Windows desktop preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOSDis-Desktop-win-x64-preview
          path: Tools/Disassembler/dist/windows-desktop/
          if-no-files-found: error
          retention-days: 30
