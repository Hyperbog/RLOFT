name: Windows DOS disassembler core smoke tests
# Manual only — no GitHub Actions minutes on push or PR.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build core CLI and synthetic fixtures
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build src/DosDis.Cli/DosDis.Cli.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/DosDis.Smoke/DosDis.Smoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows desktop and persistence smoke project
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet build src/DosDis.Desktop/DosDis.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/DosDis.ProjectSmoke/DosDis.ProjectSmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run synthetic smoke test suite (no game files)
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet run --project tests/DosDis.Smoke --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run SQLite project persistence smoke tests
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet run --project tests/DosDis.ProjectSmoke --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Windows desktop preview
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet publish src/DosDis.Desktop/DosDis.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/windows-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows desktop preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOSDis-Desktop-win-x64-preview
          path: Tools/Disassembler/dist/windows-desktop/
          if-no-files-found: error
          retention-days: 30
      - name: Publish portable self-contained Windows CLI
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet publish src/DosDis.Cli/DosDis.Cli.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output dist/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md,THIRD_PARTY_NOTICES.md -Destination dist/win-x64/
      - name: Upload Windows CLI preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOSDis-CLI-win-x64-preview
          path: Tools/Disassembler/dist/win-x64/
          if-no-files-found: error
          retention-days: 30
