name: Windows DOS disassembler core smoke tests
# Temporary scoped Windows build for user-authorized Part 31 diagnostic test.
on:
  workflow_dispatch:
  push:
    branches: [disassembler-foundation]
    paths:
      - 'Tools/Disassembler/.ci-build-once-part31'
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop, CLI, and regression test projects
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @(
            'src/DosDis.Cli/DosDis.Cli.csproj',
            'src/DosDis.Desktop/DosDis.Desktop.csproj',
            'tests/DosDis.Smoke/DosDis.Smoke.csproj',
            'tests/DosDis.ProjectSmoke/DosDis.ProjectSmoke.csproj'
          )) {
            dotnet build $project --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run synthetic tests (no original game files)
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet run --project tests/DosDis.Smoke --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/DosDis.ProjectSmoke --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable self-contained Windows CLI
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet publish src/DosDis.Cli/DosDis.Cli.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output dist/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md,THIRD_PARTY_NOTICES.md -Destination dist/win-x64/
      - name: Publish portable self-contained Windows desktop
        shell: pwsh
        working-directory: Tools/Disassembler
        run: |
          dotnet publish src/DosDis.Desktop/DosDis.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/windows-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md,THIRD_PARTY_NOTICES.md -Destination dist/windows-desktop/
      - name: Upload Windows desktop preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOSDis-Desktop-win-x64-preview
          path: Tools/Disassembler/dist/windows-desktop/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows CLI preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOSDis-CLI-win-x64-preview
          path: Tools/Disassembler/dist/win-x64/
          if-no-files-found: error
          retention-days: 30
