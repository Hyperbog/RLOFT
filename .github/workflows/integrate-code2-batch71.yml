name: Integrate CODE.2 Batch 71

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch71.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify staged Batch 71
        run: |
          test "$(git hash-object Code2/.batch71.fragment.cpp)" = "1b13aced47183a837abbb969835e53e9558310e9"
          test "$(git hash-object Code2/.batch71_integrate.py)" = "1150bf34d72a54242ffe5f82f2b9f3afb9af42fa"
          python - <<'PY'
          from pathlib import Path
          text=Path('Code2/.batch71.fragment.cpp').read_text()
          assert '// Batch 71: 305A8..30D25' in text
          assert 'kApp71DirectionJumpTable[10]' in text
          assert '==1843u);' in text
          PY

      - name: Integrate Batch 71
        run: python Code2/.batch71_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch71_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Normalize generated markdown EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['Code2/PROGRESS.md','Code2/CODE2_CONTINUITY_ADDENDUM.md']:
              p=Path(name)
              p.write_text(p.read_text().rstrip()+'\n')
          PY

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          anchors=[
              'app71_glyph_signed',
              'app71_glyph_unsigned',
              'static_cast<s32>(scan)>0x80',
              'code==0x19u',
              '0x1457Cu',
              'kApp71DirectionJumpTable[10]',
              'function_30cd4',
              '==1843u);'
          ]
          for a in anchors: assert a in cpp,a
          assert '307C8..307EF | table | 40' in led
          assert '30D26..30D2F | padding | 10' in led
          assert '206,924 / 239,698 = 86.3270% (86.33%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 71
        run: |
          cp Code2/.batch71_integrate.py /tmp/batch71_integrate.py
          rm -f Code2/.batch71.fragment.cpp Code2/.batch71_integrate.py .github/workflows/integrate-code2-batch71.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 71"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch71_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`30D30`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 71"
          git push origin HEAD:code1-decompilation
