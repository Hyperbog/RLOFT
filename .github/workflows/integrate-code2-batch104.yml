name: Integrate CODE.2 Batch 104
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch104.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 104
        run: |
          git merge-base --is-ancestor 444790bfeb67e91eabb189de20bb7b71899d642a HEAD
          test "$(git hash-object Code2/.batch104.fragment.cpp)" = "1db564624ff275fe3b36d20c2625d119fad931a7"
          test "$(git hash-object Code2/.batch104_integrate.py)" = "6d537aaf71e8391b4b890e81eec8ea200deb67b0"
          grep -F 'static_assert(0x34268u-0x34110u==344u);' Code2/.batch104.fragment.cpp
      - name: Integrate Batch 104
        run: python Code2/.batch104_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch104_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_33fb4','function_3402c','function_34110','app104_idiv_shift16','numerator=static_cast<long long>(difference)*65536LL','delta_x<<16','static_cast<u32>(left_clip)-static_cast<u32>(first)','app104_sar16','0x03C4u']:
              assert x in c,x
          for x in ['3410E..3410F | alignment | 2','34268..3426F | padding | 8']:
              assert x in l,x
          assert '220,556 / 239,698 = 92.0141% (92.01%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 104
        run: |
          cp Code2/.batch104_integrate.py /tmp/batch104_integrate.py
          rm -f Code2/.batch104.fragment.cpp Code2/.batch104_integrate.py .github/workflows/integrate-code2-batch104.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 104"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch104_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`34270`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 104"
          git push origin HEAD:code1-decompilation
