name: Original CODE2 camera integration source inspection
on:
  workflow_dispatch:
  push:
    branches: [Recomp]
    paths:
      - '.github/workflows/recomp-movement-source-inspection.yml'
permissions:
  contents: read
jobs:
  inspect-original-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bound original source movement definitions, writes and call graph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path("Code2/Code2.cpp").read_text(encoding="utf-8").splitlines()
          needles=(
              "function_20a24(", "function_2acdc(",
              "function_e0f8(", "function_002a8(",
              "struct Dispatch002A8Boundary",
              "function_1ea04(", "function_1ea78(",
              "function_1f1c8(",
          )
          # Capture every *write* to original camera/heading, each tagged
          # with the nearest reconstructed function for call-graph audit.
          import re
          # Bound scan: source lines are C++ and reconstructed offsets are
          # literal; avoid interpreting declaration formatting as provenance.
          import re
          defs=[]
          for n,line in enumerate(lines):
              if "function_" not in line or "(" not in line:
                  continue
              x=line.split("function_",1)[1].split("(",1)[0].lower()
              if x and all(k in "0123456789abcdef" for k in x) and not line.lstrip().startswith("//") and (
                      line.lstrip().startswith(("void ", "u32 ", "s32 ", "bool ",
                                               "s16 ", "[[noreturn]]"))):
                  defs.append((n,x))
          for i,line in enumerate(lines):
              if "store_le" not in line: continue
              if not any("dg(m,0x"+addr+"u" in line
                         for addr in ("255D0","255D2","255D4","255D6","C658")):
                  continue
              owners=[(n,fn) for n,fn in defs if n<=i]
              print("ORIGINAL_CAMERA_GUEST_STORE",i+1,
                    "function_"+(owners[-1][1] if owners else "UNKNOWN"),
                    line.strip())
          print("ORIGINAL_CAMERA_SOURCE_AUDIT_BEGIN",len(lines))
          for needle in needles:
              matches=[i for i,line in enumerate(lines) if needle.lower() in line.lower()]
              print("ORIGINAL_CAMERA_MATCH",needle,"count",len(matches))
              for i in matches[:1]:
                  before=3 if 'function_' not in needle else 5
                  after=155 if 'struct ' in needle else 145
                  print("ORIGINAL_CAMERA_CONTEXT_BEGIN",needle,"line",i+1)
                  for n in range(max(0,i-before),min(len(lines),i+after)):
                      print(f"{n+1}: {lines[n]}")
                  print("ORIGINAL_CAMERA_CONTEXT_END",needle,"line",i+1)
          print("ORIGINAL_CAMERA_SOURCE_AUDIT_END")
          PY
