name: Original CODE2 camera integration source inspection
on:
  workflow_dispatch:
  push:
    branches: [Recomp]
    paths:
      - '.github/workflows/recomp-movement-source-inspection.yml'
permissions:
  contents: read
jobs:
  inspect-original-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bound original source movement definitions, writes and call graph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path("Code2/Code2.cpp").read_text(encoding="utf-8").splitlines()
          needles=(
              "function_1e4a0(", "function_2e120(",
              "function_2e608(", "function_1ae30(",
              "app45_scale_cwde(", "function_2df2c(",
              "0xC6E8u", "0xC6ECu", "0xC6F0u",
          )
          # Capture every *write* to original camera/heading, each tagged
          # with the nearest reconstructed function for call-graph audit.
          import re
          writer=re.compile(r"(?:store_le(?:16|32)\\(dg\\(m,0x(?:255D0|255D2|255D4|255D6|C658)u\\))",re.I)
          definitions=[(i,re.search(r"function_([0-9a-f]+)\\(",line,re.I).group(1))
                       for i,line in enumerate(lines)
                       if re.search(r"^(?:(?:\\[\\[noreturn\\]\\])\\s*)?(?:void|u32|s32|bool|s16) function_([0-9a-f]+)\\(",line.strip(),re.I)]
          for i,line in enumerate(lines):
              if writer.search(line):
                  owners=[(n,fn) for n,fn in definitions if n<=i]
                  print("ORIGINAL_CAMERA_GUEST_STORE",i+1,
                        "function_"+(owners[-1][1] if owners else "UNKNOWN"),line.strip())
          print("ORIGINAL_CAMERA_SOURCE_AUDIT_BEGIN",len(lines))
          for needle in needles:
              matches=[i for i,line in enumerate(lines) if needle.lower() in line.lower()]
              print("ORIGINAL_CAMERA_MATCH",needle,"count",len(matches))
              for i in matches[:(2 if 'function_' in needle else 4)]:
                  before=3 if 'function_' not in needle else 5
                  after=10 if 'function_' not in needle else 180
                  print("ORIGINAL_CAMERA_CONTEXT_BEGIN",needle,"line",i+1)
                  for n in range(max(0,i-before),min(len(lines),i+after)):
                      print(f"{n+1}: {lines[n]}")
                  print("ORIGINAL_CAMERA_CONTEXT_END",needle,"line",i+1)
          print("ORIGINAL_CAMERA_SOURCE_AUDIT_END")
          PY
