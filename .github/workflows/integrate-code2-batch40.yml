name: Integrate CODE.2 batch 40

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch40.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 40
        run: python Code2/.integrate_batch40.py
      - name: Verify accounting and anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 121232u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2312u;' in code
          assert '**123,544 / 239,698 = 51.5415% (51.54%)**' in progress
          assert 'void function_1c40c(Machine& m,Application40Boundary& b,' in code
          assert 'width=app40_mask_al(width+0x1Fu,0xE0u);' in code
          assert 'height=app40_mask_al(height+0x0Fu,0xF0u);' in code
          assert 'const u32 mid_x=x+app40_half_toward_zero(width-0x40u);' in code
          assert 'app40_draw(b,app40_rand2(b)+0x0Eu,mirror,bottom,graphic29);' in code
          assert 'static_assert(0x1C77Bu-0x1C40Cu==879u);' in code
          assert '1C77B..1C77B | alignment | 1' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2312,total
          assert 121232+2312==123544
          assert 239698-123544==116154
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch40_fragment.cpp Code2/.integrate_batch40.py .github/workflows/integrate-code2-batch40.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 40"
          git push origin HEAD:code1-decompilation
