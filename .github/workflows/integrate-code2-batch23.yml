name: Integrate CODE.2 batch 23
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch23.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 23
        run: python3 Code2/integrate_batch23.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 78245u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1459u;' in cpp
          assert 'static_assert(0x1162Eu-0x11404u==554u);' in cpp
          assert 'static_assert(0x11AD8u-0x117A0u==824u);' in cpp
          assert 'flags|app23_shl8(static_cast<u8>(variant),free_index)' in cpp
          assert 'function_0f238(m,slot,static_cast<u32>(index),selected_variant);' in cpp
          assert 'current==-1?0u:old_variant' in cpp
          assert 'const s32 second=b.call_50dc(1u,slot);' in cpp
          assert 'mode=(mode&0xFFFF0000u)|static_cast<u16>(static_cast<u16>(mode)^1u);' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,z,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); z=int(z,16); n=int(n)
              assert z-a+1==n,(line,z-a+1,n)
              total+=n
          assert total==1459,total
          assert 78245+total==79704
          assert 239698-79704==159994
          assert '**79,704 / 239,698 = 33.2518% (33.25%)**' in prog
          print('CODE.2 batch 23 accounting verified: 78245 + 1459 = 79704')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch23.staging.cpp Code2/integrate_batch23.py .github/workflows/integrate-code2-batch23.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 23'
          git push origin code1-decompilation
