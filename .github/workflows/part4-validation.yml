name: Part 4 validation

on:
  pull_request:
    branches:
      - demo-v1
    paths:
      - "DemoV1/**"
      - ".github/workflows/part4-validation.yml"

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S DemoV1 -B build/demo-v1 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/demo-v1 --config Release
      - name: Test
        run: ctest --test-dir build/demo-v1 -C Release --output-on-failure

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S DemoV1 -B build/demo-v1 -A x64
      - name: Build
        run: cmake --build build/demo-v1 --config Release
      - name: Test
        run: ctest --test-dir build/demo-v1 -C Release --output-on-failure
