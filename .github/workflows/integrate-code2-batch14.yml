name: Integrate CODE.2 batch 14
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch14.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 14
        run: python3 Code2/integrate_batch14.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 46240u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 456u;' in cpp
          assert 'static_assert(0x095BDu-0x094E0u==221u);' in cpp
          assert 'static_assert(0x09B4Au-0x09790u==954u);' in cpp
          assert 'u32 side=app14_toggle_low8(load_le32(dg(m,0xC050u)));' in cpp
          assert 'while(static_cast<s32>(index)<=static_cast<s32>(count))' in cpp
          assert 'b.call_2195c(0x80u,a0,a2' in cpp
          assert 'const u32 derived0=(b.call_f218?b.call_f218(slot,0x0Eu):0u)&0xFFu;' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n); assert b-a+1==n; total+=n
          assert total==456,total
          assert 46240+total==46696
          assert 239698-46696==193002
          assert '**46,696 / 239,698 = 19.4812% (19.48%)**' in prog
          print('CODE.2 batch 14 accounting verified: 46240 + 456 = 46696')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch14.inc Code2/integrate_batch14.py .github/workflows/integrate-code2-batch14.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 14'
          git push origin code1-decompilation
