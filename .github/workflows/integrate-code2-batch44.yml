name: Integrate CODE.2 batch 44
# retrigger after narrowing the Batch-43 signature repair to the latest boundary
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch44.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 44
        run: python Code2/integrate_batch44.py
      - name: Verify accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 133354u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2602u;' in c
          assert 'static_assert(0x1F7B0u-0x1F494u==796u);' in c
          assert 'u32 (*call_2e6f0)(u32)=nullptr;' in c
          assert '1EEFC..1EF7B | table | 128' in l
          assert '**Total proven non-code/data:** **2,602 bytes**.' in l
          assert '**135,956 / 239,698 = 56.7197% (56.72%)**' in p
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2602,total
          print('accounting/anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm -f Code2/batch44.zb64 Code2/integrate_batch44.py .github/workflows/integrate-code2-batch44.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 44'
          git push origin HEAD:code1-decompilation
