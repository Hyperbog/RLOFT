name: CODE.1 semantic audit checkpoint 6
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply semantic audit checkpoint 6
        run: |
          git apply --check Code1/semantic_audit_checkpoint6.patch
          git apply Code1/semantic_audit_checkpoint6.patch
      - name: Verify checkpoint 6 and closed accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text()
          led=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69361u;' in cpp
          assert 'function_7360(Machine&m,MidStreamBoundaries&b,u32 incoming_edx)' in cpp
          assert 'function_74d0(Machine&m,MidStreamBoundaries&b,u32 count,u32 dst)' in cpp
          assert 'return (p&0xffffff00u)|static_cast<u32>(out)' in cpp
          assert 'static_cast<u32>(*dgroup_ptr(m,dgroup(0x89d0u+i)))==value' in cpp
          assert 'void(*call_802c)(u32)=nullptr' in cpp
          assert 'if(static_cast<s32>(scan)>0x80)' in cpp
          assert 'static s32 div8_zero(s32 v)noexcept{return v/8;}' in cpp
          assert '## Semantic audit checkpoint 6' in Path('Code1/FINAL_BINARY_AUDIT.md').read_text()
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n
              total += n
          assert total==1041,total
          assert 69361+total==70402
          print('semantic checkpoint 6 verified: 69361 + 1041 = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Commit semantic corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f Code1/semantic_audit_checkpoint6.patch
          git add -A Code1/Code1.cpp Code1/FINAL_BINARY_AUDIT.md Code1/semantic_audit_checkpoint6.patch
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Checkpoint 6 already applied.'
          else
            git commit -m "Correct CODE.1 semantic audit checkpoint 6"
            git push origin HEAD:code1-decompilation
          fi
