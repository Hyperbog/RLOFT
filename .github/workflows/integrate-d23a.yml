name: CODE.1 semantic audit checkpoint 10g
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply semantic audit checkpoint 10g
        run: python3 Code1/fix_semantic_audit_checkpoint10g.py
      - name: Verify checkpoint 10g and closed accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text();led=Path('Code1/RESIDUAL_LEDGER.md').read_text();audit=Path('Code1/FINAL_BINARY_AUDIT.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69361u;' in cpp
          bf=cpp[cpp.index('void function_bf38'):cpp.index('static_assert(0xBFDFu-0xBF38u==167u);')]
          assert 'u32 last' in bf and 'const u32 count=last-first+1u' in bf
          bfe=cpp[cpp.index('void function_bfe0'):cpp.index('static_assert(0xC079u-0xBFE0u==153u);')]
          assert 'u32 last' in bfe and 'const u32 count=last-first+1u' in bfe
          c0=cpp[cpp.index('void function_c0b8'):cpp.index('static_assert(0xC10Fu-0xC0B8u==87u);')]
          assert 'static_cast<s32>(i)<static_cast<s32>(count)' in c0
          c1=cpp[cpp.index('static void function_c110'):cpp.index('static_assert(0xC17Bu-0xC110u==107u);')]
          assert 'static_cast<s32>(n)<static_cast<s32>(count)' in c1 and '&31u' in c1
          rot=cpp[cpp.index('void function_c1b0'):cpp.index('static_assert(0xC227u-0xC1B0u==119u);')]
          assert 'static_cast<s32>(run)<=1' in rot and 'copy_d9ee(p,p+3u,bytes)' in rot
          c2=cpp[cpp.index('void function_c2d0'):cpp.index('static_assert(0xC49Du-0xC2D0u==461u);')]
          assert 'const u32 alloc_size=' in c2 and 'const u32 read_size=' in c2
          assert c2.count('b.call_627c?b.call_627c(path):0u')==2
          sysfail=c2[c2.index('if(sys==0xffffffffu)'):c2.index('const u32 info=')]
          assert sysfail.index('call_6f74') < sysfail.index('call_e6ea')
          assert 'b.call_eae7(load_le32(dgroup_ptr(m,dgroup(0x2f74u)))' in c2
          c4=cpp[cpp.index('void function_c4e0'):cpp.index('static_assert(0xC57Bu-0xC4E0u==155u);')]
          assert 'const u32 sys=' not in c4 and c4.count('dgroup(0x2f74u)')>=3 and c4.count('dgroup(0x2f68u)')>=3
          c57=cpp[cpp.index('void function_c57c'):cpp.index('static_assert(0xC5B0u-0xC57Cu==52u);')]
          assert c57.count('dgroup(0x2f74u)')>=2
          assert 'Semantic audit checkpoint 10g' in audit and '`BE70..C79E`' in audit
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S);assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups();a=int(a,16);b=int(b,16);n=int(n);assert b-a+1==n;total+=n
          assert total==1041,total;assert 69361+total==70402
          print('semantic checkpoint 10g verified: 69361 + 1041 = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Commit semantic corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Hyperbog@users.noreply.github.com
          rm -f Code1/fix_semantic_audit_checkpoint10g.py
          git add -A Code1/Code1.cpp Code1/FINAL_BINARY_AUDIT.md Code1/fix_semantic_audit_checkpoint10g.py
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Checkpoint 10g already applied.'; else git commit -m "Correct CODE.1 semantic audit checkpoint 10g" && git push origin HEAD:code1-decompilation; fi
