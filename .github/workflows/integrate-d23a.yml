name: CODE.1 semantic audit checkpoint 10m
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply semantic audit checkpoint 10m
        run: python3 Code1/fix_semantic_audit_checkpoint10m.py
      - name: Verify checkpoint 10m and closed accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text();led=Path('Code1/RESIDUAL_LEDGER.md').read_text();audit=Path('Code1/FINAL_BINARY_AUDIT.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69361u;' in cpp
          c103=cpp[cpp.index('[[nodiscard]]u32 function_103c3('):cpp.index('static_assert(0x10415u-0x103C3u==82u);')]
          assert 'const bool signed_le_five=(h&0x80000000u)!=0u||h<=5u;' in c103
          c104=cpp[cpp.index('void function_10452('):cpp.index('void function_1044f()')]
          assert 'bool check_fatal=probe>=m.cpu.esp' in c104
          assert 'distance<=load_le32(dgroup_ptr(m,dgroup(0x5300u)))' in c104
          assert 'function_10452(m,b,argument);' in c104
          h=cpp[cpp.index('[[nodiscard]]u32 function_104e0('):cpp.index('static_assert(0x1058Bu-0x104E0u==171u);')]
          assert 'if(size>largest)largest=size;' in h
          assert 'hwrite(b,arena+0x10u,largest)' in h
          assert 'scan=scan-size' not in h
          assert 'Semantic audit checkpoint 10m' in audit and '`FC98..1083E`' in audit
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S);assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups();a=int(a,16);b=int(b,16);n=int(n);assert b-a+1==n;total+=n
          assert total==1041,total;assert 69361+total==70402
          print('semantic checkpoint 10m verified: 69361 + 1041 = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Commit semantic corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Hyperbog@users.noreply.github.com
          rm -f Code1/fix_semantic_audit_checkpoint10m.py
          git add -A Code1/Code1.cpp Code1/FINAL_BINARY_AUDIT.md Code1/fix_semantic_audit_checkpoint10m.py
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Checkpoint 10m already applied.'; else git commit -m "Correct CODE.1 semantic audit checkpoint 10m" && git push origin HEAD:code1-decompilation; fi
