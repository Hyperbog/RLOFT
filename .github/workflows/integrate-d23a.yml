name: CODE.1 semantic audit checkpoint 8c
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply semantic audit checkpoint 8c
        run: python3 Code1/fix_semantic_audit_checkpoint8c.py
      - name: Verify checkpoint 8c and closed accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text()
          led=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69361u;' in cpp
          assert 'void(*call_8e3c)(s32,u32)=nullptr' in cpp
          f=cpp[cpp.index('void function_8e3c'):cpp.index('static_assert(0x91BCu-0x8E3Cu==896u);')]
          assert 'index>=static_cast<s32>(b12r32(b,gr+8u))' in f
          assert 'b12w16(b,ent,typed)' in f
          assert 'for(s32 g=0;g<static_cast<s32>' in cpp[cpp.index('function_9378'):cpp.index('static_assert(0x943Eu-0x9378u==198u);')]
          assert 'if(b.call_8e3c)b.call_8e3c(static_cast<s32>(i),0u);function_9440' in cpp
          assert 'if(b.call_8e3c)b.call_8e3c(static_cast<s32>(index),group)' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n
              total+=n
          assert total==1041,total
          assert 69361+total==70402
          print('semantic checkpoint 8c verified: 69361 + 1041 = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Commit semantic corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f Code1/fix_semantic_audit_checkpoint8c.py
          git add -A Code1/Code1.cpp Code1/FINAL_BINARY_AUDIT.md Code1/fix_semantic_audit_checkpoint8c.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Checkpoint 8c already applied.'
          else
            git commit -m "Correct CODE.1 semantic audit checkpoint 8c"
            git push origin HEAD:code1-decompilation
          fi
