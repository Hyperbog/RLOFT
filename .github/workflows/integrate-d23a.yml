name: CODE.1 semantic audit checkpoint 5b
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply semantic audit checkpoint 5b
        run: python3 Code1/fix_semantic_audit_checkpoint5b.py
      - name: Verify checkpoint 5b and closed accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text()
          led=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69361u;' in cpp
          assert 'if(arg==0u)arg=' in cpp
          assert 'mgw32(b,clip,0u)' in cpp
          assert 'const s32 q=bottom/4' in cpp
          assert 'write16_guest' in cpp
          assert 'b.write16_guest(p,sel)' in cpp
          assert 'b.write32_guest(p+2u,0u)' in cpp
          assert 'b.write16_guest(p,0u)' in cpp
          assert 'b.write32_guest(p+2u,h)' in cpp
          assert 'query_largest_dos_bytes' in cpp
          assert 'alloc_selector' not in cpp[cpp.index('struct MidDpmiBoundaries{'):cpp.index('// 72A0..7669:')]
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n
              total += n
          assert total==1041,total
          assert 69361+total==70402
          print('semantic checkpoint 5b verified: 69361 + 1041 = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Commit semantic corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f Code1/fix_semantic_audit_checkpoint5b.py
          git add -A Code1/Code1.cpp Code1/FINAL_BINARY_AUDIT.md Code1/fix_semantic_audit_checkpoint5b.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Checkpoint 5b already applied.'
          else
            git commit -m "Correct CODE.1 semantic audit checkpoint 5b"
            git push origin HEAD:code1-decompilation
          fi
