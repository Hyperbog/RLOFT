name: Integrate CODE.1 actor generation batch 05
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - run: python3 Code1/integrate_actor_generation_batch_05.py
      - name: Preserve 0010 boundary dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Code1/Code1.cpp');s=p.read_text()
          mark='// 2A64..3883: actor-generation/editor logic.'
          s=s.replace(mark,'struct EarlyGameBoundaries; [[nodiscard]]s32 function_0010(EarlyGameBoundaries&,s32,s32,s32,s32)noexcept;\n'+mark)
          s=s.replace('void function_32f4(Machine&m)noexcept','void function_32f4(Machine&m,EarlyGameBoundaries&rng)noexcept')
          s=s.replace('void function_334c(Machine&m)noexcept','void function_334c(Machine&m,EarlyGameBoundaries&rng)noexcept')
          s=s.replace('void function_37c0(Machine&m)noexcept','void function_37c0(Machine&m,EarlyGameBoundaries&rng)noexcept')
          s=s.replace('void function_3884(Machine&m)noexcept{function_3208(m);function_32f4(m);function_334c(m);function_37c0(m);function_3404(m);}', 'void function_3884(Machine&m,EarlyGameBoundaries&rng)noexcept{function_3208(m);function_32f4(m,rng);function_334c(m,rng);function_37c0(m,rng);function_3404(m);}')
          start=s.index('// 32F4..3349:');end=s.index('// CC1C..CD96:');s=s[:start]+s[start:end].replace('function_0010(m,','function_0010(rng,')+s[end:]
          p.write_text(s)
          PY
      - run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Code1/Code1.cpp Code1/PROGRESS.md Code1/STAGING_LEDGER.md Code1/DECOMPILATION_CONTINUITY.md Code1/integrate_actor_generation_batch_05.py
          git commit -m "Integrate CODE.1 actor generation batch 05"
          git push origin code1-decompilation
