name: CODE.1 semantic audit checkpoint 10l
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply semantic audit checkpoint 10l
        run: python3 Code1/fix_semantic_audit_checkpoint10l.py
      - name: Verify checkpoint 10l and closed accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text();led=Path('Code1/RESIDUAL_LEDGER.md').read_text();audit=Path('Code1/FINAL_BINARY_AUDIT.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69361u;' in cpp
          f163=cpp[cpp.index('[[nodiscard]]u32 function_f163('):cpp.index('struct StringBoundary')]
          assert 'while(n!=limit)' not in f163
          assert 'if(v==0u||n==limit)return n;' in f163
          f206=cpp[cpp.index('void function_f206('):cpp.index('// F2D2..F2E8:')]
          assert 'static_cast<s32>(i)<static_cast<s32>(s.precision)' in f206
          f8=cpp[cpp.index('[[nodiscard]]u32 function_f8c4('):cpp.index('static_assert(0xFC97u-0xF8C4u==979u);')]
          assert '<<(page_shift&31u)' in f8
          assert 'Semantic audit checkpoint 10l' in audit and '`EDE7..FC97`' in audit
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S);assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups();a=int(a,16);b=int(b,16);n=int(n);assert b-a+1==n;total+=n
          assert total==1041,total;assert 69361+total==70402
          print('semantic checkpoint 10l verified: 69361 + 1041 = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Commit semantic corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Hyperbog@users.noreply.github.com
          rm -f Code1/fix_semantic_audit_checkpoint10l.py
          git add -A Code1/Code1.cpp Code1/FINAL_BINARY_AUDIT.md Code1/fix_semantic_audit_checkpoint10l.py
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Checkpoint 10l already applied.'; else git commit -m "Correct CODE.1 semantic audit checkpoint 10l" && git push origin HEAD:code1-decompilation; fi
