name: CODE.1 residual pass 24
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - run: python3 Code1/fix_residual_pass24.py
      - run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Hyperbog@users.noreply.github.com
          git add Code1/PROGRESS.md Code1/STAGING_LEDGER.md Code1/DECOMPILATION_CONTINUITY.md Code1/RESIDUAL_LEDGER.md Code1/fix_residual_pass24.py
          git commit -m "Record CODE.1 residual pass 24"
          git push origin code1-decompilation
