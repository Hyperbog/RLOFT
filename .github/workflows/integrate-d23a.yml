name: CODE.1 semantic audit checkpoint 10h
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply semantic audit checkpoint 10h
        run: python3 Code1/fix_semantic_audit_checkpoint10h.py
      - name: Verify checkpoint 10h and closed accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text();led=Path('Code1/RESIDUAL_LEDGER.md').read_text();audit=Path('Code1/FINAL_BINARY_AUDIT.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69361u;' in cpp
          s5=cpp[cpp.index('static void b18_scaled5'):cpp.index('void function_c7a0')]
          assert 'outer_count=outer_total' in s5 and 'inner_count=inner_total' in s5
          assert 'while(--inner_count!=0u)' in s5 and 'while(--outer_count!=0u)' in s5
          s7=cpp[cpp.index('static void b18_scaled7'):cpp.index('void function_c9d4')]
          assert 'outer_count=outer_total' in s7 and 'inner_count=inner_total' in s7
          assert 'while(--inner_count!=0u)' in s7 and 'while(--outer_count!=0u)' in s7
          cd=cpp[cpp.index('void function_cd97'):cpp.index('static_assert(0xCE8Bu-0xCD97u==244u);')]
          assert 'r.esi+=3u;while(b.read8)' in cd
          assert 'C7A0..CBD0 is the counted self-modifying scaled-VGA blitter family' in cpp
          assert 'Semantic audit checkpoint 10h' in audit and '`C7A0..CEBF`' in audit
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S);assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups();a=int(a,16);b=int(b,16);n=int(n);assert b-a+1==n;total+=n
          assert total==1041,total;assert 69361+total==70402
          print('semantic checkpoint 10h verified: 69361 + 1041 = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Commit semantic corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Hyperbog@users.noreply.github.com
          rm -f Code1/fix_semantic_audit_checkpoint10h.py
          git add -A Code1/Code1.cpp Code1/FINAL_BINARY_AUDIT.md Code1/fix_semantic_audit_checkpoint10h.py
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Checkpoint 10h already applied.'; else git commit -m "Correct CODE.1 semantic audit checkpoint 10h" && git push origin HEAD:code1-decompilation; fi
