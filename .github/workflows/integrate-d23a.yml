name: CODE.1 direct-binary residual closure pass 44
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply direct-binary residual closure
        run: python3 Code1/finalize_code1_pass44.py
      - name: Verify final accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text()
          led=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69361u;' in cpp
          assert 'function_fc97' in cpp
          assert '- residual still requiring classification: **0 bytes**' in led
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16);b=int(b,16);n=int(n)
              assert b-a+1==n
              total+=n
          assert total==1041,total
          assert 69361+total==70402
          print('final object accounting verified: 69361 + 1041 = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Commit residual closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Code1/Code1.cpp Code1/PROGRESS.md Code1/STAGING_LEDGER.md Code1/DECOMPILATION_CONTINUITY.md Code1/RESIDUAL_LEDGER.md Code1/FINAL_BINARY_AUDIT.md Code1/finalize_code1_pass44.py
          if git diff --cached --quiet; then
            echo 'Pass 44 already applied.'
          else
            git commit -m "Close CODE.1 residual object accounting"
            git push origin HEAD:code1-decompilation
          fi
