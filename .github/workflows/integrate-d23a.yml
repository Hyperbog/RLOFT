name: CODE.1 semantic audit checkpoint 4
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-d23a.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply semantic audit checkpoint 4
        run: python3 Code1/fix_semantic_audit_checkpoint4.py
      - name: Verify checkpoint 4 and closed accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code1/Code1.cpp').read_text()
          led=Path('Code1/RESIDUAL_LEDGER.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes=69361u;' in cpp
          assert 'family0=function_5d90(m,0,2u)' in cpp
          assert 'family1=function_5d90(m,1,family0)' in cpp
          assert 'if(v<0)continue' not in cpp[cpp.index('void function_5f4c'):cpp.index('static_assert(0x6054u-0x5F4Cu')]
          assert 'set_low16(result,load_le16' in cpp[cpp.index('function_5b64'):cpp.index('static_assert(0x5D8Fu-0x5B64u')]
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n
              total += n
          assert total==1041,total
          assert 69361+total==70402
          print('semantic checkpoint 4 verified: 69361 + 1041 = 70402')
          PY
      - name: Syntax check CODE.1 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Commit semantic corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f Code1/fix_semantic_audit_checkpoint4.py
          git add -A Code1/Code1.cpp Code1/FINAL_BINARY_AUDIT.md Code1/fix_semantic_audit_checkpoint4.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Checkpoint 4 already applied.'
          else
            git commit -m "Correct CODE.1 semantic audit checkpoint 4"
            git push origin HEAD:code1-decompilation
          fi
