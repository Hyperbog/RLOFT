name: Integrate CODE.2 Batch 106
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch106.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 106
        run: |
          git merge-base --is-ancestor 3be703fccc530317b64766100ece8cc2846a0c9a HEAD
          test "$(git hash-object Code2/.batch106.fragment.cpp)" = "937ff9eeb6893ea54e22b4d50bfb6b6a3e24068a"
          test "$(git hash-object Code2/.batch106_integrate.py)" = "d47607e94e3595c07580a5e5cc7a0b3576f8b350"
          grep -F 'static_assert(0x34951u-0x342E4u==1645u);' Code2/.batch106.fragment.cpp
          grep -F 'static_assert(0x34995u-0x34954u==65u);' Code2/.batch106.fragment.cpp
      - name: Integrate Batch 106
        run: python Code2/.batch106_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch106_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime106Boundary','Raster106Pair','app106_sample64','function_342e4','function_34954','for(u32 i=0;i<64u;++i)','((edx>>26)<<6)|(eax>>26)','eax=(eax&0xFFFFFF00u)','0x0802u,0x0402u,0x0202u,0x0102u','0x0C02u,0x0302u']:
              assert x in c,x
          for x in ['34951..34953 | alignment | 3','34995..34997 | alignment | 3']:
              assert x in l,x
          assert '222,388 / 239,698 = 92.7784% (92.78%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 106
        run: |
          cp Code2/.batch106_integrate.py /tmp/batch106_integrate.py
          rm -f Code2/.batch106.fragment.cpp Code2/.batch106_integrate.py .github/workflows/integrate-code2-batch106.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 106"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch106_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`34998`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 106"
          git push origin HEAD:code1-decompilation
