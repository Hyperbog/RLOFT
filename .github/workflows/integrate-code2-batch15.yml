name: Integrate CODE.2 batch 15
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch15.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 15
        run: python3 Code2/integrate_batch15.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 49376u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 464u;' in cpp
          assert 'static_assert(0x09D8Fu-0x09B4Cu==579u);' in cpp
          assert 'static_assert(0x0A254u-0x09D90u==1220u);' in cpp
          assert 'static_assert(0x0A5BCu-0x0A254u==872u);' in cpp
          assert 'static_assert(0x0A791u-0x0A668u==297u);' in cpp
          assert 'if(static_cast<s16>(sum)>static_cast<s16>(maximum))' in cpp
          assert 'if(a2>=0 && a6==0u)' in cpp
          assert 'case 0x7B:' in cpp and '0x21917u+base' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n,(line,b-a+1,n)
              total+=n
          assert total==464,total
          assert 49376+total==49840
          assert 239698-49840==189858
          assert '**49,840 / 239,698 = 20.7928% (20.79%)**' in prog
          print('CODE.2 batch 15 accounting verified: 49376 + 464 = 49840')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch15.inc Code2/integrate_batch15.py .github/workflows/integrate-code2-batch15.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 15'
          git push origin code1-decompilation
