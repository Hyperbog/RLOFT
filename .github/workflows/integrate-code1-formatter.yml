name: Integrate CODE.1 formatter
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - run: python3 Code1/integrate_formatter.py
      - run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Integrate verified CODE.1 formatter materializer
          branch: code1-decompilation
