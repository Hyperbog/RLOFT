name: Integrate CODE.2 Batch 130
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch130.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - run: python Code2/.batch130_integrate.py integrate
      - run: python Code2/.batch130_integrate.py verify
      - run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
          git diff --check
      - run: |
          rm Code2/.batch130.fragment.cpp Code2/.batch130_integrate.py .github/workflows/integrate-code2-batch130.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 130"
          git push origin HEAD:code1-decompilation
