name: Integrate CODE.2 batch 10
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch10.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 10
        run: python3 .github/code2_batch10.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 36959u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 305u;' in cpp
          for n in ['app10_load_tail_06cad','function_07070','function_0719c','function_071b8','function_07378','function_073a0','function_07938']:
              assert n in cpp,n
          assert 'store_le32(dg(m,0xC6C8u),0xFFFFFFFFu);' in cpp
          assert 'for(u32 i=0u;i<0x3Eu;++i)' in cpp
          assert 'for(u32 i=0u;i<10u;++i)' in cpp
          assert 'record_count*0x16u' in cpp
          assert '0x21A11u+off' in cpp
          assert 'if(wrote!=size)' in cpp
          assert 'return app10_load_tail_06cad(m,b,a9,h);' in cpp
          delta=(0x706e-0x6cad)+(0x719c-0x7070)+(0x71b8-0x719c)+(0x7376-0x71b8)+(0x739d-0x7378)+(0x75c9-0x73a0)+(0x79e0-0x7938)
          assert delta==2493,delta
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S);assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16);b=int(b,16);n=int(n);assert b-a+1==n;total+=n
          assert total==305,total
          assert 36959+305+202434==239698
          print('CODE.2 batch 10 accounting verified: 36959 + 305 + 202434 = 239698')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Commit integrated batch
        run: |
          rm -f .github/code2_batch10.py Code2/batch10.inc .github/workflows/integrate-code2-batch10.yml
          git config user.name "Hyperbog"
          git config user.email "47282882+Hyperbog@users.noreply.github.com"
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 10"
          git push origin HEAD:code1-decompilation
