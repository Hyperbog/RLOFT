name: Integrate CODE.2 Batch 82
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch82.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 82
        run: |
          test "$(git hash-object Code2/.batch82.fragment.cpp)" = "1147b22da5f46fb8cb0e6d2b90c7251bd49d5c6b"
          test "$(git hash-object Code2/.batch82_integrate.py)" = "9fdf34a2593a8315ddebc6afce8ccd30e24eea1c"
          grep -F 'static_assert(0x3263Bu-0x32620u==27u);' Code2/.batch82.fragment.cpp
      - name: Integrate Batch 82
        run: python Code2/.batch82_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch82_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_32620','invoke_register_callback','load_le32(dg(m,0x255E4u))']: assert x in c,x
          assert '3263B..3263B | alignment | 1' in l
          assert '213,336 / 239,698 = 89.0020% (89.00%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 82
        run: |
          cp Code2/.batch82_integrate.py /tmp/batch82_integrate.py
          rm -f Code2/.batch82.fragment.cpp Code2/.batch82_integrate.py .github/workflows/integrate-code2-batch82.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 82"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch82_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`3263C`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 82"
          git push origin HEAD:code1-decompilation
