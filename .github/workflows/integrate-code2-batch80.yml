name: Integrate CODE.2 Batch 80
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch80.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 80
        run: |
          test "$(git hash-object Code2/.batch80.fragment.cpp)" = "d3af972374b3eebe88fbec86573a3909b7331dc4"
          test "$(git hash-object Code2/.batch80_patch.py)" = "afd2adcbf6077e0a14d0ba6f96a60f4d73baa5f2"
          test "$(git hash-object Code2/.batch80_integrate.py)" = "b797e8e6fce25b663979ad7a0472824ac7ce98ff"
          grep -F 'static_assert(0x324CBu-0x32468u==99u);' Code2/.batch80.fragment.cpp
      - name: Apply wrap correction
        run: python Code2/.batch80_patch.py
      - name: Integrate Batch 80
        run: python Code2/.batch80_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch80_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for a in ['function_32220','function_322ec','function_323bc','function_32404','function_32468','app80_sar','factor=7;factor>=0','factor=1;factor<=8']: assert a in c,a
          assert '323B9..323BB | alignment | 3' in l and '324CB..324CB | alignment | 1' in l
          assert '212,968 / 239,698 = 88.8485% (88.85%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 80
        run: |
          cp Code2/.batch80_integrate.py /tmp/batch80_integrate.py
          rm -f Code2/.batch80.fragment.cpp Code2/.batch80_patch.py Code2/.batch80_integrate.py .github/workflows/integrate-code2-batch80.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 80"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch80_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`324CC`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 80"
          git push origin HEAD:code1-decompilation
