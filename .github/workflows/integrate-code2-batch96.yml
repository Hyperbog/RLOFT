name: Integrate CODE.2 Batch 96
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch96.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 96
        run: |
          git merge-base --is-ancestor 109773f038ff7784d187698ff2a537a9b9ee8c8c HEAD
          test "$(git hash-object Code2/.batch96.fragment.cpp)" = "0ac7616b543b6f348b71d694ad8e2ded13f91916"
          test "$(git hash-object Code2/.batch96_integrate.py)" = "bb505bb87d0cab344236c2264dc17d88021092fc"
          grep -F 'static_assert(0x33A38u-0x339A2u==150u);' Code2/.batch96.fragment.cpp
      - name: Integrate Batch 96
        run: python Code2/.batch96_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch96_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime96Boundary','function_339a2','function_339cf','function_339f2','function_33a15','record_dos_error','rep_movsb','0x12662u','0x2Bu']:
              assert x in c,x
          assert '218,452 / 239,698 = 91.1363% (91.14%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 96
        run: |
          cp Code2/.batch96_integrate.py /tmp/batch96_integrate.py
          rm -f Code2/.batch96.fragment.cpp Code2/.batch96_integrate.py .github/workflows/integrate-code2-batch96.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 96"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch96_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`33A38`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 96"
          git push origin HEAD:code1-decompilation
