name: Integrate CODE.2 batch 22
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch22.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 22
        run: python3 Code2/integrate_batch22.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 75071u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1417u;' in cpp
          assert 'static_assert(0x10A6Du-0x10158u==2325u);' in cpp
          assert 'static_assert(0x10FA9u-0x10BBCu==1005u);' in cpp
          assert 'const u32 base=panel*0x50u;' in cpp
          assert 'function_0f168(static_cast<u32>(item3e))' in cpp
          assert 'dst+0x4Fu-width' in cpp
          assert 'if(hpmax==0) { if(b.divide_error)b.divide_error(); return; }' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,z,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); z=int(z,16); n=int(n)
              assert z-a+1==n,(line,z-a+1,n)
              total+=n
          assert total==1417,total
          assert 75071+total==76488
          assert 239698-76488==163210
          assert '**76,488 / 239,698 = 31.9102% (31.91%)**' in prog
          print('CODE.2 batch 22 accounting verified: 75071 + 1417 = 76488')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch22.zb64 Code2/integrate_batch22.py .github/workflows/integrate-code2-batch22.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 22'
          git push origin code1-decompilation
# retry after exact staging payload repair
