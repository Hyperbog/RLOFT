name: Integrate CODE.2 Batch 62

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch62.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          p=Path('Code2/.batch62.fragment.b64').read_text().strip()
          raw=base64.b64decode(p)
          assert hashlib.sha256(raw).hexdigest() == 'ff996f165ebeb0838d44aa1543d7bba66f65b61ad55cf3e99850725b79f9fb14'
          text=raw.decode()
          assert '// Batch 62: 2AC80..2B085' in text
          assert '==1022u);' in text
          PY

      - name: Integrate Batch 62
        run: python Code2/.batch62_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch62_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'function_2ac80' in cpp and 'function_2ad18' in cpp and 'function_2ae30' in cpp
          assert 'const u32 count_page=load_le32(dg(m,0xC050u))^1u;' in cpp
          assert 'const u16 hit_state=load_le16(dg(m,rec+8u));' in cpp
          assert '2B086..2B087 | alignment | 2' in led
          assert '183,204 / 239,698 = 76.4312% (76.43%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 62
        run: |
          cp Code2/.batch62_integrate.py /tmp/batch62_integrate.py
          rm -f Code2/.batch62.fragment.b64 Code2/.batch62_integrate.py .github/workflows/integrate-code2-batch62.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 62"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch62_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`2B088`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 62"
          git push origin HEAD:code1-decompilation
