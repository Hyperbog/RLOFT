name: Integrate CODE.2 batch 04
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch04.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 04
        run: python3 Code2/integrate_batch04.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 15532u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 94u;' in cpp
          for needle in ['function_011a8','function_01558','function_01834','function_01ce4','function_0207c']:
              assert needle in cpp,needle
          assert 'bool mutated=false;' in cpp
          assert 'load_le32(dg(m,0x258DCu))+0x3Eu' in cpp
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n
              total+=n
          assert total==94,total
          assert 15532+94+224072==239698
          print('CODE.2 batch 04 accounting verified: 15532 + 94 + 224072 = 239698')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Commit integrated batch
        run: |
          rm -f Code2/batch04_append.inc Code2/integrate_batch04.py .github/workflows/integrate-code2-batch04.yml
          git config user.name "Hyperbog"
          git config user.email "47282882+Hyperbog@users.noreply.github.com"
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 04"
          git push origin HEAD:code1-decompilation
