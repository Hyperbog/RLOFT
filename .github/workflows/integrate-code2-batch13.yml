name: Integrate CODE.2 batch 13
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch13.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 13
        run: python3 Code2/integrate_batch13.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 44604u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 448u;' in cpp
          assert 'static_assert(0x0906Du-0x08CF4u==889u);' in cpp
          assert 'static_assert(0x0934Au-0x09070u==730u);' in cpp
          assert 'static_assert(0x09418u-0x09368u==176u);' in cpp
          assert 'static_assert(0x094DDu-0x09418u==197u);' in cpp
          assert 'if(mode==0u&&(moving_type==0x59u||moving_type==0x57u))' in cpp
          assert 'if(my<cy-radius||cy+radius<my||mx<cx-radius||cx+radius<mx)continue;' in cpp
          assert 'case 0u:return (f&0x21u)!=0u;' in cpp
          assert 'case 1u:return (f&0x03u)!=0u;' in cpp
          assert 'case 2u:return (f&0x09u)!=0u;' in cpp
          assert 'case 6u:sound=0x39;break;' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n,(line,b-a+1,n)
              total+=n
          assert total==448,total
          assert 44604+total==45052
          assert 239698-45052==194646
          assert '**45,052 / 239,698 = 18.7953% (18.80%)**' in prog
          print('CODE.2 batch 13 accounting verified: 44604 + 448 = 45052')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch13.inc Code2/integrate_batch13.py .github/workflows/integrate-code2-batch13.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 13'
          git push origin code1-decompilation
