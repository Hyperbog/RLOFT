name: Integrate CODE.2 batch 38

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch38.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 38
        run: python Code2/.integrate_batch38.py
      - name: Verify accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 119524u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2296u;' in code
          assert '**121,820 / 239,698 = 50.8223% (50.82%)**' in progress
          assert 'static constexpr u32 kFunction1bdacDispatch[4]' in code
          assert '0x1BE70u,0x1BE19u,0x1BE4Au,0x1BE6Cu' in code
          assert 'const u32 state=(static_cast<u32>(load_le16(dg(m,rec+0x14u)))>>1u)&3u;' in code
          assert 'function_1bbd8(m,*a,rec,desc,static_cast<u32>(index));' in code
          assert 'function_1b4f8(m,*a,rec,desc,static_cast<u32>(index));' in code
          assert '--index; // encoded DEC ESI before the common increment/retest.' in code
          assert 'The binary contains CMP EDI,EDI here; it is always equal.' in code
          assert 'static_assert(0x1C0B9u-0x1BDACu==781u);' in code
          assert '1BD9C..1BDAB | table | 16' in ledger
          assert '1C0B9..1C0BF | padding | 7' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2296,total
          assert 119524+2296==121820
          assert 239698-121820==117878
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch38_fragment.cpp Code2/.integrate_batch38.py .github/workflows/integrate-code2-batch38.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 38"
          git push origin HEAD:code1-decompilation
