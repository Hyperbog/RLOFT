name: Repair CODE.2 Batch 109
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch109.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 109 repair
        run: |
          git merge-base --is-ancestor 2f0b1abbc1d0d8bb63e3a5f4cab11fe1d6c9e851 HEAD
          test "$(git hash-object Code2/.batch109.fragment.cpp)" = "76a9a9dbcee04d3ea2ed7b43b1055d81a2af1a39"
          test "$(git hash-object Code2/.batch109_integrate.py)" = "5939ccfd7a6d03bbda46ab6dfe2b03b47627746c"
          grep -F 'load_le32(dg(m,0x258F8u))+static_cast<u32>(resource_index)' Code2/.batch109.fragment.cpp
      - name: Apply Batch 109 fidelity repair
        run: python Code2/.batch109_integrate.py integrate
      - name: Verify accounting and repair
        run: python Code2/.batch109_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text();a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'const u32 resource_id=load_le32(dg(m,0x258F8u))+static_cast<u32>(resource_index);' in c
          assert c.count('b.call_2f29c?b.call_2f29c(resource_id,4u):0u') == 2
          assert '0x258F8u+resource_index' not in c
          assert '`[258F8h] + record[9]`' in p and '`[258F8h] + record[9]`' in a
          assert '223,492 / 239,698 = 93.2390% (93.24%)' in p
          PY
          git diff --check
      - name: Commit Batch 109 correction
        run: |
          cp Code2/.batch109_integrate.py /tmp/batch109_integrate.py
          rm -f Code2/.batch109.fragment.cpp Code2/.batch109_integrate.py .github/workflows/integrate-code2-batch109.yml
          git add -A && git diff --cached --check
          git commit -m "Correct CODE.2 batch 109 resource-base load"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch109_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`34DE8`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 109 correction"
          git push origin HEAD:code1-decompilation
