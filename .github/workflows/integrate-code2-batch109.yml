name: Integrate CODE.2 Batch 109
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch109.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 109
        run: |
          git merge-base --is-ancestor 9f513fbbed8e86671754f6c1647311c69202e5c8 HEAD
          test "$(git hash-object Code2/.batch109.fragment.cpp)" = "60006f6015767b0ebcde8e7952767897776dd71e"
          test "$(git hash-object Code2/.batch109_integrate.py)" = "1834cfd2564d1ee13cf8d574730e073a47d9a20a"
          grep -F 'static_assert(0x34DE7u-0x34BB0u==567u);' Code2/.batch109.fragment.cpp
      - name: Integrate Batch 109
        run: python Code2/.batch109_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch109_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime109Boundary','call_2f29c','call_33e6c_local_quad','function_34bb0','app109_sar3','app109_div8_trunc','app109_div2_trunc','(i&1u)?(i^2u):i','0x258F8u+resource_index']:
              assert x in c,x
          assert '34DE7..34DE7 | alignment | 1' in l
          assert '223,492 / 239,698 = 93.2390% (93.24%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 109
        run: |
          cp Code2/.batch109_integrate.py /tmp/batch109_integrate.py
          rm -f Code2/.batch109.fragment.cpp Code2/.batch109_integrate.py .github/workflows/integrate-code2-batch109.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 109"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch109_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`34DE8`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 109"
          git push origin HEAD:code1-decompilation
