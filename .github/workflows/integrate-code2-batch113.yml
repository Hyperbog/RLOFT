name: Integrate CODE.2 Batch 113
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch113.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 113
        run: |
          git merge-base --is-ancestor 790b25ce534306be474ae07b3f7032ea3512662e HEAD
          test "$(git hash-object Code2/.batch113.fragment.cpp)" = "0988a1d02d1e90ebf491226062b27874a51c0a8c"
          test "$(git hash-object Code2/.batch113_integrate.py)" = "e14b36f1f16edef268f98388a350762d1b8ad561"
          grep -F 'static_assert(0x35675u-0x3562Fu==70u);' Code2/.batch113.fragment.cpp
          grep -F 'static_assert(0x35680u-0x35675u==11u);' Code2/.batch113.fragment.cpp
          grep -F 'CS-qualified saved word at `35675`' Code2/.batch113.fragment.cpp
      - name: Integrate Batch 113
        run: python Code2/.batch113_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch113_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          for x in ['Runtime113Boundary','function_3562f','function_35632','function_3566c','app113_terminate']:
              assert x in c,x
          assert 'm.cpu.edx=0x00035414u;' in c
          assert 'app113_set_lo16(m.cpu.eax,0x3D01u);' in c
          assert 'app113_set_hi8(m.cpu.eax,0x40u);' in c
          assert 'app113_set_hi8(m.cpu.eax,0x4Cu);' in c
          assert 'b.read_segment16(m.cpu.cs,0x00035675u)' in c
          assert 'constexpr u32 kVerifiedTranslatedBytes = 221243u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 4449u;' in c
          assert '225,692 / 239,698 = 94.1568% (94.16%)' in p
          assert '35675..35676 | runtime-data | 2' in l
          assert '35677..3567F | alignment | 9' in l
          PY
          git diff --check
      - name: Commit substantive Batch 113
        run: |
          cp Code2/.batch113_integrate.py /tmp/batch113_integrate.py
          rm -f Code2/.batch113.fragment.cpp Code2/.batch113_integrate.py .github/workflows/integrate-code2-batch113.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 113"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch113_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`35680`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 113"
          git push origin HEAD:code1-decompilation
