name: Integrate CODE.2 Batch 74

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch74.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify staged Batch 74
        run: |
          test "$(git hash-object Code2/.batch74.fragment.cpp)" = "9a283cce29b169a8cfffbc7a2760c7e3fbc74501"
          test "$(git hash-object Code2/.batch74_patch.py)" = "cc1bceb7877e4b1cee7ec5bd30d825e264e2ea48"
          test "$(git hash-object Code2/.batch74_integrate.py)" = "46e90a0cd41f7cb39b4e63480b287c75f9a83731"
          grep -F '// Batch 74: 318B4..31C56' Code2/.batch74.fragment.cpp

      - name: Apply reconciled staging correction
        run: |
          python Code2/.batch74_patch.py
          grep -F 'static s32 app74_sar1(s32 v) noexcept{const u32 u=static_cast<u32>(v);return static_cast<s32>((u>>1)|(u&0x80000000u));}' Code2/.batch74.fragment.cpp

      - name: Integrate Batch 74
        run: python Code2/.batch74_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch74_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          anchors=[
              'function_318b4',
              'function_31a14',
              'app74_sar1',
              'app74_pack',
              '0xFE4Eu+static_cast<u32>(i)',
              '0xFE14u+static_cast<u32>(0xB1-i)',
              'static_assert(0x31A12u-0x318B4u==350u);',
              'static_assert(0x31C57u-0x31A14u==579u);'
          ]
          for a in anchors: assert a in cpp,a
          assert '31A12..31A13 | alignment | 2' in led
          assert '31C57..31C57 | alignment | 1' in led
          assert '210,804 / 239,698 = 87.9457% (87.95%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 74
        run: |
          cp Code2/.batch74_integrate.py /tmp/batch74_integrate.py
          rm -f Code2/.batch74.fragment.cpp Code2/.batch74_patch.py Code2/.batch74_integrate.py .github/workflows/integrate-code2-batch74.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 74"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch74_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`31C58`**.' Code2/RESUME_CHECKPOINT.md
          grep -F 'd7beccad5fc4d39703a3ee9f346390e098c4186b1e6563c1e7920e67324e785b' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 74"
          git push origin HEAD:code1-decompilation
