name: Integrate CODE.2 Batch 107
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch107.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 107
        run: |
          git merge-base --is-ancestor 64d1c29d1cf1a3ad34c3d9c5d9d189f3f15384f1 HEAD
          test "$(git hash-object Code2/.batch107.fragment.cpp)" = "276b5a9e5e1726fe81cda815c49f3dd0c54e47de"
          test "$(git hash-object Code2/.batch107_integrate.py)" = "eff6fcbe1813788b7514aade4380c722f5548efd"
          grep -F 'static_assert(0x34A74u-0x34998u==220u);' Code2/.batch107.fragment.cpp
      - name: Integrate Batch 107
        run: python Code2/.batch107_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch107_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime107Boundary','patch_code16','app107_imul_shld3','function_34998','0x34A11u,k0','0x34A27u,k1','0x34A3Du,k2','0x34A54u,k3','bits>>13','0x193E0u+src','0x19660u+src']:
              assert x in c,x
          assert '222,608 / 239,698 = 92.8702% (92.87%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 107
        run: |
          cp Code2/.batch107_integrate.py /tmp/batch107_integrate.py
          rm -f Code2/.batch107.fragment.cpp Code2/.batch107_integrate.py .github/workflows/integrate-code2-batch107.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 107"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch107_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`34A74`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 107"
          git push origin HEAD:code1-decompilation
