name: Integrate CODE.2 Batch 90
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch90.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 90
        run: |
          git merge-base --is-ancestor 48a5b76859c6e7a72a8499b4d5fe3c5fc5c9784e HEAD
          test "$(git hash-object Code2/.batch90.fragment.cpp)" = "267070e3d825fa4e6056e02905a3e4cc374f3edd"
          test "$(git hash-object Code2/.batch90_integrate.py)" = "4bc7328bd46cece6a4338486854732b1ae583abf"
          grep -F 'static_assert(0x335DCu-0x334C4u==280u);' Code2/.batch90.fragment.cpp
      - name: Integrate Batch 90
        run: python Code2/.batch90_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch90_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_334c4','Application90Boundary','call_35680','0xFFBFu','0xC65Cu']:
              assert x in c,x
          assert '217,336 / 239,698 = 90.6708% (90.67%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 90
        run: |
          cp Code2/.batch90_integrate.py /tmp/batch90_integrate.py
          rm -f Code2/.batch90.fragment.cpp Code2/.batch90_integrate.py .github/workflows/integrate-code2-batch90.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 90"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch90_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`335DC`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 90"
          git push origin HEAD:code1-decompilation
