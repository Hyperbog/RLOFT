name: Integrate CODE.2 batch 36

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch36.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 36
        run: python Code2/.integrate_batch36.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 115725u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2259u;' in code
          assert '**117,984 / 239,698 = 49.2219% (49.22%)**' in progress
          assert 'void function_1ae30(Machine& m,Application36Boundary& b) noexcept' in code
          assert 'const u32 right=static_cast<u32>(static_cast<u8>(load_le16(dg(m,0x9E35u))))&2u;' in code
          assert 'u32 result=fallback; // aliases the caller\'s third stack-argument slot in the binary.' in code
          assert 'result=(random*8u)>>15u;' in code
          assert 'static_assert((0x1AF85u-0x1AE30u)+(0x1B1C2u-0x1AF90u)==903u);' in code
          assert '1AF85..1AF8F | padding | 11' in ledger
          assert '1B1C2..1B1C3 | alignment | 2' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2259,total
          assert 115725+2259==117984
          assert 239698-117984==121714
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch36_fragment.cpp Code2/.integrate_batch36.py .github/workflows/integrate-code2-batch36.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 36"
          git push origin HEAD:code1-decompilation
