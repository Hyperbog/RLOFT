name: Integrate CODE.2 Batch 114
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch114.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 114
        run: |
          git merge-base --is-ancestor 3181938e69687f068ce34c5b84ebcde2ddb7a8ea HEAD
          test "$(git hash-object Code2/.batch114.fragment.cpp)" = "18134e0aff502e58a9c7fcf41d123828a5a674c9"
          test "$(git hash-object Code2/.batch114_integrate.py)" = "2e769731e5cb62502e38b3357f0cbe1f2afb1d35"
          grep -F 'static_assert(0x356D8u-0x35680u==88u);' Code2/.batch114.fragment.cpp
          grep -F 'static_assert(0x35869u-0x35798u==209u);' Code2/.batch114.fragment.cpp
          grep -F 'two word stores' Code2/.batch114.fragment.cpp
      - name: Integrate Batch 114
        run: python Code2/.batch114_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch114_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          for x in ['app114_mul_fraction','function_35680','function_356d8','function_35730','function_35798']:
              assert x in c,x
          assert 'si=static_cast<u16>(si^0x8000u);' in c
          assert 'const bool borrow=(ax!=0u);' in c
          assert 'delta=0x1680u;' in c
          assert 'static_cast<s32>(depth)<static_cast<s32>(0x5800u)' in c
          assert 'constexpr u32 kVerifiedTranslatedBytes = 221731u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 4465u;' in c
          assert '226,196 / 239,698 = 94.3671% (94.37%)' in p
          for x in ['35797..35797 | alignment | 1','35869..3586F | alignment | 7','35870..35877 | data | 8']:
              assert x in l,x
          PY
          git diff --check
      - name: Commit substantive Batch 114
        run: |
          cp Code2/.batch114_integrate.py /tmp/batch114_integrate.py
          rm -f Code2/.batch114.fragment.cpp Code2/.batch114_integrate.py .github/workflows/integrate-code2-batch114.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 114"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch114_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`35878`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 114"
          git push origin HEAD:code1-decompilation
