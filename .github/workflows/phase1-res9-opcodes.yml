name: Phase 1 - cross-title RES9 opcode/operand reconstruction

on:
  push:
    branches: [Ravenloft-Enhanced]
    paths:
      - 'Tools/phase1_res9_handler_map.py'
      - 'Tools/phase1_res9_arity_correlate.py'
      - 'Tools/phase1_res9_control_flow.py'
      - 'Tools/phase1_res9_stone_four.py'
      - 'Tools/phase1_res9_opcode_probe.py'
      - '.github/workflows/phase1-res9-opcodes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-res9-wordcode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research tools
        uses: actions/checkout@v4
      - name: Checkout authenticated original game media
        uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: preservation
          sparse-checkout: |
            MASTER/Menzoberranzan
            MASTER/Ravenloft - Stone Prophet
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Verify opcode dispatch and test operand boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python Tools/phase1_res9_handler_map.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-res9-handlers.json
          python -m py_compile Tools/phase1_res9_handler_map.py
          printf '%s\n' 'Original-code dispatcher and full-corpus opcode/arity diagnostic passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Correlate opcode operand counts against full RES9 corpora
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_res9_arity_correlate.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-res9-arity-correlation.json
          python -m py_compile Tools/phase1_res9_arity_correlate.py

      - name: Validate candidate decoded wordcode branch targets
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_res9_control_flow.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-res9-control-flow.json
          python -m py_compile Tools/phase1_res9_control_flow.py

      - name: Verify four remaining Stone programs and target-999 state
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_res9_stone_four.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-stone-res9-last-four.json
          python -m py_compile Tools/phase1_res9_stone_four.py

      - name: Publish derived evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-res9-handler-evidence
          path: audit/
          retention-days: 30
          if-no-files-found: error
