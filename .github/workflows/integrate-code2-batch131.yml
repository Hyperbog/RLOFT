name: Cleanup CODE.2 Batch 131 Gate
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch131.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/integrate-code2-batch131.yml
          git commit -m "Clean CODE.2 batch 131 integration gate"
          git push origin HEAD:code1-decompilation
