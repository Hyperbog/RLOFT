name: Integrate CODE.2 batch 18
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch18.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 18
        run: python3 Code2/integrate_batch18.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 60401u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1147u;' in cpp
          assert 'static_assert(0x0D53Eu-0x0D4E8u==86u);' in cpp
          assert 'if(static_cast<s32>(v)<=0)' in cpp
          assert 'if(l1>l0)track=1;' in cpp and 'if(l0>l1)track=0;' in cpp
          assert 'if(b.divide_error)b.divide_error();' in cpp
          assert 'static constexpr u32 offsets[9]={0u,1u,0u,1u,0u,2u,3u,4u,5u};' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,z,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); z=int(z,16); n=int(n)
              assert z-a+1==n,(line,z-a+1,n)
              total+=n
          assert total==1147,total
          assert 60401+total==61548
          assert 239698-61548==178150
          assert '**61,548 / 239,698 = 25.6773% (25.68%)**' in prog
          print('CODE.2 batch 18 accounting verified: 60401 + 1147 = 61548')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch18.zb64 Code2/integrate_batch18.py .github/workflows/integrate-code2-batch18.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 18'
          git push origin code1-decompilation
