name: Integrate CODE.2 Batch 92
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch92.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 92
        run: |
          git merge-base --is-ancestor 4bd5430d0f03db714a591afa01098862314602ab HEAD
          test "$(git hash-object Code2/.batch92.fragment.cpp)" = "7d37582f89c0da6a4a98d72da681b90f3c015ad0"
          test "$(git hash-object Code2/.batch92_integrate.py)" = "e2082200e8b02fbfc6503b6b31bbb601d3219b6b"
          grep -F 'static_assert(0x33807u-0x337C8u==63u);' Code2/.batch92.fragment.cpp
      - name: Integrate Batch 92
        run: python Code2/.batch92_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch92_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_337c8','no_borrow=slot>=2u','0x25621u','table+slot+0x102u']:
              assert x in c,x
          assert '33807..33807 | alignment | 1' in l
          assert '217,892 / 239,698 = 90.9027% (90.90%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 92
        run: |
          cp Code2/.batch92_integrate.py /tmp/batch92_integrate.py
          rm -f Code2/.batch92.fragment.cpp Code2/.batch92_integrate.py .github/workflows/integrate-code2-batch92.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 92"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch92_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`33808`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 92"
          git push origin HEAD:code1-decompilation
