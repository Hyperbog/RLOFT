name: Integrate CODE.2 batch 21
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch21.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 21
        run: python3 Code2/integrate_batch21.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 71409u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1411u;' in cpp
          assert 'static_assert(0x0FD84u-0x0F790u==1524u);' in cpp
          assert 'static_assert(0x10156u-0x10108u==78u);' in cpp
          assert 'if(type>=9u&&type<=11u)' in cpp
          assert 'if((total&1u)!=0u)' in cpp
          assert '0x1F00u' in cpp
          assert 'if(id>=0xA7&&id<=0xC9)' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,z,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); z=int(z,16); n=int(n)
              assert z-a+1==n,(line,z-a+1,n)
              total+=n
          assert total==1411,total
          assert 71409+total==72820
          assert 239698-72820==166878
          assert '**72,820 / 239,698 = 30.3799% (30.38%)**' in prog
          print('CODE.2 batch 21 accounting verified: 71409 + 1411 = 72820')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch21.zb64 Code2/integrate_batch21.py .github/workflows/integrate-code2-batch21.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 21'
          git push origin code1-decompilation
