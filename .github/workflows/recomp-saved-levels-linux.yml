name: Original 181B4 Saved-Level Direct-Load Gate
on:
  workflow_dispatch:
  push:
    branches: [Recomp]
    paths:
      - 'Recomp/src/code2_original_level_loader.cpp'
      - 'Recomp/src/code2_original_save_game.cpp'
      - 'Code2/graphics/original_levels_grid.hpp'
      - 'Recomp/CMakeLists.txt'
      - '.github/workflows/recomp-saved-levels-linux.yml'
permissions:
  contents: read
concurrency:
  group: recomp-saved-levels-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-saved-levels:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build original CODE2 181B4 file-backed loader
        run: |
          cmake -S Recomp -B build/saved-levels -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF
          cmake --build build/saved-levels --target rloft_original_code2_level_loader rloft_original_code2_save_game --parallel 2
      - name: Sparse checkout preserved independent SAVE10 snapshot (read only)
        uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: original-media
          sparse-checkout: |
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE10
            MASTER/Ravenloft - Strahd's Possession/RLOFT/SINTAB
            MASTER/Ravenloft - Strahd's Possession/RLOFT/CODE.2
            MASTER/Ravenloft - Strahd's Possession/RLOFT/LEVELS.DAT
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Execute original 181B4 direct-save path for all 17 levels
        shell: bash
        run: |
          set -euo pipefail
          folder="original-media/MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE10"
          test -f "$folder/SAVE.DAT"
          level_archive="original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT/LEVELS.DAT"
          test -f "$level_archive"
          # One identical reconstructed original 181B4 loader must accept
          # every indexed source level, without level-specific host code.
          build/saved-levels/rloft_original_code2_level_loader "$level_archive" | tee build/saved-levels/all-32-original-levels.log
          grep -q 'CODE2_181B4_ORIGINAL_32_LEVEL_FILE_GATE_PASS' build/saved-levels/all-32-original-levels.log
          test "$(find "$folder" -maxdepth 1 -name 'LEV[0-9][0-9][0-9].DAT' | wc -l)" -eq 17
          build/saved-levels/rloft_original_code2_level_loader --saved-levels "$folder" | tee build/saved-levels/verification.log
          grep -q 'CODE2_181B4_SAVED_LEVELS_ORIGINAL_SOURCE_GATE_PASS count=17' build/saved-levels/verification.log
          grep -q 'CODE2_COMPLETE_SAVE_BOOT_AND_DOS_PIXEL_PARITY_ACCEPTED=NO' build/saved-levels/verification.log
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          cp "$folder/SAVE.DAT" "$folder/LEV005.DAT" "$temp/"
          cp "original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT/SINTAB" "$temp/SINTAB"
          echo "19b6bc15f1be616bb8ff49dc9029995a1a0413fae06addc9fd41ddef761d0e87  $temp/SINTAB" | sha256sum -c -
          build/saved-levels/rloft_original_code2_level_loader --saved-camera "$temp" | tee build/saved-levels/camera-verification.log
          grep -q 'CODE2_SOURCE_MAPPED_SAVE5_CAMERA_RAY_PASS level=5' build/saved-levels/camera-verification.log
          grep -q 'CODE2_COMPLETE_07938_SAVE_DESERIALIZER_EXECUTED=NO' build/saved-levels/camera-verification.log
          code2="original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT/CODE.2"
          echo "853e0a4dfcabebcfeecb975cf2a92b92eb4d94806d835ad30a0bab3e265bd314  $code2" | sha256sum -c -
          build/saved-levels/rloft_original_code2_save_game "$temp" "$code2" | tee build/saved-levels/source-save-game.log
          grep -q 'CODE2_07938_ORIGINAL_SAVE5_LOAD_AND_181B4_DIRECT_LEVEL_PASS' build/saved-levels/source-save-game.log
          grep -q 'CODE2_CONTINUOUS_CODE1_GAME_BOOT_ACCEPTED=NO' build/saved-levels/source-save-game.log
          echo 'No original saved-game media or serialized game state published.'
