name: Build native WPF Fluent extractor (manual)

# Intentional: no push trigger. The private repo currently has GitHub Actions
# budget/runner restrictions; don't spend minutes on each documentation commit.
on:
  workflow_dispatch:
  push:
    branches:
      - extractor-wpf-fluent
    paths:
      - "Tools/WpfExtractor/**"
      - "Tools/anm/wpf_bridge.py"
      - ".github/workflows/build-wpf-fluent.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Workflow is registered on the default branch for manual dispatch,
          # but builds the isolated replacement-UI branch.
          ref: extractor-wpf-fluent

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: Tools/anm/requirements.txt

      - name: Download verified FFmpeg for video export
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          $out = Join-Path $env:RUNNER_TEMP "ffmpeg-unpacked"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $shaText = (Invoke-WebRequest -Uri "$url.sha256").Content.Trim()
          $expected = ($shaText -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg checksum mismatch" }
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $ffmpeg = Get-ChildItem $out -Filter ffmpeg.exe -File -Recurse |
                    Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) { throw "No ffmpeg.exe in verified archive." }
          "RLOFT_FFMPEG=$ffmpeg" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Regression tests and compile packaged Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & Tools/WpfExtractor/build-local.ps1 -FFmpegPath $env:RLOFT_FFMPEG
          if ($LASTEXITCODE -ne 0) { throw "Local build wrapper failed." }

      - name: Upload complete Windows 11 package
        uses: actions/upload-artifact@v4
        with:
          name: RavenloftExtractor-WPF-Fluent-Windows11-x64
          path: |
            Tools/WpfExtractor/build-output/RavenloftExtractor-Windows11-x64.zip
            Tools/WpfExtractor/build-output/RavenloftExtractor-Windows11-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
