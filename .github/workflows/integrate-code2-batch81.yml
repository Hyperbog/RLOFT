name: Integrate CODE.2 Batch 81
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch81.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 81
        run: |
          test "$(git hash-object Code2/.batch81.fragment.cpp)" = "8ad763aba27bb5aa3e16a5283725e93d482eab92"
          test "$(git hash-object Code2/.batch81_integrate.py)" = "787068c6e07ce0f751369d7471405957035dbd47"
          grep -F 'static_assert(0x3261Cu-0x325B0u==108u);' Code2/.batch81.fragment.cpp
      - name: Integrate Batch 81
        run: python Code2/.batch81_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch81_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_324cc','function_324f8','function_32588','function_325b0','((resource_row*3u)<<8)+1u','function_32150(m,palette)']: assert x in c,x
          for x in ['32586..32587 | alignment | 2','325AD..325AF | alignment | 3','3261C..3261F | padding | 4']: assert x in l,x
          assert '213,308 / 239,698 = 88.9903% (88.99%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 81
        run: |
          cp Code2/.batch81_integrate.py /tmp/batch81_integrate.py
          rm -f Code2/.batch81.fragment.cpp Code2/.batch81_integrate.py .github/workflows/integrate-code2-batch81.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 81"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch81_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`32620`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 81"
          git push origin HEAD:code1-decompilation
