name: Integrate CODE.2 final reconciliation
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-final.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Integrate final CODE.2 fold
        run: python3 Code2/.batch143_integrate.py integrate
      - name: Verify integration
        run: python3 Code2/.batch143_integrate.py verify
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Commit final CODE.2 reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Code2/Code2.cpp Code2/PROGRESS.md Code2/CODE2_CONTINUITY_ADDENDUM.md Code2/RESUME_CHECKPOINT.md
          git commit -m 'Complete CODE.2 object-1 decompilation reconciliation'
          git push
