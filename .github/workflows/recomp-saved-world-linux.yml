name: Authentic Saved Level 5 Wall Compositor Probe
on:
  workflow_dispatch:
  push:
    branches: [Recomp]
    paths:
      - 'Code2/Code2.cpp'
      - 'Recomp/src/code2_original_world_frame.cpp'
      - 'Recomp/src/code2_compiled_graphics_frame.cpp'
      - 'Recomp/src/original_code2_1f494_bridge.inc'
      - 'Recomp/src/code2_original_save_game.cpp'
      - 'Recomp/src/code2_original_level_loader.cpp'
      - 'Recomp/src/original_sintab_raster.hpp'
      - 'Recomp/src/original_code2_369d8_raster.hpp'
      - 'Code2/graphics/original_levels_grid.hpp'
      - '.github/workflows/recomp-saved-world-linux.yml'
permissions:
  contents: read
concurrency:
  group: recomp-save5-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  saved-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile authentic world frame
        run: |
          cmake -S Recomp -B build/save5-world -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF
          cmake --build build/save5-world --target rloft_original_code2_world_frame --parallel 2
      - name: Read-only original media
        uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: original-media
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE01/SAVE.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE01/LEV023.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE03/SAVE.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE03/LEV005.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE04/SAVE.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE04/LEV005.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE08/SAVE.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE08/LEV005.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE09/SAVE.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE09/LEV005.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE10/SAVE.DAT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE10/LEV005.DAT
            MASTER/Ravenloft - Strahd's Possession/RLOFT/SINTAB
            MASTER/Ravenloft - Strahd's Possession/RLOFT/RES4
            MASTER/Ravenloft - Strahd's Possession/RLOFT/RES0
            MASTER/Ravenloft - Strahd's Possession/RLOFT/RES1
            MASTER/Ravenloft - Strahd's Possession/RLOFT/INIT
            MASTER/Ravenloft - Strahd's Possession/RLOFT/COLORS
            MASTER/Ravenloft - Strahd's Possession/RLOFT/CODE.2
            MASTER/Ravenloft - Strahd's Possession/RLOFT/NPCS.DAT
            MASTER/Ravenloft - Strahd's Possession/RLOFT/OBJECTS.DAT
            MASTER/Ravenloft - Strahd's Possession/RLOFT/RES3
      - name: Execute source saved camera and original wall pass
        shell: bash
        run: |
          set -euo pipefail
          media="original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT"
          source_save="original-media/MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE10"
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"; rm -f build/save5-world/save5.*' EXIT
          cp "$source_save/SAVE.DAT" "$source_save/LEV005.DAT" "$scratch/"
          cp "$media/SINTAB" "$media/RES4" "$media/RES0" "$media/INIT" "$media/COLORS" "$media/CODE.2" "$media/NPCS.DAT" "$media/OBJECTS.DAT" "$media/RES3" "$scratch/"
          echo "853e0a4dfcabebcfeecb975cf2a92b92eb4d94806d835ad30a0bab3e265bd314  $scratch/CODE.2" | sha256sum -c -
          echo "f2dd1175bf42e8291b95952282dfc0cfb84455aaa532987cdd7380094c8eb30b  $scratch/NPCS.DAT" | sha256sum -c -
          echo "f23f0e7c1856904aa0156b0bf174cab794a41a327352b6ca00c3591ae5f2eed0  $scratch/OBJECTS.DAT" | sha256sum -c -
          echo "44955ebbed0a8ed8d874fae07b01710317044882ab3c7c95d9be54e883df9a36  $scratch/RES3" | sha256sum -c -
          echo "a7d486323c255e54ff29a032837b00f4376dfb19191f84575406d7748fbf9dc8  $scratch/LEV005.DAT" | sha256sum -c -
          echo "19b6bc15f1be616bb8ff49dc9029995a1a0413fae06addc9fd41ddef761d0e87  $scratch/SINTAB" | sha256sum -c -
          echo "d8989c50fa58e317ff33465e7baec16e970f40586417d790fd8a1b9005c60f46  $scratch/RES4" | sha256sum -c -
          build/save5-world/rloft_original_code2_world_frame --save-world \
            "$scratch/SAVE.DAT" "$scratch/LEV005.DAT" "$scratch/SINTAB" \
            "$scratch/RES4" "$scratch/COLORS" "$scratch/CODE.2" "$scratch/INIT" "$scratch/RES0" "$scratch/NPCS.DAT" "$scratch/OBJECTS.DAT" "$scratch/RES3" build/save5-world/save5 \
            | tee build/save5-world/save5-verification.log
          grep -q CODE2_SAVED_LEVEL5_07938_TO_181B4_TO_32954_PASS build/save5-world/save5-verification.log
          grep -q CODE2_SAVED_LEVEL5_ORIGINAL_WALL_FRAME_PASS build/save5-world/save5-verification.log
          grep -q CODE2_SAVE5_ORIGINAL_181B4_1E8C8_SCENE_INDEX_PASS build/save5-world/save5-verification.log
          grep -q CODE2_SAVE5_SOURCE_34DE8_34BB0_33E6C_QUAD_GATE build/save5-world/save5-verification.log
          grep -q CODE2_SOURCE_NPCS_RES3_ORIGINAL_EH7_37590_PASS build/save5-world/save5-verification.log
          grep -q CODE2_334C4_35798_SOURCE_CAMERA_BASIS_VERIFIED build/save5-world/save5-verification.log
          grep -q CODE2_SAVE5_ORIGINAL_2C294_RES3_SCENE_PROJECTION_PASS build/save5-world/save5-verification.log
          grep -q CODE2_SAVE5_ORIGINAL_16D04_INIT_HUD_BASE_PASS build/save5-world/save5-verification.log
          grep -q CODE2_SAVE5_ORIGINAL_16810_168C8_1686C_16934_16990_SCENE_DEFINITIONS_PASS build/save5-world/save5-verification.log
          grep -q 'CODE2_SAVED_LEVEL5_ORIGINAL_INIT_RES4_BASED_SKY_GROUND sky_res4=634 ground_res4=635' build/save5-world/save5-verification.log
          grep -q CODE2_SAVE5_ORIGINAL_1EA04_2F29C_2939C_2A380_RES0_HUD_PASS build/save5-world/save5-verification.log
          grep -q 'CODE2_ORIGINAL_1F8FC_2E510_RES0_GAMEPLAY_FRAME_BASE_PASS res0_loads=2 frame_blits=400' build/save5-world/save5-verification.log
          grep -q CODE2_SAVED_LEVEL5_ORIGINAL_1F1C8_34A74_TEXTURED_OUTDOOR_DISPATCH_PASS build/save5-world/save5-verification.log
          grep -q 'CODE2_SAVED_LEVEL5_ORIGINAL_34998_34A74_342E4_34954_OUTDOOR_VGA_PASS' build/save5-world/save5-verification.log
          grep -q 'CODE2_LEVEL5_SOURCE_SKY_GROUND_WALL_QUAD_RES0_HUD=PASS RES3_36CEC_SOURCE_DRAWS=0 RES3_369D8_INDEXED_WRITES=0 RES3_SPRITE_DOS_PARITY=NOT_VERIFIED' build/save5-world/save5-verification.log
          test "$(wc -c < build/save5-world/save5.idx)" -eq 128000
          test "$(wc -c < build/save5-world/save5.pal)" -eq 768
          sha256sum build/save5-world/save5.idx build/save5-world/save5.pal
          echo 'Original media/decoded world frames will not be published.'

      - name: Genuine saved-camera actor-visibility census (source-only)
        shell: bash
        run: |
          set -euo pipefail
          base="original-media/MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT"
          media="original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT"
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          for name in SINTAB RES4 COLORS CODE.2 INIT RES0 NPCS.DAT OBJECTS.DAT RES3; do
            cp "$media/$name" "$scratch/"
          done
          echo "ORIGINAL_SAVED_CAMERA_CENSUS_BEGIN"
          for id in 03 04 08 09; do
            cp "$base/SAVE$id/SAVE.DAT" "$scratch/SAVE.DAT"
            cp "$base/SAVE$id/LEV005.DAT" "$scratch/LEV005.DAT"
            python3 - "$scratch/SAVE.DAT" "$id" <<'PY'
          import struct,sys
          data=open(sys.argv[1],"rb").read()
          level,x,y,heading=struct.unpack_from("<IIII",data,0x52)
          print(f"SOURCE_CAMERA save={sys.argv[2]} level={level} x=0x{x:08x} y=0x{y:08x} heading={heading}")
          PY
            status=0
            timeout 120s build/save5-world/rloft_original_code2_world_frame --save-world \
              "$scratch/SAVE.DAT" "$scratch/LEV005.DAT" "$scratch/SINTAB" \
              "$scratch/RES4" "$scratch/COLORS" "$scratch/CODE.2" "$scratch/INIT" \
              "$scratch/RES0" "$scratch/NPCS.DAT" "$scratch/OBJECTS.DAT" \
              "$scratch/RES3" "$scratch/output" > "$scratch/probe.log" 2>&1 || status=$?
            visibility=$(grep -oE 'primary_cells_visible=[0-9]+' "$scratch/probe.log" | tail -1 || true)
            emissions=$(grep -oE 'emitted_calls=[0-9]+' "$scratch/probe.log" | tail -1 || true)
            echo "SOURCE_CAMERA_RESULT save=$id status=$status ${visibility:-visibility_unresolved} ${emissions:-emissions_unresolved}"
            if test "$status" -ne 0; then
              echo "SOURCE_CAMERA_NOT_VALIDATED save=$id; inspect source-only failure separately"
              # Emit only C++ failure/assertion markers; never print saved
              # party data, original media bytes or captured image contents.
              diagnostics=$(grep -E 'CODE2_AUTHENTIC_WORLD_RES4_FRAME_FAIL|CHECK failed|CHECK\(|terminate called|runtime_error|out_of_range' "$scratch/probe.log" | tail -n 5 || true)
              echo "SOURCE_CAMERA_FAILURE_REASON save=$id ${diagnostics:-no_reason_emitted}"
            fi
            rm -f "$scratch/output.idx" "$scratch/output.bmp" "$scratch/output.pal" "$scratch/probe.log"
          done
          echo "ORIGINAL_SAVED_CAMERA_CENSUS_END"
          echo "No original save files, RES bytes, indexed frames or palettes uploaded."

      - name: Genuine Level 23 source-only 2C294 to 36CEC sprite probe
        shell: bash
        run: |
          set -euo pipefail
          root="original-media/MASTER/Ravenloft - Strahd's Possession"
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cp "$root/cloud_saves/RLOFT/SAVE01/SAVE.DAT" "$scratch/"
          cp "$root/cloud_saves/RLOFT/SAVE01/LEV023.DAT" "$scratch/"
          for f in SINTAB RES4 COLORS CODE.2 INIT RES0 NPCS.DAT OBJECTS.DAT RES3; do
            cp "$root/RLOFT/$f" "$scratch/"
          done
          status=0
          build/save5-world/rloft_original_code2_world_frame --save-sprite-probe \
            "$scratch/SAVE.DAT" "$scratch/LEV023.DAT" "$scratch/SINTAB" \
            "$scratch/RES4" "$scratch/COLORS" "$scratch/CODE.2" "$scratch/INIT" \
            "$scratch/RES0" "$scratch/NPCS.DAT" "$scratch/OBJECTS.DAT" \
            "$scratch/RES3" "$scratch/scene23" > "$scratch/probe.log" 2>&1 || status=$?
          result=$(grep 'CODE2_GENUINE_RES3_SOURCE_PROBE' "$scratch/probe.log" | tail -n 1 || true)
          visible=$(grep 'CODE2_SAVE5_RES3_SCENE_SOURCE_RAY_VISIBILITY' "$scratch/probe.log" | tail -n 1 || true)
          echo "GENUINE_LEVEL23_RASTER_RESULT status=$status ${visible:-visibility_unresolved} ${result:-source_renderer_unresolved}"
          if test "$status" -ne 0; then
            error=$(grep -E 'CODE2_AUTHENTIC_WORLD_RES4_FRAME_FAIL|CODE2_SOURCE_36CEC_RASTER_FAILURE' "$scratch/probe.log" | tail -n 2 || true)
            echo "GENUINE_LEVEL23_RASTER_EXCEPTION ${error:-no_error_marker}"
            exit "$status"
          fi
          test -n "$result"
          test "$(wc -c < "$scratch/scene23.idx")" -eq 128000
          test "$(wc -c < "$scratch/scene23.pal")" -eq 768
          echo "Original media and generated RES3 indexed pixels remain private and are deleted."

      - name: Compose authentic Level 5 indexed world with its original RES3 sprite
        shell: bash
        run: |
          set -euo pipefail
          root="original-media/MASTER/Ravenloft - Strahd's Possession"
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cp "$root/cloud_saves/RLOFT/SAVE09/SAVE.DAT" "$scratch/SAVE.DAT"
          cp "$root/cloud_saves/RLOFT/SAVE09/LEV005.DAT" "$scratch/LEV005.DAT"
          for f in SINTAB RES4 COLORS CODE.2 INIT RES0 RES1 NPCS.DAT OBJECTS.DAT RES3; do
            cp "$root/RLOFT/$f" "$scratch/"
          done
          echo "c13b8ae42f7d3b65c06d8413627f40a2a155a7404da44abfc158b38a4e5efd19  $scratch/RES1" | sha256sum -c -
          # This is the archive-preserved SAVE09 (187 degrees), NOT the
          # owner's separate private SAVE09(2).zip two-skeleton camera.
          # The exact private save must be tested only on the owner's PC.
          echo "853e0a4dfcabebcfeecb975cf2a92b92eb4d94806d835ad30a0bab3e265bd314  $scratch/CODE.2" | sha256sum -c -
          status=0
          timeout 180s build/save5-world/rloft_original_code2_world_frame --save-complete-frame \
            "$scratch/SAVE.DAT" "$scratch/LEV005.DAT" "$scratch/SINTAB" \
            "$scratch/RES4" "$scratch/COLORS" "$scratch/CODE.2" "$scratch/INIT" \
            "$scratch/RES0" "$scratch/NPCS.DAT" "$scratch/OBJECTS.DAT" \
            "$scratch/RES3" "$scratch/frame" "$scratch/RES1" > "$scratch/full.log" 2>&1 || status=$?
          if test "$status" -ne 0; then
            error=$(grep -oE 'CODE2_AUTHENTIC_WORLD_RES4_FRAME_FAIL:[^\\]*|CODE2_SOURCE_36CEC_RASTER_FAILURE:[^\\]*' "$scratch/full.log" | tail -n 3 || true)
            echo "GENUINE_COMPLETE_WORLD_FRAME_FAIL status=$status reason=${error:-no_failure_marker}"
            exit 1
          fi
          grep -Eq 'CODE2_GENUINE_SAVED_SOURCE_FULL_FRAME_PASS level=5 source_36cec_calls=1 raster_indexed_writes=127 off_aperture_cpu_writes=[0-9]+ frame_indices=128000 palette_rgb6=768 DOS_VGA_PARITY=NOT_VERIFIED' "$scratch/full.log"
          grep -q 'CODE2_LEVEL5_SOURCE_SKY_GROUND_WALL_QUAD_RES0_HUD=PASS' "$scratch/full.log"
          grep -q 'CODE2_ORIGINAL_1F8FC_2E510_RES0_GAMEPLAY_FRAME_BASE_PASS res0_loads=2 frame_blits=400' "$scratch/full.log"
          grep -q 'CODE2_ORIGINAL_1F494_1EA90_PARTY_HUD active_original_characters=4 source_state_lut_nonzero=1015 resource_calls=22 masked_298f0_2a584=16 direct_2975c=4 fills_29aa4=16 borders_2e374=1 hand_slots_1ea90=8 decimal_2e6f0=0 centered_30508=0 glyph_303c8=0 unsupported_text=0 callback_failure=0 DOS_PARITY=NOT_VERIFIED' "$scratch/full.log"
          # Source counts only. Do not upload original party fields, art,
          # decoded portraits, frames or resource bytes to CI artifacts.
          grep -o 'CODE2_ORIGINAL_1F494_1EA90_PARTY_HUD[^\\]*' "$scratch/full.log" | tail -n 1
          grep -Eq 'CODE2_SOURCE_RES3_SPRITE_ACTIVE_SCANOUT .*changed_pixels=[1-9][0-9]* world_rows_changed=[1-9][0-9]* bbox=' "$scratch/full.log"
          test "$(wc -c < "$scratch/frame.idx")" -eq 128000
          test "$(wc -c < "$scratch/frame.pal")" -eq 768
          # Source-asset-only reconstruction of the independently
          # observed original DOSBox-X VGA DAC: bank 0 plus the 8
          # grayscale triples 246..253 from actual COLORS bank 3.
          # Check RGB6 bytes, NOT pixel parity or retail caller timing.
          grep -q 'CODE2_ORIGINAL_DOSBOXX_DAC_RECONCILIATION source_COLORS_base_bank=0 source_COLORS_slice_bank=3 first_index=246 entries=8 retail_palette_caller_parity=NOT_VERIFIED' "$scratch/full.log"
          echo '0af8ea393f1f266596af59c1a2013350b51000b7456d377ab284ebbc43db0812  '"$scratch/frame.pal" | sha256sum -c -
          test -s "$scratch/frame.bmp"
          echo 'GENUINE_COMPLETE_WORLD_FRAME_NATIVE_PASS original_save=SAVE09 expected_source_sprite_writes=127 full_frame=YES DOS_VGA_PARITY=NOT_VERIFIED'
          sha256sum "$scratch/frame.idx" "$scratch/frame.pal"
          # Deliberately synthetic guest-HUD status fields on an otherwise
          # untouched source save. Only checks genuine original font pixels
          # are renderable; this output is NOT a retail save/frame oracle.
          status=0
          timeout 180s build/save5-world/rloft_original_code2_world_frame --save-status-text-fixture \
            "$scratch/SAVE.DAT" "$scratch/LEV005.DAT" "$scratch/SINTAB" \
            "$scratch/RES4" "$scratch/COLORS" "$scratch/CODE.2" "$scratch/INIT" \
            "$scratch/RES0" "$scratch/NPCS.DAT" "$scratch/OBJECTS.DAT" \
            "$scratch/RES3" "$scratch/synthetic-text" "$scratch/RES1" \
            > "$scratch/synthetic-text.log" 2>&1 || status=$?
          if test "$status" -ne 0; then
            echo "SYNTHETIC_SOURCE_STATUS_TEXT_FAIL status=$status"
            grep -oE 'CODE2_ORIGINAL_1F494_RESOURCE_ERROR[^\\]*|CODE2_ORIGINAL_1F494_1EA90_PARTY_HUD[^\\]*|CODE2_AUTHENTIC_WORLD_RES4_FRAME_FAIL:[^\\]*' "$scratch/synthetic-text.log" | tail -n 5 || true
            exit 1
          fi
          grep -q 'CODE2_SYNTHETIC_STATUS_FIXTURE_ONLY untouched_archive_inputs=YES guest_status_adjustments=5 original_save_parity=NOT_VERIFIED' "$scratch/synthetic-text.log"
          grep -Eq 'CODE2_ORIGINAL_1F494_1EA90_PARTY_HUD .*decimal_2e6f0=2 centered_30508=2 glyph_303c8=[2-9][0-9]* unsupported_text=0 callback_failure=0' "$scratch/synthetic-text.log"
          test "$(wc -c < "$scratch/synthetic-text.idx")" -eq 128000
          test "$(wc -c < "$scratch/synthetic-text.pal")" -eq 768
          echo 'SOURCE_STATUS_GLYPH_REAL_RES0_FONT_PASS synthetic_guest_status=YES independent_DOS_parity=NOT_VERIFIED'
          echo 'All original media, indexed frames, previews and palettes were kept private and deleted.'
