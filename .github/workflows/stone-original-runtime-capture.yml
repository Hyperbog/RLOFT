name: Original Stone runtime hook source and compile verification
on:
  push:
    paths:
      - "Recomp/tools/dosboxx_stone_runtime_capture/**"
      - ".github/workflows/stone-original-runtime-capture.yml"
  workflow_dispatch:
jobs:
  source-and-compiled-hook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python source
        run: python3 -m py_compile Recomp/tools/dosboxx_stone_runtime_capture/*.py
      - name: Compile and run observer on synthetic guest memory
        run: python3 Recomp/tools/dosboxx_stone_runtime_capture/test_stone_runtime_capture.py
      - name: Authenticate and instrument pinned DOSBox-X normal core
        run: |
          mkdir -p /tmp/stone-original-dosbox/src/cpu
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/joncampbell123/dosbox-x/b6abbd5980a885f5f310a4088c59a8688d1b116c/src/cpu/core_normal.cpp \
            -o /tmp/stone-original-dosbox/src/cpu/core_normal.cpp
          python3 Recomp/tools/dosboxx_stone_runtime_capture/apply_stone_runtime_capture.py \
            --dosbox-root /tmp/stone-original-dosbox \
            --header Recomp/tools/dosboxx_stone_runtime_capture/rloft_stone_runtime_capture.hpp
          grep -c 'rloft_stone_capture::tick' \
            /tmp/stone-original-dosbox/src/cpu/core_normal.cpp | grep -x 1
          test -f /tmp/stone-original-dosbox/src/cpu/rloft_stone_runtime_capture.hpp
      - name: Execution boundary
        run: |
          echo "Original Stone DOS game session: NOT RUN"
          echo "Full DOSBox-X Windows build: NOT RUN"

  full-windows-emulator:
    runs-on: windows-2022
    needs: source-and-compiled-hook
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Authenticate, patch, and build the full DOSBox-X x64 SDL2 emulator
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root = Join-Path $env:RUNNER_TEMP 'dosbox-x-Stone'
          & "$env:GITHUB_WORKSPACE/Recomp/tools/dosboxx_stone_runtime_capture/build_windows_stone_capture.ps1" -RloftRoot $env:GITHUB_WORKSPACE -DosboxSourceRoot $root
          if($LASTEXITCODE -and $LASTEXITCODE -ne 0){throw "Full emulator build script failed"}
          $exe=Join-Path $root 'bin/x64/Release SDL2/dosbox-x.exe'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf)){throw "Built DOSBox-X missing"}
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ORIGINAL_DOSBOXX_STONE_INSTRUMENTED_SHA256=$sha"
          $release=Join-Path $env:GITHUB_WORKSPACE 'stone-dosboxx-build'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $release 'dosbox-x.exe')
          Set-Content -LiteralPath (Join-Path $release 'sha256.txt') -Value ($sha + "  dosbox-x.exe") -Encoding ASCII
          Write-Host 'Original Stone DOS guest executed: NO'
      - name: Upload instrumented DOSBox-X executable (no game media)
        uses: actions/upload-artifact@v4
        with:
          name: stone-original-dosboxx-normal-core
          path: stone-dosboxx-build/
          if-no-files-found: error
