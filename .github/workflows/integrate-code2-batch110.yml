name: Integrate CODE.2 Batch 110
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch110.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 110
        run: |
          git merge-base --is-ancestor 0df6ee5aec0d29d11e24904de6c0c8512cc7f9da HEAD
          test "$(git hash-object Code2/.batch110.fragment.cpp)" = "441a2c451e561f6acd849c21c167ea528aea80dd"
          test "$(git hash-object Code2/.batch110_integrate.py)" = "3cf2367e6e72396496a67f69510ed2cc785d50cd"
          grep -F 'static_assert(0x35286u-0x34DE8u==1182u);' Code2/.batch110.fragment.cpp
      - name: Integrate Batch 110
        run: python Code2/.batch110_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch110_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime110Boundary','call_1e8c8','call_35798','function_34de8','app110_fixed16','app110_add20_word','if(record==0u){active=false;continue;}','if(*dg(m,record)==3u && (flags&0x08u)==0u)continue;','function_34bb0(m,quad,raster,coords,indices,record)','app110_copy(m,A,B,0x80u)','app110_copy(m,AF,BF,0x20u)']:
              assert x in c,x
          assert '224,674 / 239,698 = 93.7321% (93.73%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 110
        run: |
          cp Code2/.batch110_integrate.py /tmp/batch110_integrate.py
          rm -f Code2/.batch110.fragment.cpp Code2/.batch110_integrate.py .github/workflows/integrate-code2-batch110.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 110"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch110_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`35286`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 110"
          git push origin HEAD:code1-decompilation
