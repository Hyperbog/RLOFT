name: Integrate CODE.2 batch 20
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch20.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 20
        run: python3 Code2/integrate_batch20.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 68666u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1358u;' in cpp
          assert 'static_assert(0x0EA82u-0x0E5F0u==1170u);' in cpp
          assert 'static_assert(0x0F66Cu-0x0F5F8u==116u);' in cpp
          assert 'case 0x85u: amount=b.call_1c328?b.call_1c328(1u,4u,4u,2u):0u;' in cpp
          assert '0x01000010u' in cpp
          assert 'for(u32 off=0u;off<=0x40u;off+=4u)' in cpp
          assert 'return static_cast<u16>(total);' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,z,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); z=int(z,16); n=int(n)
              assert z-a+1==n,(line,z-a+1,n)
              total+=n
          assert total==1358,total
          assert 68666+total==70024
          assert 239698-70024==169674
          assert '**70,024 / 239,698 = 29.2134% (29.21%)**' in prog
          print('CODE.2 batch 20 accounting verified: 68666 + 1358 = 70024')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch20.zb64 Code2/integrate_batch20.py .github/workflows/integrate-code2-batch20.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 20'
          git push origin code1-decompilation
# retry after exact staging payload repair
