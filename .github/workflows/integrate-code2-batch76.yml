name: Integrate CODE.2 Batch 76
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch76.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 76
        run: |
          test "$(git hash-object Code2/.batch76.fragment.cpp)" = "c6e20bd16667e2b354df2296795b990f8dae3f63"
          test "$(git hash-object Code2/.batch76_integrate.py)" = "e3053acccd9ce8d6b5fd441d6bf8357bd7d82dca"
          grep -F 'static_assert(0x31EDCu-0x31E74u==104u);' Code2/.batch76.fragment.cpp
          grep -F 'static_assert(0x31F91u-0x31F38u==89u);' Code2/.batch76.fragment.cpp
      - name: Integrate Batch 76
        run: python Code2/.batch76_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch76_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text(); l=Path('Code2/RESIDUAL_LEDGER.md').read_text(); p=Path('Code2/PROGRESS.md').read_text()
          for a in ['function_31e74','function_31edc','function_31f38','0x21A12u+off','function_31a14(m,static_cast<s32>(load_le32(dg(m,0xF920u))),fade)']: assert a in c,a
          assert '31F35..31F37 | alignment | 3' in l and '31F91..31F93 | alignment | 3' in l
          assert '211,632 / 239,698 = 88.2911% (88.29%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 76
        run: |
          cp Code2/.batch76_integrate.py /tmp/batch76_integrate.py
          rm -f Code2/.batch76.fragment.cpp Code2/.batch76_integrate.py .github/workflows/integrate-code2-batch76.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 76"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch76_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`31F94`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 76"
          git push origin HEAD:code1-decompilation
