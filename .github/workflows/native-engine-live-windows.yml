name: Native Engine LIVE Original Game - Windows x64 (manual)

# Manual Windows owner-authorized builds ONLY; never on push, PR, schedule.
# Compile original-source-shared runtime, retain DemoV1 source contracts,
# test sandboxed native CHARS, and package only native executable metadata.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-engine-live-game-windows
  cancel-in-progress: false

jobs:
  windows-live-native-game:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out original-game native-engine source
        uses: actions/checkout@v4
        with:
          ref: native-engine
          persist-credentials: false
      - name: Install Python for native CTest fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 176-source native original game and run all Windows tests
        shell: pwsh
        run: |
          & ./NativeEngine/Windows/Build-LiveNativeGame-Windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload field-test live native-game preview, provenance and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RLOFT-NativeEngine-Windows-x64-LIVE-PREVIEW
          path: |
            NativeEngine/Windows/dist/RLOFT-NativeEngine-Windows-x64-LIVE-PREVIEW.zip
            NativeEngine/Windows/dist/RLOFT-NativeEngine-Windows-x64-LIVE-PREVIEW.zip.sha256
          if-no-files-found: error
          retention-days: 30
