name: Integrate CODE.2 Batch 97
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch97.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 97
        run: |
          git merge-base --is-ancestor 93aaa0cd423c92c68cf78a9a1e05be3a2fdf8028 HEAD
          test "$(git hash-object Code2/.batch97.fragment.cpp)" = "611bd914d25c882a32dea61a4d3a5daf4cf64e13"
          test "$(git hash-object Code2/.batch97_integrate.py)" = "82dbf4ecd443e6ff9ad63228d60249dc0a3c5882"
          grep -F 'static_assert(0x33A7Cu-0x33A38u==68u);' Code2/.batch97.fragment.cpp
      - name: Integrate Batch 97
        run: python Code2/.batch97_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch97_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime97Boundary','function_33a38','function_33a5a','make_directory','change_directory','record_dos_error','0xFFFFFFFFu']:
              assert x in c,x
          assert '218,520 / 239,698 = 91.1647% (91.16%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 97
        run: |
          cp Code2/.batch97_integrate.py /tmp/batch97_integrate.py
          rm -f Code2/.batch97.fragment.cpp Code2/.batch97_integrate.py .github/workflows/integrate-code2-batch97.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 97"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch97_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`33A7C`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 97"
          git push origin HEAD:code1-decompilation
