name: Canonical reconstructed CODE.1 + CODE.2 source link gate

on:
  push:
    branches: [Recomp]
    paths:
      - '.github/workflows/recomp-source-link-gate.yml'
      - 'Recomp/**'
      - 'Code2/graphics/**'
      - 'Code1/Code1.cpp'
      - 'Code2/Code2.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-recomp-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code1-code2-reconstruction:
    name: Compile, link, and execute canonical reconstructed source
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure source-build target (not native engine)
        shell: pwsh
        run: cmake -S Recomp -B build/recomp -A x64
      - name: Compile and link both complete reconstruction files
        shell: pwsh
        run: cmake --build build/recomp --config Debug --parallel 2
      - name: Audit CMake source inventory and compiled code fragments
        shell: pwsh
        run: |
          python -m unittest discover -s Recomp/tools -p test_audit_recomp_source_layout.py -v
          if ($LASTEXITCODE -ne 0) { throw "Recomp source inventory unit tests failed" }
          python Recomp/tools/audit_recomp_source_layout.py --root .
          if ($LASTEXITCODE -ne 0) { throw "Recomp source inventory audit failed" }
      - name: Execute compiled reconstruction leaf and entry-boundary tests
        shell: pwsh
        run: ctest --test-dir build/recomp -C Debug --output-on-failure
      - name: Verify strict private DOS indexed comparison and synchronization (synthetic only)
        shell: pwsh
        run: |
          python -m unittest discover -s Recomp/tools -p test_compare_dos_indexed_frames.py -v
          if ($LASTEXITCODE -ne 0) { throw "Indexed-frame comparison tests failed" }
          python -m unittest discover -s Recomp/tools -p test_verify_synchronized_dos_frame_pair.py -v
          if ($LASTEXITCODE -ne 0) { throw "Independent DOS-frame synchronization tests failed" }
          python -m unittest discover -s Recomp/tools -p test_create_original_dos_debugger_observation.py -v
          if ($LASTEXITCODE -ne 0) { throw "Original DOS debugger observation-provenance tests failed" }
      - name: Report recompilation progress from certified major acceptance gates
        if: success()
        shell: pwsh
        run: |
          python Recomp/tools/recomp_progress.py | Tee-Object -FilePath build/recomp/Debug/recomp-progress.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stamp exact canonical source and engineering status
        if: success()
        shell: pwsh
        run: |
          Set-Content -Path build/recomp/Debug/build-source-sha.txt -Value "${{ github.sha }}"
          @(
            'Ravenloft: Strahds Possession - canonical DOS source recompilation'
            'This is an original CODE.1/CODE.2 engineering test build, NOT a playable game.'
            'The source executables link and execute the reconstructed original code.'
            'Run rloft_code1_startup_gate.exe --dos6-to-ff00 to test real reconstructed CODE.1 CC1C -> CD17 -> CD50 DOS startup, with explicit test-only DOS version response.'
            'Run rloft_code2_startup_gate.exe --to-mouse-reset to test actual CODE.2 startup through original DOS mouse reset, using test-only DOS environment/file fixtures.'
            'Run rloft_code2_startup_gate.exe --to-mouse-reset-no-args for the source-backed allocator branch.'
            'Run rloft_original_image_gate.exe CODE.1 CODE.2 to verify personally owned original files.'
            'Latest bounded source paths stop at external DOS INT 31h function 0300h real-mode mouse simulation, or INT 21h AH=09h text output. Actual DOS/4GW services and independent runtime parity remain incomplete.'
            'Private Creative Voice test: rloft_host_original_voc_waveout.exe --voc OWN_EXTRACTED_SAMPLE.voc [--play]; --play sends PCM8 to the real Windows OS device and checks WinMM completion.'
            'This is NOT Miles AIL/32 device completion, an original DOS screenshot, or native playable Ravenloft.'
            'No commercial original game media are included in this artifact.'
          ) | Set-Content -Path build/recomp/Debug/README-RECOMP.txt
      - name: Publish all three canonical source executables and source SHA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RLOFT-Canonical-Recomp-Windows-${{ github.run_number }}
          path: |
            build/recomp/Debug/rloft_recomp_link_gate.exe
            build/recomp/Debug/rloft_code1_startup_gate.exe
            build/recomp/Debug/rloft_code2_startup_gate.exe
            build/recomp/Debug/rloft_original_image_gate.exe
            build/recomp/Debug/rloft_original_vga_host_tests.exe
            build/recomp/Debug/rloft_host_original_voc_waveout.exe
            build/recomp/Debug/rloft_original_voc_pcm8_tests.exe
            build/recomp/Debug/build-source-sha.txt
            build/recomp/Debug/recomp-progress.txt
            build/recomp/Debug/README-RECOMP.txt
          if-no-files-found: error
          retention-days: 7
