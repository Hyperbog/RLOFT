name: Integrate CODE.1 runtime batch
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-runtime-next.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - run: python3 Code1/integrate_runtime_next.py
      - run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - run: rm Code1/RuntimeNext.staging.cpp Code1/integrate_runtime_next.py .github/workflows/integrate-runtime-next.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Integrate verified CODE.1 runtime batch
          branch: code1-decompilation
