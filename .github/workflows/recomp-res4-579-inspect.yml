name: Inspect preserved original RES4 material 579
on:
  push:
    branches: [Recomp]
    paths:
      - '.github/workflows/recomp-res4-579-inspect.yml'
permissions:
  contents: read
jobs:
  original-archive-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: original-media
          sparse-checkout: |
            MASTER/Ravenloft - Strahd's Possession/RLOFT/RES4
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: Recomp
          path: source
          sparse-checkout: |
            Code2/Code2.cpp
            Code2/graphics/original_res_type6.hpp
            Code2/graphics/original_res_image_archive.hpp
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Inspect compiled original resource-loader source callback chain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path("source/Code2/Code2.cpp").read_text(encoding="utf-8")
          for symbol in ("function_2eb60","function_2f2a0","function_2ecb4",
                         "function_2f960","function_2f96c","function_37590",
                         "function_37b42"):
              candidates=list(re.finditer(r"\b"+symbol+r"\s*\(",src))
              print("ORIGINAL_LOADER_SYMBOL",symbol,"references",len(candidates))
              for match in candidates:
                  head=src[max(0,match.start()-100):match.start()]
                  if not re.search(r"(?:void|u32|s32|s16)\s+$",head):continue
                  brace=src.find("{",match.end())
                  if brace<0 or ";" in src[match.end():brace]:continue
                  end=brace+1
                  depth=1
                  while depth and end<len(src):
                      if src[end]=="{":depth+=1
                      elif src[end]=="}":depth-=1
                      end+=1
                  print("ORIGINAL_LOADER_BEGIN",symbol)
                  print(src[max(0,match.start()-100):min(end,match.start()+22000)])
                  print("ORIGINAL_LOADER_END",symbol)
                  break
          PY
      - name: Independently decompress authentic RES4 type-6 item 579
        shell: bash
        run: |
          cat > /tmp/check_original_res4_579.cpp <<'CPP'
          #include "Code2/graphics/original_res_type6.hpp"
          #include <cstdint>
          #include <iostream>
          int main(int argc,char**argv) {
              if(argc!=2)return 2;
              const auto archive=rloft::original_res::read_only(argv[1]);
              for(const unsigned id:{220u,221u,223u,578u,579u,580u}) {
                  auto tex=rloft::original_res::decode_type6(archive,id);
                  std::uint64_t checksum=14695981039346656037ull;
                  for(const auto byte:tex.column_major) {
                      checksum^=byte;checksum*=1099511628211ull;
                  }
                  std::cout<<"INDEPENDENT_ORIGINAL_RES4_TYPE6_PASS item="<<id
                           <<" decoded="<<tex.decoded_bytes
                           <<" columns="<<tex.columns
                           <<" fnv64="<<checksum<<"\n";
              }
          }
          CPP
          c++ -std=c++17 -O2 -I source /tmp/check_original_res4_579.cpp -o /tmp/check_original_res4_579
          /tmp/check_original_res4_579 "original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT/RES4"
      - name: Inspect original RES4 directory, types and neighboring records
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path("original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT/RES4")
          s=p.read_bytes()
          n=struct.unpack_from("<I",s)[0]
          print("ORIGINAL_RES4_RESOURCE_DIR", "bytes",len(s),"count",n)
          assert n>580 and len(s)>4+n*4
          offsets=struct.unpack_from(f"<{n}I",s,4)
          for i in (220,221,223,578,579,580):
              a=offsets[i]
              b=offsets[i+1] if i+1<n else len(s)
              assert a<=b<=len(s)
              data=s[a:min(b,a+20)]
              print("ORIGINAL_RES4_RECORD",i,"begin",a,"end",b,
                    "encoded_bytes",b-a,
                    "magic",bytes(data[:2]).hex(),
                    "type",data[2] if len(data)>2 else None,
                    "header_u16",struct.unpack_from("<H",data,3)[0] if len(data)>=5 else None,
                    "decoded_bytes_field",struct.unpack_from("<H",data,5)[0] if len(data)>=7 else None,
                    "header_first12",bytes(data[:12]).hex())
          PY
