name: Integrate CODE.2 batch 29

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch29.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 29
        run: python Code2/.integrate_batch29.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 97832u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1916u;' in code
          assert '**97,832**' in progress and '**1,916**' in progress and '**99,748 / 239,698 = 41.6140% (41.61%)**' in progress
          assert 'void function_16400(Machine& m,Application29Boundary& b) noexcept;' in code
          assert 'while(function_15534(m,*b.app28)==0u){}' in code
          assert 'const u32 bytes=static_cast<u32>(count-index+1)*0x16u;' in code
          assert 'b.app28->app27->call_1c160(0x4Eu,mode); // live EBX supplies the second argument.' in code
          assert 'if(count==0u)return; // The encoded zero-count path does not close the handle.' in code
          assert 'const u32 count=load_le32(dg(m,0x258E0u)); // high word is intentionally whatever was already present.' in code
          assert 'if(b.call_312ec_local)b.call_312ec_local(alias,2u,handle);' in code
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,b,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert b-a+1==n,(line,b-a+1)
              total+=n
          assert total==1916,total
          assert 97832+1916==99748
          assert 239698-99748==139950
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch29_fragment.cpp Code2/.integrate_batch29.py .github/workflows/integrate-code2-batch29.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 29"
          git push origin HEAD:code1-decompilation
