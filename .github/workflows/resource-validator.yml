name: Resource validator self-test

on:
  push:
    paths:
      - "Resources/**"
      - ".github/workflows/resource-validator.yml"
  pull_request:
    paths:
      - "Resources/**"
      - ".github/workflows/resource-validator.yml"

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run resource validator self-tests
        run: python Resources/verify_resources.py --self-test
