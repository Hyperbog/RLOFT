            'Original 1F494/1EA90 four-character HUD now executes with source RES1 masked 298F0 -> 2A584 portraits, hands, original HP bars, and status borders.'
            'The private exact two-skeleton camera is not a CI artifact; original DOS palette/CRTC and per-pixel parity remain unverified.'
            'Rare original status text and alternate group-list HUD require additional source callbacks; failures are intentionally fail-closed.'
            'The VGA adapter tests and the CODE.2 graphics frame use synthetic inputs; they are not a captured scene from the real game.'
            'code2-compiled-frame.idx is 320x400 raw palette indices; code2-compiled-frame.bmp is a palettized Windows BMP.'
            "Milestone probe: $env:MILESTONE"
            "Source commit: ${{ steps.source.outputs.sha }}"
            'Owner-media startup probe: rloft_code1_code2_staged_boot.exe --root C:\RLOFT --cd-root D:\RLOFT (CD-root requires extracted RES9/RES10; this executable does not mount game.gog).'
            'The boot probe runs original CODE.1 constructors then CODE.2 INIT, INFO, 11 RES archives, source-derived 325B0 COLORS file reader, compiled 32150 brightness, and compiled 29CA0 DAC writer.'
            'The inter-module handoff is HOST_ORDERED_NOT_DOS_GUEST: no playable boot, original DOS caller ancestry, or guest-contiguous CODE.1->CODE.2 state transfer is proven.'
            'Run from a Windows terminal. See milestone-report.json for accepted-vs-tested.'
          ) | Set-Content -Encoding utf8 (Join-Path $dir README.txt)
          $checksums = Get-ChildItem $dir -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $checksums | Set-Content -Encoding ascii (Join-Path $dir SHA256SUMS.txt)
          Compress-Archive -Path "$dir/*" -DestinationPath "build/windows-milestone/RLOFT-Recomp-Milestone-Windows-x64.zip" -CompressionLevel Optimal
      - name: Upload Windows milestone engineering ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RLOFT-Recomp-Windows-Milestone-${{ github.run_number }}
          path: build/windows-milestone/RLOFT-Recomp-Milestone-Windows-x64.zip
          if-no-files-found: error
          retention-days: 60
      - name: Upload test evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RLOFT-Recomp-Windows-Evidence-${{ github.run_number }}
          path: |
            build/windows-milestone/milestone-report.json
            build/windows-milestone/recomp-progress.json
            build/windows-milestone/ctest-results.xml
            build/windows-milestone/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 60
