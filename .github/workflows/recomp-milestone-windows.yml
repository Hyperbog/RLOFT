      - name: Probe authentic original 1FC14 29804 clipping in retained Level22 guest
        shell: pwsh
        timeout-minutes: 2
        run: |
          # Independent experimental invocation. The default green one-frame
          # test above must not activate the unaccepted 1A510 cursor path.
          $media = "original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT"
          $cdMedia = "original-media/MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT"
          $cmd = [System.Diagnostics.ProcessStartInfo]::new()
          $cmd.FileName = (Resolve-Path "build/windows-milestone/Debug/rloft_code1_code2_staged_boot.exe").Path
          $cmd.UseShellExecute = $false
          $cmd.RedirectStandardOutput = $true
          $cmd.RedirectStandardError = $true
          [void]$cmd.ArgumentList.Add("--root")
          [void]$cmd.ArgumentList.Add((Resolve-Path $media).Path)
          [void]$cmd.ArgumentList.Add("--cd-root")
          [void]$cmd.ArgumentList.Add((Resolve-Path $cdMedia).Path)
          [void]$cmd.ArgumentList.Add("--advance-original-16d04")
          $cmd.Environment["RLOFT_RECOMP_EXPERIMENTAL_HUD"] = "1"
          $cmd.Environment["RLOFT_RECOMP_EXPERIMENTAL_EXTERIOR"] = "1"
          $cmd.Environment["RLOFT_RECOMP_EXPERIMENTAL_FRAME_ENTRY"] = "1"
          $cmd.Environment["RLOFT_RECOMP_EXPERIMENTAL_FULL_COMPOSITOR"] = "1"
          $cmd.Environment["RLOFT_RECOMP_EXPERIMENTAL_POLYGON_FRONTIER"] = "1"
          $cmd.Environment["RLOFT_RECOMP_EXPERIMENTAL_POLYGON_SOURCE"] = "1"
          $cmd.Environment["RLOFT_RECOMP_EXPERIMENTAL_1FC14_PAGE_HANDOFF"] = "1"
          $proc = [System.Diagnostics.Process]::new()
          $proc.StartInfo = $cmd
          if (-not $proc.Start()) { throw "Cannot start retained 1FC14 source clip probe" }
          $out = $proc.StandardOutput.ReadToEndAsync()
          $err = $proc.StandardError.ReadToEndAsync()
          $exited = $proc.WaitForExit(45000)
          if (-not $exited) {
            $proc.Kill($true)
            $proc.WaitForExit()
          }
          $combined = @($out.GetAwaiter().GetResult(), $err.GetAwaiter().GetResult()) -join "`n"
          $exit = $proc.ExitCode
          $proc.Dispose()
          $clip = [regex]::Match($combined, 'CODE2_ORIGINAL_LIVE_GAMEPLAY=1FC14_29804_SOURCE_CLIP original_return=([012]) draw_calls=([0-9]+) clipped_calls=([0-9]+) clip_depth_before=([0-9]+) clip_depth_after=([0-9]+) clip_record=([0-9]+) bounds=([0-9]+),([0-9]+),([0-9]+),([0-9]+) cropped=([0-9]+),([0-9]+).*invalid_access=([01]) unsupported_vga_read=([01])')
          foreach ($line in ($combined -split "`r?`n")) {
            if ($line -match '1FC14_29804_SOURCE_CLIP|1FC14_29804_CURSOR_ABI_FAILURE|1FC14_1A510_SOURCE_PAGE_HANDOFF|RLOFT_CODE1_CODE2_STAGED_BOOT_FAIL') {
              Write-Host "ORIGINAL_1FC14_EXPERIMENTAL: $line"
            }
          }
          if (-not $exited) { throw "Retained original 29804 clip probe timed out" }
          if (-not $clip.Success) { throw "Authentic 29804 clip return, dimensions and VGA status were not captured" }
          if ($clip.Groups[4].Value -ne $clip.Groups[5].Value) {
            throw "Original 29804 clip-stack depth was not restored"
          }
          $sourceStop = $combined -match 'LIVE_CODE2_SOURCE_STOP=ORIGINAL_1A5B0_29804_MOUSE_SPRITE_UNSUPPORTED'
          $handoff = $combined -match 'CODE2_ORIGINAL_LIVE_GAMEPLAY=1FC14_1A510_SOURCE_PAGE_HANDOFF'
          if (-not $sourceStop -and -not $handoff) {
            throw "Original 29804 unexpected diagnostic completion / stop"
          }
          $drawn = [regex]::Matches($combined, 'CODE2_ORIGINAL_LIVE_GAMEPLAY=1FC14_29804_SOURCE_CLIP original_return=2 draw_calls=1 clipped_calls=0 .*invalid_access=0 unsupported_vga_read=0')
          $culled = [regex]::Matches($combined, 'CODE2_ORIGINAL_LIVE_GAMEPLAY=1FC14_29804_SOURCE_CLIP original_return=0 draw_calls=0 clipped_calls=0 .*cropped=4294967228,16 .*invalid_access=0 unsupported_vga_read=0')
          $pageFlips = [regex]::Matches($combined, 'CODE2_ORIGINAL_LIVE_GAMEPLAY=1FC14_1A510_SOURCE_PAGE_HANDOFF page=([01]) crtc_start=([0-9]+) calls=([0-9]+) world_scene_draw=NOT_CONNECTED source_guest=PRESERVED')
          if ($drawn.Count -lt 1 -or $culled.Count -lt 1 -or $pageFlips.Count -lt 4) {
            throw "Authentic 1FC14 29804 drawn/culled outcomes and four 1A510 VGA page handoffs are required"
          }
          for ($i = 0; $i -lt 4; ++$i) {
            $expectedPage = if (($i % 2) -eq 0) { 1 } else { 0 }
            $page = [int]$pageFlips[$i].Groups[1].Value
            $start = [int]$pageFlips[$i].Groups[2].Value
            $ordinal = [int]$pageFlips[$i].Groups[3].Value
            if ($page -ne $expectedPage -or $start -ne ($page * 32768) -or $ordinal -ne ($i + 1)) {
              throw "Original 1A510 page and physical CRTC sequence diverged at handoff $($i + 1)"
            }
          }
          Write-Host "ORIGINAL_1FC14_29804_CLIP_AND_PAGE_HANDOFF_PASS authentic_full_draws=$($drawn.Count) authentic_full_culls=$($culled.Count) retained_crtc_page_handoffs=$($pageFlips.Count) same_guest=YES consecutive_scene_frames=NOT_YET_CONNECTED"
