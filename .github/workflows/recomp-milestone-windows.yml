              if (-not (Test-Path $idx) -or -not (Test-Path $pal) -or -not (Test-Path $jsonPath)) {
                throw "Private VGA source capture missing at original tick $i"
              }
              if ((Get-Item $idx).Length -ne 128000 -or (Get-Item $pal).Length -ne 768) {
                throw "Original-source VGA/DAC private bytes differ from 320x400 RGB6 format"
              }
              $receipt = Get-Content -Raw $jsonPath | ConvertFrom-Json
              if ($receipt.schema -ne 'rloft-vga-observation-v1' -or
                  $receipt.role -ne 'compiled_recomp' -or
                  $receipt.frame_boundary -ne '1FC14_1A510' -or
                  $receipt.level -ne 22 -or
                  $receipt.source_tick -ne $i -or
                  $receipt.original_dos_executed -ne $false -or
                  $receipt.indices_sha256 -ne (Get-FileHash $idx -Algorithm SHA256).Hash.ToLowerInvariant() -or
                  $receipt.rgb6_sha256 -ne (Get-FileHash $pal -Algorithm SHA256).Hash.ToLowerInvariant()) {
                throw "Private VGA source receipt/hash mismatch at scene tick $i"
              }
            }
            Write-Host "ORIGINAL_1FC14_PRIVATE_SOURCE_FRAMES_PASS captured=5 indexed_bytes_each=128000 rgb6_bytes_each=768 export=HASH_ONLY_TO_LOG media_artifacts=EXCLUDED independent_dos_parity=OPEN"
          }
          finally {
            if (Test-Path $privateFrames) {
              Remove-Item $privateFrames -Recurse -Force
            }
          }
