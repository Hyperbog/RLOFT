name: Integrate CODE.2 Batch 117
on:
  push:
    paths:
      - 'Code2/integrate_batch117.py'
      - 'Code2/batch117_fragment.cpp'
      - '.github/workflows/integrate-code2-batch117.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Integrate verified batch
        run: python Code2/integrate_batch117.py
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Remove temporary integration files
        run: rm Code2/integrate_batch117.py Code2/batch117_fragment.cpp .github/workflows/integrate-code2-batch117.yml
      - name: Commit integrated batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 117'
          git push origin HEAD:code1-decompilation
