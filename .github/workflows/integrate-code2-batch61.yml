name: Integrate CODE.2 batch 61
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch61.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch61.zb64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == '4ecf7d6dd500d0e3297dae7087361c905ff082bc1694c7d9a44e4f5140b0e6be'
          t=raw.decode(); assert 'function_2a6b0' in t and 'function_2ac10' in t and '==1453u);' in t
          print('batch61 payload OK',len(raw))
          PY
      - name: Apply Batch 61
        run: python Code2/integrate_batch61.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text(); l=Path('Code2/RESIDUAL_LEDGER.md').read_text(); p=Path('Code2/PROGRESS.md').read_text(); a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 178417u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 3755u;' in c
          assert '+ 1427u + 1453u);' in c
          assert 'static_assert(0x2A89Fu-0x2A6B0u==495u);' in c
          assert 'static_assert(0x2AA9Bu-0x2A8A0u==507u);' in c
          assert 'static_assert(0x2AC68u-0x2AC10u==88u);' in c
          assert '==1453u);' in c
          assert '*dg(m,0x2A816u)=transparent;' in c and '*dg(m,0x2AA12u)=static_cast<u8>(delta);' in c
          assert '2AC68..2AC6F | padding | 8' in l and '2AC70..2AC7F | table | 16' in l
          assert '**182,172 / 239,698 = 76.0006% (76.00%)**' in p
          assert '**57,526**' in p and 'frontier is now `2AC80`' in p
          assert '## CODE.2 Batch 61 checkpoint' in a
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line); assert m,line
              x,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3)); assert z-x+1==n,(line,z-x+1); total+=n
          assert total==3755,total
          print('batch61 accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary staging files
        run: |
          rm -f Code2/batch61.zb64 Code2/integrate_batch61.py .github/workflows/integrate-code2-batch61.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name); p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit Batch 61
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 61'
          git push origin HEAD:code1-decompilation
