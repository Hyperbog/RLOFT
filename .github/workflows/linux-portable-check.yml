name: RLOFT portable Linux workstream regression
on:
  push:
    branches: [DosDis, Ravenloft-Asset-Extractor, native-engine, demo-v1]
    paths:
      - 'dev/**'
      - 'Tools/Disassembler/src/**'
      - 'Tools/Disassembler/tests/**'
      - 'Tools/anm/**'
      - 'NativeEngine/**'
      - 'Shared/**'
      - 'DemoV1/tools/**'
      - '.github/workflows/linux-portable-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rloft-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-source:
    name: Linux source, portable C++/.NET/Python test gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: github.ref_name == 'DosDis'
        with:
          dotnet-version: '10.0.x'
      - name: Install portable native C++ tools
        if: github.ref_name == 'native-engine'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ python3
      - name: Provision Python extractor dependencies
        if: github.ref_name == 'Ravenloft-Asset-Extractor'
        run: bash dev/linux.sh setup
      - name: Execute branch-owned portable Linux regression tests
        run: bash dev/linux.sh test
      - name: Preserve native CTest failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RLOFT-Portable-Linux-Diagnostics-${{ github.run_number }}
          path: |
            build/linux/native-engine/Testing/Temporary/LastTest.log
            build/linux/native-engine/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
