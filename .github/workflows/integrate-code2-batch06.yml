name: Integrate CODE.2 batch 06
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch06.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 06
        run: python3 .github/code2_batch06.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 24697u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 190u;' in cpp
          for n in ['function_03634','function_03810','function_03820','function_03838','function_03a78','function_03c04','function_03de4','function_03ea4','function_03f78','function_04040','function_04100','function_04228','function_043f4','function_044d0']:
              assert n in cpp,n
          assert 'for(u32 i=0;i<0x100u;++i)*dg(m,0x759Cu+i)=static_cast<u8>(i);' in cpp
          assert 'b.call_2c8e4(y,x,0xFFFFFFFFu)' in cpp
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S);assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16);b=int(b,16);n=int(n);assert b-a+1==n;total+=n
          assert total==190,total
          assert 24697+190+214811==239698
          assert (0x380d-0x3634)+(0x381f-0x3810)+(0x3836-0x3820)+(0x3a64-0x3838)+(0x3c03-0x3a78)+(0x3de3-0x3c04)+(0x3ea4-0x3de4)+(0x3f75-0x3ea4)+(0x4040-0x3f78)+(0x40ff-0x4040)+(0x4225-0x4100)+(0x43f1-0x4228)+(0x44cf-0x43f4)+(0x461a-0x44d0)==4031
          print('CODE.2 batch 06 accounting verified: 24697 + 190 + 214811 = 239698')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Commit integrated batch
        run: |
          rm -f .github/code2_batch06.py Code2/batch06_part1.inc Code2/batch06_part2.inc .github/workflows/integrate-code2-batch06.yml
          git config user.name "Hyperbog"
          git config user.email "47282882+Hyperbog@users.noreply.github.com"
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 06"
          git push origin HEAD:code1-decompilation
# retry: boundary ownership fixed
