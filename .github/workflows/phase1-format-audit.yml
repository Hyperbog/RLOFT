name: Phase 1 - three-title format compatibility survey

on:
  push:
    branches: [main]
    paths:
      - 'Tools/phase1_compare.py'
      - 'Tools/phase1_code2_consumers.py'
      - 'Tools/phase1_resource_event_vm.py'
      - 'Tools/phase1_decoder_dispatch.py'
      - 'Tools/phase1_type56_verify.py'
      - 'Tools/phase1_res9_opcode_probe.py'
      - '.github/workflows/phase1-format-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey-original-formats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research driver
        uses: actions/checkout@v4

      - name: Read-only checkout of preserved original files
        uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: preservation
          sparse-checkout: |
            MASTER/Menzoberranzan
            MASTER/Ravenloft - Stone Prophet
            MASTER/Ravenloft - Strahd's Possession
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Analyze RES and core-file structural compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python Tools/phase1_compare.py \
            --root preservation/MASTER \
            --json audit/phase1-formats.json \
            --markdown audit/PHASE1_FORMATS.md
          printf '\nSurvey revision: %s\n' "$(git rev-parse HEAD)" >> audit/PHASE1_FORMATS.md
          printf 'Preservation revision: %s\n' "$(git -C preservation rev-parse HEAD)" >> audit/PHASE1_FORMATS.md
          cat audit/PHASE1_FORMATS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Trace original CODE.2 format consumers (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_code2_consumers.py \
            --root preservation/MASTER \
            --json audit/phase1-code2-consumers.json
          python -m py_compile Tools/phase1_compare.py Tools/phase1_code2_consumers.py

      - name: Compare level event slots and RES9 interaction wordcode
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_resource_event_vm.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-resource-event-vm.json
          python -m py_compile Tools/phase1_resource_event_vm.py

      - name: Locate CODE.2 decoder and event-VM dispatch candidates
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_decoder_dispatch.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-decoder-dispatch.json
          python -m py_compile Tools/phase1_decoder_dispatch.py

      - name: Decode RES type 5 and 6 via unchanged Strahd LZSS reader
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_type56_verify.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-type56-lzss.json
          python -m py_compile Tools/phase1_type56_verify.py

      - name: Find RES9 wordcode opcode dispatchers in original CODE.2
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_res9_opcode_probe.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-res9-opcode-leads.json
          python -m py_compile Tools/phase1_res9_opcode_probe.py

      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-original-format-survey
          path: audit/
          retention-days: 30
          if-no-files-found: error
