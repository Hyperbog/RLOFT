name: Fix CODE.2 progress header
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/fix-code2-progress.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Correct PROGRESS.md summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Code2/PROGRESS.md')
          s=p.read_text()
          old='''![Progress](https://img.shields.io/badge/object%20accounting-97.96%25-red)
          ![Semantic audit](https://img.shields.io/badge/semantic%20audit-not%20started-lightgrey)

          **Executable object-1 denominator:** **239,698 bytes (`0x3A852`)**
          **Verified translated instruction bytes:** **231,371**
          **Proven non-code/data bytes:** **4,672**
          **Reconciled object bytes:** **236,043 / 239,698 = 98.4752% (98.48%)**
          **Unresolved object bytes:** **3,655**
          **Status color:** RED until the entire executable object is instruction-accounted or directly proven non-code/data.'''.replace('          ','')
          new='''![Progress](https://img.shields.io/badge/object%20accounting-100.00%25-brightgreen)
          ![Semantic audit](https://img.shields.io/badge/semantic%20audit-not%20started-lightgrey)

          **Executable object-1 denominator:** **239,698 bytes (`0x3A852`)**
          **Verified translated instruction bytes:** **235,022**
          **Proven non-code/data bytes:** **4,676**
          **Reconciled object bytes:** **239,698 / 239,698 = 100.0000% (100.00%)**
          **Unresolved object bytes:** **0**
          **Status color:** GREEN — complete object-1 byte accounting. Semantic audit remains a separate follow-up phase.'''.replace('          ','')
          if old not in s: raise SystemExit('stale progress header sentinel not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          grep -F 'object%20accounting-100.00%25-brightgreen' Code2/PROGRESS.md
          grep -F '**Unresolved object bytes:** **0**' Code2/PROGRESS.md
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Code2/PROGRESS.md
          git commit -m 'Fix CODE.2 progress summary after final reconciliation'
          git push
