name: Integrate CODE.2 Batch 77
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch77.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 77
        run: |
          test "$(git hash-object Code2/.batch77.fragment.cpp)" = "4de7ee11aa7f2322a939878df4edeed5ad860183"
          test "$(git hash-object Code2/.batch77_integrate.py)" = "9e8b6eadab5fff1f3b396c7fab126720dd9f671a"
          grep -F 'static_assert(0x320F8u-0x31F94u==356u);' Code2/.batch77.fragment.cpp
      - name: Integrate Batch 77
        run: python Code2/.batch77_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch77_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text(); p=Path('Code2/PROGRESS.md').read_text()
          for a in ['function_31f94','phase%0x18u','view!=0xFFu','function_30cc4(m,function_30700(m))','0xF99Au+static_cast<u32>(phase)*2u','0xF96Au+static_cast<u32>(phase)*2u']: assert a in c,a
          assert '211,988 / 239,698 = 88.4396% (88.44%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 77
        run: |
          cp Code2/.batch77_integrate.py /tmp/batch77_integrate.py
          rm -f Code2/.batch77.fragment.cpp Code2/.batch77_integrate.py .github/workflows/integrate-code2-batch77.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 77"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch77_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`320F8`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 77"
          git push origin HEAD:code1-decompilation
