name: Integrate CODE.2 Batch 103
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch103.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 103
        run: |
          git merge-base --is-ancestor a9c5cabe421a5ba94044fcbd4361f30f7a052af3 HEAD
          test "$(git hash-object Code2/.batch103.fragment.cpp)" = "fb0008924cde5864a4ff6537810aa77ac857c6b7"
          test "$(git hash-object Code2/.batch103_integrate.py)" = "42982a61e7e1a906889ba235b2f6f85dfae7c562"
          grep -F 'static_assert(0x33FB2u-0x33E6Cu==326u);' Code2/.batch103.fragment.cpp
      - name: Integrate Batch 103
        run: python Code2/.batch103_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch103_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime103Boundary','function_33e6c','rep_movsd_ds_es','call_3402c','call_34110','call_33fb4','0x80000001u','0xFD28u','0xFDC4u','0xFDE8u']:
              assert x in c,x
          assert '33FB2..33FB3 | alignment | 2' in l
          assert '219,856 / 239,698 = 91.7221% (91.72%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 103
        run: |
          cp Code2/.batch103_integrate.py /tmp/batch103_integrate.py
          rm -f Code2/.batch103.fragment.cpp Code2/.batch103_integrate.py .github/workflows/integrate-code2-batch103.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 103"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch103_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`33FB4`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 103"
          git push origin HEAD:code1-decompilation
