name: Integrate CODE.2 Batch 108
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch108.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 108
        run: |
          git merge-base --is-ancestor 270ef832383fc4283b3b626d37f76b59b2ab644f HEAD
          test "$(git hash-object Code2/.batch108.fragment.cpp)" = "3b160f98a470ccc6bd903746267c07d585f3ef02"
          test "$(git hash-object Code2/.batch108_integrate.py)" = "56ef8f083b4e75b981bbb692b7b4d5a9bf6129a2"
          grep -F 'static_assert(0x34BADu-0x34A74u==313u);' Code2/.batch108.fragment.cpp
          grep -F 'static_cast<u32>(load_le16(dg(m,esi)))<<16' Code2/.batch108.fragment.cpp
          grep -F 'static_cast<u32>(load_le16(dg(m,esi+2u)))<<16' Code2/.batch108.fragment.cpp
      - name: Integrate Batch 108
        run: python Code2/.batch108_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch108_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime108Boundary','patch_code8','encode_return','function_34a74','0x34AF9u,add_dl','0x34B69u,add_dl','0x34AF6u,add_al','0x34B66u,add_al','0x34B07u,shade','0x34B77u,shade','p3,p2,p1,p0','p2,p0','load_le16(dg(m,esi)))<<16','load_le16(dg(m,esi+2u)))<<16']:
              assert x in c,x
          assert '34BAD..34BAF | padding | 3' in l
          assert '222,924 / 239,698 = 93.0020% (93.00%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 108
        run: |
          cp Code2/.batch108_integrate.py /tmp/batch108_integrate.py
          rm -f Code2/.batch108.fragment.cpp Code2/.batch108_integrate.py .github/workflows/integrate-code2-batch108.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 108"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch108_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`34BB0`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 108"
          git push origin HEAD:code1-decompilation
