name: Integrate CODE.2 batch 05
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch05.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 05
        run: python3 .github/code2_batch05.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 20666u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 172u;' in cpp
          for n in ['function_021d8','function_02354','function_023b8','function_02474','function_026e8','function_02a34','function_02ae8','function_02db0','function_034b0']:
              assert n in cpp,n
          assert 'action=(index>=0&&index<=3)?static_cast<u32>(index+12):11u;' in cpp
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S);assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16);b=int(b,16);n=int(n);assert b-a+1==n;total+=n
          assert total==172,total
          assert 20666+172+218860==239698
          assert (0x2353-0x21d8)+(0x23b6-0x2354)+(0x2473-0x23b8)+(0x26e6-0x2474)+(0x2a34-0x26e8)+(0x2ae5-0x2a34)+(0x2d6f-0x2ae8)+(0x34af-0x2db0)+(0x3631-0x34b0)==5134
          print('CODE.2 batch 05 accounting verified: 20666 + 172 + 218860 = 239698')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Commit integrated batch
        run: |
          rm -f .github/code2_batch05.py Code2/batch05_part1.inc Code2/batch05_part2.inc .github/workflows/integrate-code2-batch05.yml
          git config user.name "Hyperbog"
          git config user.email "47282882+Hyperbog@users.noreply.github.com"
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 05"
          git push origin HEAD:code1-decompilation
