name: Phase 0 - original-media SHA-256 audit

on:
  push:
    branches: [main]
    paths:
      - 'Tools/phase0_inventory.py'
      - '.github/workflows/phase0-media-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-media-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout audit driver
        uses: actions/checkout@v4

      - name: Checkout DnD Classics original media (read-only)
        uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: preservation
          sparse-checkout: |
            MASTER/Menzoberranzan
            MASTER/Ravenloft - Stone Prophet
            MASTER/Ravenloft - Strahd's Possession
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false

      - name: Inventory and hash all current media files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python Tools/phase0_inventory.py --title menzo \
            --media "preservation/MASTER/Menzoberranzan" \
            --expected-csv "preservation/MASTER/Menzoberranzan/SOURCE_INVENTORY.csv" \
            --output audit/menzo.json
          python Tools/phase0_inventory.py --title stone \
            --media "preservation/MASTER/Ravenloft - Stone Prophet" \
            --expected-csv "preservation/MASTER/Ravenloft - Stone Prophet/SOURCE_INVENTORY.csv" \
            --output audit/stone.json
          python Tools/phase0_inventory.py --title strahd \
            --media "preservation/MASTER/Ravenloft - Strahd's Possession" \
            --output audit/strahd.json

      - name: Re-run unchanged Strahd analyzers against checked-out installed files
        shell: bash
        run: |
          set +e
          python Tools/phase0_inventory.py --title strahd \
            --media "preservation/MASTER/Ravenloft - Strahd's Possession/RLOFT" \
            --baseline --output audit/strahd-baseline.json
          echo "Analyzer exit status: $?" | tee audit/baseline-exit-status.txt
          exit 0

      - name: Produce reproducible comparison and audit summary
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from Tools.phase0_inventory import comparison

          root = Path("audit")
          records = {k: json.loads((root / (k + ".json")).read_text())
                     for k in ("strahd", "menzo", "stone")}
          cross = comparison(list(records.values()))
          (root / "comparison.json").write_text(json.dumps(cross, indent=2) + "\n")
          summary = [
              "# Phase 0 preservation checkout: actual file SHA-256 audit",
              "",
              "Hashes below were computed on Git checkout file bytes by hashlib.sha256, NOT"
              " inferred from source CSVs or Git blob SHA-1 IDs.",
              "",
              "| Game | Git files hashed | Total size (bytes) | CD_Extracted files | CD manifest SHA-256 | Source-CSV PASS | Source-CSV MISMATCH | Source-CSV MISSING |",
              "| --- | ---: | ---: | ---: | --- | ---: | ---: | ---: |",
          ]
          for title, manifest in records.items():
              extracted = [f for f in manifest["files"]
                           if f["filename"].startswith("CD_Extracted/")]
              digest = hashlib.sha256()
              for f in sorted(extracted, key=lambda r: r["filename"]):
                  digest.update((f["filename"] + "\0" + f["sha256"] + "\n").encode())
              source = manifest.get("source_inventory_audit", {}).get("counts", {})
              summary.append(
                  f"| {title} | {manifest['file_count']} | {manifest['total_size']} | "
                  f"{len(extracted)} | \`{digest.hexdigest()}\` | "
                  f"{source.get('PASS', 'n/a')} | "
                  f"{source.get('MISMATCH', 'n/a')} | "
                  f"{source.get('MISSING', 'n/a')} |"
              )
              audit = manifest.get("source_inventory_audit", {})
              bad = [x for x in audit.get("results", []) if x["status"] != "PASS"]
              if bad:
                  summary.extend(["", f"### {title}: original archive-source manifest discrepancies",
                                  "", "| Filename | Status | Actual bytes | Expected bytes | SHA-256 equal? |",
                                  "| --- | --- | ---: | ---: | --- |"])
                  for x in bad:
                      match = (x.get("actual_sha256") == x["expected_sha256"])
                      summary.append(
                          f"| \`{x['filename']}\` | {x['status']} | "
                          f"{x.get('actual_size', 'missing')} | {x['source_size']} | "
                          f"{match if 'actual_sha256' in x else 'unavailable'} |"
                      )
          summary.extend(["", "## Filename-presence comparison",
                          "", f"All three: {cross['counts']['all_three']}; "
                          f"exactly two: {cross['counts']['exactly_two']}; "
                          f"exactly one: {cross['counts']['exactly_one']}.",
                          "", "## Unchanged Strahd analyzer baseline", ""])
          base_path = root / "strahd-baseline.json"
          if base_path.exists():
              baseline = json.loads(base_path.read_text())
              for row in baseline.get("unchanged_strahd_baselines", []):
                  summary.append(f"- \`{row['script']}\`: {row['status']}."
                                 f" {row.get('reason','')}")
          else:
              summary.append("Baseline output absent; see job log.")
          summary.extend(["", "All complete per-file checkout SHA-256 values are in the"
                          " metadata-only JSON artifact (no commercial media is included)."])
          result = "\n".join(summary) + "\n"
          (root / "SUMMARY.md").write_text(result)
          print(result)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write(result)
          PY

      - name: Verify original RES group counts and cross-copy differences
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import struct
          from pathlib import Path
          root = Path("preservation/MASTER")
          settings = {
              "strahd": ("Ravenloft - Strahd's Possession", "RLOFT", "CD_Extracted/RLOFT",
                         "RLOFT/CODE.2", 0x27BDC, 0x20444,
                         bytes.fromhex("6a 0b 68 30 11 00 00"), 0x2044B, 0x2F2EC),
              "menzo": ("Menzoberranzan", "", "CD_Extracted",
                        "CODE.2", 0x27BDC, 0x23939,
                        bytes.fromhex("68 a0 86 01 00 68 60 ea 00 00 6a 0b 68 54 10 00 00"),
                        0x2394A, 0x3532C),
              "stone": ("Ravenloft - Stone Prophet", "PROPHET", "CD_Extracted",
                        "PROPHET/CODE.2", 0x28774, 0x2D461,
                        bytes.fromhex("68 a0 86 01 00 68 30 f2 00 00 6a 0b 68 d0 12 00 00"),
                        0x2D472, 0x412D0),
          }
          def u32(b, i):
              return struct.unpack_from("<I", b, i)[0]
          def res_map(folder):
              return {f.name: f for f in folder.glob("RES*")
                      if f.is_file() and f.name[3:].isdecimal()}
          def sha(f):
              h = hashlib.sha256()
              with f.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()
          def entries(path):
              b = path.read_bytes()
              n = u32(b, 0)
              if n == 0 or n > 200000 or 4 + 4*n > len(b):
                  raise ValueError(f"invalid RES index {path}")
              offsets = struct.unpack_from(f"<{n}I", b, 4)
              if offsets[0] != 4 + 4*n or any(x > y for x,y in zip(offsets, offsets[1:])):
                  raise ValueError(f"invalid RES offsets {path}")
              if offsets[-1] > len(b):
                  raise ValueError(f"final RES index outside file {path}")
              return [b[offsets[i]:(offsets[i+1] if i+1 < n else len(b))]
                      for i in range(n)]
          audit = {}
          for key, (title, installed, extracted, module, le, logical, witness, call, target) in settings.items():
              game = root / title
              exe = (game / module).read_bytes()
              origin = 0x25D24
              assert exe[origin:origin+2] == b"MZ"
              assert exe[le:le+2] == b"LE"
              code_offset = origin + u32(exe, le+0x80)
              assert exe[code_offset+logical:code_offset+logical+len(witness)] == witness, key
              call_bytes = exe[code_offset+call:code_offset+call+5]
              assert call_bytes[:1] == b"\xE8", key
              assert (call + 5 + struct.unpack_from("<i", call_bytes, 1)[0]) == target, key
              cd = res_map(game / extracted)
              local = res_map(game / installed)
              compare = {name: {"same": sha(f) == sha(local[name]), "bytes": f.stat().st_size}
                         for name, f in cd.items() if name in local}
              audit[key] = {
                  "original_code2": module,
                  "le_code_page_file_offset": code_offset,
                  "res_setup_instruction_offset": logical,
                  "group_count": 11, "first_index": 0, "last_index": 10,
                  "installed_res": sorted(local, key=lambda n: int(n[3:])),
                  "extracted_cd_res": sorted(cd, key=lambda n: int(n[3:])),
                  "paired_sha256_match": compare,
                  "cd_only_res": sorted(set(cd)-set(local), key=lambda n: int(n[3:])),
              }
          stone = root / "Ravenloft - Stone Prophet"
          a = entries(stone / "CD_Extracted/RES9")
          b = entries(stone / "PROPHET/RES9")
          overlap = min(len(a), len(b))
          different = [i for i in range(overlap) if a[i] != b[i]]
          changes = []
          for index in different:
              old, updated = a[index], b[index]
              changes.append({
                  "entry_index": index,
                  "cd_size": len(old), "installed_size": len(updated),
                  "cd_type": old[2] if len(old) >= 5 and old[:2] == b"EH" else "raw/empty",
                  "installed_type": updated[2] if len(updated) >= 5 and updated[:2] == b"EH" else "raw/empty",
                  "different_byte_count": sum(x != y for x, y in zip(old, updated))
                  + abs(len(old) - len(updated)),
                  "first_difference": next((k for k, (x,y) in enumerate(zip(old,updated)) if x != y), min(len(old),len(updated))),
              })
          audit["stone"]["res9_comparison"] = {
              "changed_records": changes,
              "cd_entries": len(a), "installed_entries": len(b),
              "equal_entry_count": overlap - len(different),
              "different_entry_count": len(different),
              "different_indices": different,
              "cd_sha256": sha(stone / "CD_Extracted/RES9"),
              "installed_sha256": sha(stone / "PROPHET/RES9"),
              "both_sizes": [(stone / p).stat().st_size for p in ("CD_Extracted/RES9", "PROPHET/RES9")],
          }
          Path("audit/res-usage.json").write_text(json.dumps(audit, indent=2) + "\n")
          lines = ["", "## Original executable RES group count (verified against actual CODE.2 bytes)", "",
                   "| Title | CODE.2 instruction | Indexed groups | Installed | Extracted CD | CD-only RES |",
                   "| --- | --- | --- | --- | --- | --- |"]
          for key, row in audit.items():
              lines.append(f"| {key} | \`0x{row['res_setup_instruction_offset']:X}\` | "
                           f"RES0–RES10 (11) | {', '.join(row['installed_res'])} | "
                           f"{', '.join(row['extracted_cd_res'])} | "
                           f"{', '.join(row['cd_only_res']) or '(none)'} |")
          r9 = audit["stone"]["res9_comparison"]
          lines.extend(["", f"Stone RES9: {r9['cd_entries']} CD entries vs "
                        f"{r9['installed_entries']} installed entries; "
                        f"{r9['equal_entry_count']} exact; "
                        f"{r9['different_entry_count']} different.",
                        f"Stone RES9 divergent indices: {r9['different_indices']}.",
                        f"Stone RES9 changed-record metadata: {r9['changed_records']}.",
                        "The source proves the initialized RES index range, not that "
                        "every record is necessarily visited during a playthrough.",
                        "CD-exclusive cinematics/installer files must not be presumed unused."])
          report = "\n".join(lines) + "\n"
          with Path("audit/SUMMARY.md").open("a") as f: f.write(report)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f: f.write(report)
          print(report)
          PY

      - name: Re-run unchanged Strahd legacy RES11 and RES12 lineage analyzer
        shell: bash
        run: |
          set -euo pipefail
          python Resources/RES/analyze_legacy_archives.py \
            "preservation/MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT" \
            --code2 "preservation/MASTER/Ravenloft - Strahd's Possession/RLOFT/CODE.2" \
            > audit/strahd-legacy-lineage.txt
          tail -45 audit/strahd-legacy-lineage.txt
          printf '\nUnchanged archive-lineage analyzer: PASS\n' >> audit/SUMMARY.md

      - name: Publish metadata-only SHA-256 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-three-title-sha256-audit
          path: audit/
          if-no-files-found: warn
          retention-days: 30
