name: Integrate CODE.2 Batch 124
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch124.yml']
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python Code2/.batch124_integrate.py integrate
      - run: python Code2/.batch124_integrate.py verify
      - run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - run: git diff --check
