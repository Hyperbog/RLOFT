name: Integrate CODE.2 Batch 124
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch124.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - run: python Code2/.batch124_integrate.py integrate
      - run: python Code2/.batch124_integrate.py verify
      - run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
          git diff --check
      - run: |
          cp Code2/.batch124_integrate.py /tmp/b124.py
          rm Code2/.batch124.fragment.cpp Code2/.batch124_integrate.py .github/workflows/integrate-code2-batch124.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 124"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/b124.py checkpoint
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 124"
          git push origin HEAD:code1-decompilation
