name: RLOFT retained 07938 Level23 native acceptance

on:
  workflow_dispatch:
  push:
    branches: [Recomp]
    paths:
      - 'Recomp/src/code2_startup_gate.cpp'
      - 'Recomp/src/original_code2_live_07938_restore.inc'
      - 'Recomp/src/original_code2_live_level_transition.inc'
      - 'Recomp/src/original_code2_level22_window.cpp'
      - 'Recomp/src/original_code2_live_full_frame.inc'
      - 'Recomp/src/canonical_code2_runtime_owner.hpp'
      - 'Recomp/CMakeLists.txt'
      - '.github/workflows/recomp-retained-07938-level23.yml'

permissions:
  contents: read

jobs:
  saved-level23:
    name: Compile and verify retained 07938 Level23-to-26 VGA
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native original CODE2 Windows window
        shell: pwsh
        run: |
          cmake -S Recomp -B build/retained07938 -A x64 -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "Configure native 07938 target failed" }
          cmake --build build/retained07938 --config Debug --parallel 2 --target rloft_code2_level22_window
          if ($LASTEXITCODE -ne 0) { throw "Compile native 07938 target failed" }
      - name: Sparse-checkout unmodified owner original saved game
        uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: original-media
          sparse-checkout: |
            MASTER/Ravenloft - Strahd's Possession/RLOFT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE01
            MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT/RES9
            MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT/RES10
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require original retained Level23 restoration and native portal framebuffer
        shell: pwsh
        timeout-minutes: 3
        run: |
          $root = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT").Path
          $cd = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT").Path
          $slot = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE01").Path
          $exe = (Resolve-Path "build/retained07938/Debug/rloft_code2_level22_window.exe").Path
          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $exe
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          foreach ($arg in @('--root',$root,'--cd-root',$cd,'--smoke-save23',$slot)) {
            [void]$info.ArgumentList.Add($arg)
          }
          $p = [Diagnostics.Process]::Start($info)
          $out = $p.StandardOutput.ReadToEndAsync()
          $err = $p.StandardError.ReadToEndAsync()
          try {
            $exited = $p.WaitForExit(90000)
            if (-not $exited) {
              $p.Kill($true)
              $p.WaitForExit()
            }
            $joined = @($out.GetAwaiter().GetResult(),$err.GetAwaiter().GetResult()) -join "`n"
            $selected = @($joined -split "`r?`n" | Where-Object {
              $_ -match '07938|181B4|171FC|LEVEL23|LEVEL26|PORTAL|SOURCE_STOP|NATIVE_HOST_FAIL|FULL_CYCLE_SCANOUT|1BDAC|2D5D0|1FC14|2C294|335DC|35798|21BF0|30D30|RES4_579|2F29C'
            })
            $selected | Select-Object -Last 90 | ForEach-Object { Write-Host "SOURCE_07938: $_" }
            # Preserve all original per-level native scanout receipts,
            # independent of high-volume wall/material diagnostics.
            @($joined -split "`r?`n" | Where-Object {
              $_ -match '^CODE2_ORIGINAL_GAMEPLAY_LEVEL=1FC14_AFTER_181B4_FULL_CYCLE_SCANOUT_PASS' -or
              $_ -match '^CODE2_ORIGINAL_GAMEPLAY_LEVEL=2D3D8_AUTHENTIC_PORTAL_SOURCE_RETURN' -or
              $_ -match '^CODE2_07938_RETAINED_LEVEL23_PORTAL_26_23_FULL_CYCLE_PASS'
            }) | ForEach-Object { Write-Host "SOURCE_PORTAL_FRAME: $_" }
            @($joined -split "`r?`n" | Where-Object {
              $_ -match 'CODE2_ORIGINAL_RES4_579|SOURCE_RES_ARCHIVE_SEEK id=579|TYPE6_DIAGNOSTIC_BEFORE item=579'
            }) | Select-Object -Last 28 | ForEach-Object { Write-Host "SOURCE_MATERIAL_579: $_" }
            $restored = $joined -match 'CODE2_ORIGINAL_GAMEPLAY_LEVEL=07938_RETAINED_LEVEL23_RESTORE_PASS'
            $complete = $joined -match 'CODE2_07938_RETAINED_LEVEL23_PORTAL_26_23_FULL_CYCLE_PASS'
            Write-Host "RETAINED_07938_ACCEPTANCE_SOURCE restored=$restored portal_full_cycle=$complete exited=$exited code=$($p.ExitCode)"
            if (-not $exited -or $p.ExitCode -ne 0 -or -not $restored -or -not $complete) {
              throw "Original retained Level23 native 07938/1FC14 acceptance OPEN"
            }
          } finally {
            $p.Dispose()
          }
