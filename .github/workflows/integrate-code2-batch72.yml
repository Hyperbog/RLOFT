name: Integrate CODE.2 Batch 72

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch72.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify staged Batch 72
        run: |
          test "$(git hash-object Code2/.batch72.fragment.cpp)" = "c69cd2e524074eb72577f6aee6cd03c44c3e25c6"
          test "$(git hash-object Code2/.batch72_integrate.py)" = "2a7d48072f2bd3534f53d13cd11191e1c5c48501"
          test "$(git hash-object Code2/.batch72_patch.py)" = "995c142fe493b1556362b334c53189c2ef0c5c83"
          grep -F '// Batch 72: 30D30..314AA' Code2/.batch72.fragment.cpp
          grep -F '==1852u);' Code2/.batch72.fragment.cpp

      - name: Apply reconciled staging correction
        run: |
          python Code2/.batch72_patch.py
          grep -F 'return (app72_r8(out,0x18u)&1u)!=0u?(app72_r32(out,4u)<<4):0u;' Code2/.batch72.fragment.cpp
          ! grep -F 'return (app72_r8(out,0x18u)&1u)==0u?(app72_r32(out,4u)<<4):0u;' Code2/.batch72.fragment.cpp

      - name: Integrate Batch 72
        run: python Code2/.batch72_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch72_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          anchors=[
              'app72_div16_trunc',
              'return (app72_r8(out,0x18u)&1u)!=0u?(app72_r32(out,4u)<<4):0u;',
              'function_3104c',
              'function_31107',
              'm.cpu.eax=(m.cpu.eax&0xFFFFFF00u)',
              'call_38106?b.call_38106(d,a,c)',
              'function_313fc',
              '==1852u);'
          ]
          for a in anchors: assert a in cpp,a
          assert '311D5..311DF | padding | 11' in led
          assert '314AB..314AF | padding | 5' in led
          assert '208,844 / 239,698 = 87.1280% (87.13%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 72
        run: |
          cp Code2/.batch72_integrate.py /tmp/batch72_integrate.py
          rm -f Code2/.batch72.fragment.cpp Code2/.batch72_integrate.py Code2/.batch72_patch.py .github/workflows/integrate-code2-batch72.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 72"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch72_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`314B0`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 72"
          git push origin HEAD:code1-decompilation
