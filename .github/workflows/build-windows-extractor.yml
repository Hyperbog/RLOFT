name: Build Windows 11 Extractor

on:
  push:
    branches:
      - code1-decompilation
    paths:
      - "Tools/**"
      - ".github/workflows/build-windows-extractor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-extractor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: Tools/anm/requirements.txt

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Tools/anm/requirements.txt
          python -m pip install "pyinstaller==6.22.3"

      - name: Download and verify FFmpeg release essentials
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $out = Join-Path $env:RUNNER_TEMP "ffmpeg-release"

          Invoke-WebRequest -Uri $url -OutFile $zip
          $checksumText = (Invoke-WebRequest -Uri "$url.sha256").Content.Trim()
          $expected = ($checksumText -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FFmpeg SHA-256 mismatch. Expected $expected, got $actual"
          }

          Expand-Archive -Path $zip -DestinationPath $out -Force
          $ffmpeg = Get-ChildItem -Path $out -Filter "ffmpeg.exe" -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found in the verified release archive."
          }

          "FFMPEG_EXE=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $ffmpeg -version | Select-Object -First 1

      - name: Run Python regression tests
        shell: pwsh
        working-directory: Tools/anm
        run: |
          python -m unittest discover -p "test_*.py" -v

      - name: Freeze one-file Windows application
        shell: pwsh
        working-directory: Tools/anm
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "RavenloftAssetExtractor" --version-file "windows_version_info.txt" --add-binary "$env:FFMPEG_EXE;." --add-data "THIRD_PARTY_NOTICES.md;." --add-data "assets;assets" "app.py"

      - name: Smoke-test frozen executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "Tools/anm/dist/RavenloftAssetExtractor.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen application self-test failed with exit code $($process.ExitCode)"
          }

      - name: Write checksums and build information
        shell: pwsh
        run: |
          $exe = Resolve-Path "Tools/anm/dist/RavenloftAssetExtractor.exe"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *RavenloftAssetExtractor.exe" | Set-Content -Path "Tools/anm/dist/RavenloftAssetExtractor.exe.sha256" -Encoding ascii

          $ffmpegVersion = (& $env:FFMPEG_EXE -version | Select-Object -First 1)
          @(
            "Ravenloft Asset Extraction Suite"
            "Target: Windows 11 x64"
            "Git commit: $env:GITHUB_SHA"
            "Python: $(python --version 2>&1)"
            "PyInstaller: $(python -m PyInstaller --version)"
            "FFmpeg: $ffmpegVersion"
            "Executable SHA-256: $hash"
          ) | Set-Content -Path "Tools/anm/dist/BUILD_INFO.txt" -Encoding utf8

      - name: Sync publish branch before staging
        shell: pwsh
        run: |
          git fetch origin code1-decompilation
          git rebase origin/code1-decompilation

      - name: Stage Windows distribution in repository
        shell: pwsh
        run: |
          $target = "Tools/Windows"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "Tools/anm/dist/RavenloftAssetExtractor.exe" "$target/RavenloftAssetExtractor.exe" -Force
          Copy-Item "Tools/anm/dist/RavenloftAssetExtractor.exe.sha256" "$target/RavenloftAssetExtractor.exe.sha256" -Force
          Copy-Item "Tools/anm/dist/BUILD_INFO.txt" "$target/BUILD_INFO.txt" -Force
          Copy-Item "Tools/anm/THIRD_PARTY_NOTICES.md" "$target/THIRD_PARTY_NOTICES.md" -Force

          $zip = "$target/RavenloftAssetExtractor-Windows11-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path @(
            "$target/RavenloftAssetExtractor.exe",
            "$target/RavenloftAssetExtractor.exe.sha256",
            "$target/BUILD_INFO.txt",
            "$target/THIRD_PARTY_NOTICES.md"
          ) -DestinationPath $zip -CompressionLevel Optimal

          $zipHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash *RavenloftAssetExtractor-Windows11-x64.zip" |
            Set-Content -Path "$target/RavenloftAssetExtractor-Windows11-x64.zip.sha256" -Encoding ascii

      - name: Commit Windows distribution
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tools/Windows
          if (git diff --cached --quiet) {
            Write-Host "Windows distribution is already current."
          } else {
            git commit -m "tools: publish Windows 11 executable [skip ci]"
            git push origin HEAD:code1-decompilation
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RavenloftAssetExtractor-Windows11-x64
          path: |
            Tools/anm/dist/RavenloftAssetExtractor.exe
            Tools/anm/dist/RavenloftAssetExtractor.exe.sha256
            Tools/anm/dist/BUILD_INFO.txt
            Tools/anm/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 90