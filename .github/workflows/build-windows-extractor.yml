name: Build current Ravenloft Windows extractor (WPF Fluent)

on:
  push:
    branches: [code1-decompilation]
    paths:
      - "Tools/WpfExtractor/**"
      - "Tools/anm/*.py"
      - "Tools/anm/requirements.txt"
      - ".github/workflows/build-windows-extractor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ravenloft-default-extractor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows11-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out default source branch
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: Tools/anm/requirements.txt

      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $directory = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = (((Invoke-WebRequest -Uri "$url.sha256").Content).Trim() -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "FFmpeg SHA-256 verification failed." }
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $ffmpeg = Get-ChildItem $directory -Filter ffmpeg.exe -File -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) { throw "Missing ffmpeg.exe from verified Windows build." }
          "RLOFT_FFMPEG=$ffmpeg" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Python regressions, frozen backend and self-contained WPF build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & Tools/WpfExtractor/build-local.ps1 -FFmpegPath $env:RLOFT_FFMPEG
          if ($LASTEXITCODE -ne 0) { throw "Current WPF extractor build failed." }
          $zip = "Tools/WpfExtractor/build-output/RavenloftExtractor-Windows11-x64.zip"
          if (!(Test-Path $zip)) { throw "WPF distribution ZIP is missing." }
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $record = (Get-Content "$zip.sha256" -Raw).Trim().ToLowerInvariant()
          if ($sha -ne $record) { throw "WPF ZIP checksum did not match." }

      - name: Upload current Windows 11 app artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavenloftExtractor-Windows11-x64-current
          path: |
            Tools/WpfExtractor/build-output/RavenloftExtractor-Windows11-x64.zip
            Tools/WpfExtractor/build-output/RavenloftExtractor-Windows11-x64.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish current GitHub Release download
        if: github.ref == 'refs/heads/code1-decompilation'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "extractor-current"
          $zip = "Tools/WpfExtractor/build-output/RavenloftExtractor-Windows11-x64.zip"
          $checksum = "$zip.sha256"
          $title = "Ravenloft Asset Extractor — WPF Fluent (current)"
          $notes = "Default Ravenloft Windows 11 extractor with native WPF Fluent UI. Extract the complete ZIP and run RavenloftExtractor.exe; retain the companion backend and runtime files. Built and regression-tested from $env:GITHUB_SHA."
          & gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag $zip $checksum --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not update current WPF release files." }
            & gh release edit $tag --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not update latest release metadata." }
          } else {
            & gh release create $tag $zip $checksum --target $env:GITHUB_SHA `
              --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not create WPF release." }
          }
          Write-Host "Latest Windows app is https://github.com/$env:GITHUB_REPOSITORY/releases/latest"
