name: Ravenloft Enhanced Game Windows

# Now-public repository: owner authorized automatic Full Windows CI.
# Source revisions publish a playable candidate using PORT tests;
# manual full remains available for the historical DOS research suite.
# Binary refresh commits contain [skip ci] to prevent recursion.
on:
  push:
    branches:
      - demo-v1
    paths:
      - '.github/workflows/demo-v1-build.yml'
      - 'DemoV1/**'
      - 'Code1/Code1.cpp'
      - 'Code2/Code2.cpp'
  workflow_dispatch:
    inputs:
      run_linux:
        description: "Opt in to paused Linux build and tests"
        required: false
        type: boolean
        default: false
      build_mode:
        description: "Quick = Windows game + enhanced-port regressions; Full = complete historical source/CTest suite"
        required: true
        type: choice
        options:
          - quick
          - full
        default: quick

# Cancel superseded source builds when a newer checkout arrives.
concurrency:
  group: demo-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux-tests:
    # Paused to conserve Actions minutes. A manual workflow_dispatch
    # with run_linux=true can explicitly opt in.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S DemoV1 -B build/demo-v1 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/demo-v1 --config Release
      - name: Test
        run: ctest --test-dir build/demo-v1 -C Release --output-on-failure

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Keep generated MSVC .obj/.lib files across incremental public-repo builds.
      # Restoring this cache is optional: the initial cold build is
      # still valid, while follow-up edits rebuild only changed sources.
      - name: Restore incremental Windows C++ build cache
        uses: actions/cache@v4
        with:
          path: build/demo-v1
          key: demo-v1-msvc-x64-v1-${{ hashFiles('DemoV1/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            demo-v1-msvc-x64-v1-${{ hashFiles('DemoV1/CMakeLists.txt') }}-
            demo-v1-msvc-x64-v1-
      - name: Optional canonical CODE.2 C++17 research syntax audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'full' }}
        shell: pwsh
        run: |
          # Windows image includes GCC. Check the actual executable and
          # fail explicitly instead of silently skipping this gate.
          $compiler = Get-Command g++.exe -ErrorAction SilentlyContinue
          if ($compiler) {
            & $compiler.Source -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            # windows-latest guarantees a Visual Studio C++ toolchain
            # for the CMake -A x64 job; locate the installed edition
            # rather than assuming a hardcoded VS Enterprise path.
            $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
            if (-not (Test-Path $vswhere)) {
              throw "Neither g++ nor Visual Studio vswhere is available."
            }
            $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsRoot) { throw "No MSVC C++ toolchain installed." }
            $vcvars = Join-Path $vsRoot "VC\\Auxiliary\\Build\\vcvars64.bat"
            if (-not (Test-Path $vcvars)) { throw "MSVC x64 initialization missing." }
            $command = 'call "' + $vcvars + '" >NUL && cl.exe /nologo /std:c++17 /permissive- /Zs Code2\\Code2.cpp'
            & cmd.exe /d /s /c $command
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Preflight enhanced-port source and launcher contracts
        shell: pwsh
        run: |
          # Source-only tests MUST precede the expensive MSVC compilation.
          # Reject corrupted launchers, false frontend changes or unsafe
          # artifact provenance in seconds, rather than after a full build.
          python -m py_compile DemoV1/tools/verify_enhanced_port_build_pipeline.py DemoV1/tools/verify_continuous_alpha_launch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/verify_enhanced_port_build_pipeline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/verify_continuous_alpha_launch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/verify_alpha_frontend_preservation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/verify_enhanced_level22_pipeline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/verify_enhanced_world_music.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/verify_enhanced_level22_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/verify_game_gpu_integration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/verify_game_combat_inputs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/verify_game_level22_transition.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DemoV1/tools/check_release_gates.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        # Compile the checkout revision, not a later bot refresh commit.
        run: cmake -S DemoV1 -B build/demo-v1 -A x64 -DRLOFT_DEMO_SOURCE_SHA=${{ github.sha }}
      - name: Build game and enhanced-port regressions
        if: ${{ github.event_name == 'push' || inputs.build_mode == 'quick' }}
        run: >-
          cmake --build build/demo-v1 --config Release --parallel 2 --target
          ravenloft_demo_v1 rloft_res4_ground_probe
          rloft_starting_equipment_probe
          character_transfer_tests character_starting_equipment_tests
          inventory_runtime_tests inventory_item_description_tests
          inventory_world_drop_tests inventory_encumbrance_tests inventory_party_order_tests inventory_screen_tests
          party_panel_controls_tests character_modal_stats_tests
          exploration_session_tests exploration_preview_tests
          exploration_gameplay_cadence_tests exploration_ui_tests original_entity_collision_tests
          exploration_runtime_motion_tests original_ground_texture_raster_tests
          original_ground_res4_audit_tests exploration_presenter_tests
          environment_presenter_tests enhanced_gpu_world_mesh_tests enhanced_gpu_camera_tests enhanced_gpu_backdrop_tests enhanced_game_save_tests title_keyboard_tests top_edge_menu_tests
          enhanced_inventory_blit_tests
          enhanced_type7_compositor_tests enhanced_scene_mode_tests
          enhanced_world_music_tests enhanced_options_presenter_tests
          automap_screen_presenter_tests automap_viewport_presenter_tests
          automap_annotation_presenter_tests enhanced_automap_keyboard_tests
          exploration_frame_capture_tests world_scene_render_plan_tests
          level22_story_tests level22_encounter_tests
          level22_viewport_target_tests exploration_runtime_tests
          combat_hit_check_tests combat_player_hit_inputs_tests combat_live_hand_request_tests
          level22_mist_timeline_tests level22_quest_playback_tests
      - name: Test game and enhanced-port regressions
        if: ${{ github.event_name == 'push' || inputs.build_mode == 'quick' }}
        shell: pwsh
        run: |
          ctest --test-dir build/demo-v1 -C Release --output-on-failure --parallel 2 -R "^(level22_story_tests|level22_encounter_tests|level22_viewport_target_tests|exploration_runtime_tests|combat_hit_check_tests|combat_player_hit_inputs_tests|combat_live_hand_request_tests|level22_mist_timeline_tests|level22_quest_playback_tests|exploration_session_tests|exploration_preview_tests|exploration_gameplay_cadence_tests|exploration_ui_tests|original_entity_collision_tests|exploration_runtime_motion_tests|original_ground_texture_raster_tests|original_ground_res4_audit_tests|exploration_presenter_tests|environment_presenter_tests|enhanced_gpu_world_mesh_tests|enhanced_gpu_camera_tests|enhanced_gpu_backdrop_tests|enhanced_game_save_tests|title_keyboard_tests|top_edge_menu_tests|enhanced_type7_compositor_tests|enhanced_scene_mode_tests|enhanced_world_music_tests|enhanced_options_presenter_tests|automap_screen_presenter_tests|automap_viewport_presenter_tests|automap_annotation_presenter_tests|enhanced_automap_keyboard_tests|world_scene_render_plan_tests|exploration_frame_capture_tests|character_transfer_tests|character_starting_equipment_tests|inventory_runtime_tests|enhanced_inventory_blit_tests|inventory_item_description_tests|inventory_world_drop_tests|inventory_encumbrance_tests|inventory_party_order_tests|inventory_screen_tests|party_panel_controls_tests|character_modal_stats_tests|alpha_continuous_game_launch_contract_tests|alpha_frontend_preservation_contract_tests|enhanced_level22_player_scene_source_tests|release_readiness_manifest_contract_tests|enhanced_port_build_pipeline_contract_tests|enhanced_world_music_pipeline_contract_tests|enhanced_level22_ui_source_tests|enhanced_game_gpu_source_contract_tests|enhanced_combat_input_source_contract_tests|enhanced_level22_quest_transition_contract_tests)$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build historical full research suite (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'full' }}
        run: cmake --build build/demo-v1 --config Release --parallel 2
      - name: Test historical full research suite (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'full' }}
        run: ctest --test-dir build/demo-v1 -C Release --output-on-failure --parallel 2
      - name: Stage original front-end and character creation
        shell: pwsh
        run: |
          Copy-Item DemoV1/Windows/Play-Original-Intro.cmd build/demo-v1/Release/Play-Original-Intro.cmd -Force
          # Historical Level 22 developer launchers are not shipped to players.
          Copy-Item DemoV1/Windows/Audit-Starting-Equipment.cmd build/demo-v1/Release/Audit-Starting-Equipment.cmd -Force
          # A machine-readable matching provenance file is shipped next to
          # the exe and launchers for users reporting crash screenshots.
          Set-Content -NoNewline -Path build/demo-v1/Release/build-source-sha.txt -Value "${{ github.sha }}"
          Set-Content -NoNewline -Path build/demo-v1/Release/build-verification-mode.txt -Value "${{ github.event_name == 'push' && 'enhanced-port' || inputs.build_mode }}"
          # Bind packaged launchers to the exact staged EXE bytes;
          # build-source-sha.txt separately names the compiled checkout.
          Copy-Item build/demo-v1/Release/ravenloft_demo_v1.exe build/demo-v1/Release/Ravenloft.exe -Force
          $packageExe = 'build/demo-v1/Release/Ravenloft.exe'
          $packageHash = (Get-FileHash -LiteralPath $packageExe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path build/demo-v1/Release/Ravenloft.exe.sha256 -Value "$packageHash  Ravenloft.exe"

      - name: Verify continuous launcher parses in Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $launcher = (Resolve-Path 'DemoV1/Windows/Play-Ravenloft.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $launcher, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Out-String | Write-Error
            exit 1
          }

      - name: Stage continuous normal-game Alpha launch (no picker)
        shell: pwsh
        run: |
          # The earlier front-end-only showcase is retained as a separate
          # optional artifact. The PRIMARY player test must reach Level22
          # through the normal CODE.1 CHARS -> CODE.2 boundary.
          Copy-Item DemoV1/Windows/Play-Ravenloft.cmd build/demo-v1/Release/Play-Ravenloft.cmd -Force
          Copy-Item DemoV1/Windows/Play-Ravenloft.ps1 build/demo-v1/Release/Play-Ravenloft.ps1 -Force
          New-Item -ItemType Directory -Force build/demo-v1/Release/Game | Out-Null
          Copy-Item DemoV1/Windows/ORIGINAL-GAME-FILES-GO-HERE.txt build/demo-v1/Release/Game/ORIGINAL-GAME-FILES-GO-HERE.txt -Force

      - name: Publish enhanced continuous Windows game
        uses: actions/upload-artifact@v4
        with:
          name: Ravenloft-Enhanced-Game-Windows-x64
          path: |
            build/demo-v1/Release/Ravenloft.exe
            build/demo-v1/Release/Ravenloft.exe.sha256
            build/demo-v1/Release/Play-Ravenloft.cmd
            build/demo-v1/Release/Play-Ravenloft.ps1
            build/demo-v1/Release/Game/ORIGINAL-GAME-FILES-GO-HERE.txt
            build/demo-v1/Release/build-source-sha.txt
            build/demo-v1/Release/build-verification-mode.txt
          if-no-files-found: error

      - name: Keep Windows executable in git
        shell: pwsh
        run: |
          # Documentation-only commits can land after the Windows
          # checkout but before the 6-minute native build completes.
          # Refresh to the latest branch HEAD BEFORE copying the
          # already-built EXE, so the binary commit has a fast-forward
          # parent rather than silently losing concurrent documentation.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin demo-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -B demo-v1 origin/demo-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path DemoV1/Windows | Out-Null
          Copy-Item build/demo-v1/Release/ravenloft_demo_v1.exe DemoV1/Windows/ravenloft_demo_v1.exe -Force
          $hash = (Get-FileHash DemoV1/Windows/ravenloft_demo_v1.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path DemoV1/Windows/ravenloft_demo_v1.exe.sha256 -Value "$hash  ravenloft_demo_v1.exe"
          # This checked-in EXE may be older than the branch HEAD because
          # later docs/source commits can arrive during its build. Always
          # publish the ACTUAL compiled checkout SHA beside the binary.
          Set-Content -NoNewline -Path DemoV1/Windows/build-source-sha.txt -Value "${{ github.sha }}"
          git add DemoV1/Windows/ravenloft_demo_v1.exe DemoV1/Windows/ravenloft_demo_v1.exe.sha256 DemoV1/Windows/build-source-sha.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "build: refresh Demo v1 Windows executable [skip ci]"
            git push origin HEAD:demo-v1
          } elseif ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

