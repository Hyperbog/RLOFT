name: Demo v1 build

on:
  push:
    branches:
      - demo-v1
    paths:
      - "DemoV1/**"
      - ".github/workflows/demo-v1-build.yml"
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S DemoV1 -B build/demo-v1 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/demo-v1 --config Release
      - name: Test
        run: ctest --test-dir build/demo-v1 -C Release --output-on-failure

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S DemoV1 -B build/demo-v1 -A x64
      - name: Build
        run: cmake --build build/demo-v1 --config Release
      - name: Test
        run: ctest --test-dir build/demo-v1 -C Release --output-on-failure
      - name: Publish Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Ravenloft-Demo-v1-Windows-x64
          path: build/demo-v1/Release/ravenloft_demo_v1.exe
          if-no-files-found: error
