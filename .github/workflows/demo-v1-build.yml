name: Demo v1 build

on:
  push:
    branches:
      - demo-v1
    paths:
      # Source/build changes trigger CI. Documentation-only commits
      # and the published .exe must not consume Windows runner minutes.
      - "DemoV1/src/**"
      - "DemoV1/include/**"
      - "DemoV1/tests/**"
      - "DemoV1/tools/**"
      - "DemoV1/CMakeLists.txt"
      - ".github/workflows/demo-v1-build.yml"
  workflow_dispatch:
    inputs:
      run_linux:
        description: "Opt in to paused Linux build and tests"
        required: false
        type: boolean
        default: false

# Keep only the newest Windows build when rapid source commits overlap.
# Cancellation avoids paying for obsolete full builds of the same branch.
concurrency:
  group: demo-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux-tests:
    # Paused to conserve Actions minutes. Pushes run Windows only; a
    # manual workflow_dispatch with run_linux=true can explicitly opt in.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S DemoV1 -B build/demo-v1 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/demo-v1 --config Release
      - name: Test
        run: ctest --test-dir build/demo-v1 -C Release --output-on-failure

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S DemoV1 -B build/demo-v1 -A x64
      - name: Build
        run: cmake --build build/demo-v1 --config Release
      - name: Test
        run: ctest --test-dir build/demo-v1 -C Release --output-on-failure
      - name: Publish Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Ravenloft-Demo-v1-Windows-x64
          path: build/demo-v1/Release/ravenloft_demo_v1.exe
          if-no-files-found: error

      - name: Keep Windows executable in git
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path DemoV1/Windows | Out-Null
          Copy-Item build/demo-v1/Release/ravenloft_demo_v1.exe DemoV1/Windows/ravenloft_demo_v1.exe -Force
          $hash = (Get-FileHash DemoV1/Windows/ravenloft_demo_v1.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path DemoV1/Windows/ravenloft_demo_v1.exe.sha256 -Value "$hash  ravenloft_demo_v1.exe"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DemoV1/Windows/ravenloft_demo_v1.exe DemoV1/Windows/ravenloft_demo_v1.exe.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "build: refresh Demo v1 Windows executable [skip ci]"
            git push origin HEAD:demo-v1
          } elseif ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
