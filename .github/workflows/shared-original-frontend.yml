name: Shared Original Frontend Compatibility

on:
  push:
    branches: [native-engine]
    paths:
      - 'Shared/BootFlow/**'
      - 'Shared/CharacterCreation/**'
      - 'Shared/StartupPresentation/**'
      - 'DemoV1/src/character_transfer.cpp'
      - 'DemoV1/include/rloft/character_*.hpp'
      - 'DemoV1/CMakeLists.txt'
      - 'DemoV1/include/rloft/boot_flow.hpp'
      - 'DemoV1/include/rloft/character_creation_flow.hpp'
      - 'NativeEngine/CMakeLists.txt'
      - '.github/workflows/shared-original-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-consumer-source-compatibility:
    name: Build original DemoV1 controllers against shared libraries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure DemoV1 with shared neutral source
        run: cmake -S DemoV1 -B /tmp/rloft-demo-front -DCMAKE_BUILD_TYPE=Release
      - name: Compile original boot, creation, stat, palette and CHARS regressions
        run: cmake --build /tmp/rloft-demo-front --target boot_flow_tests character_flow_tests character_stats_tests character_transfer_tests character_palette_remap_tests --parallel 2
      - name: Execute unchanged original behavior regressions
        run: ctest --test-dir /tmp/rloft-demo-front -R '^(boot_flow_tests|character_flow_tests|character_stats_tests|character_transfer_tests|character_palette_remap_tests)$' --output-on-failure
      - name: Show shared original implementation evidence
        run: |
          test -e Shared/BootFlow/src/boot_flow.cpp
          test -e Shared/CharacterCreation/src/character_creation_flow.cpp
          test ! -e DemoV1/src/boot_flow.cpp
          test ! -e DemoV1/src/character_creation_flow.cpp
          test -e Shared/StartupPresentation/src/character_creation_presenter.cpp
          test -e Shared/StartupPresentation/src/character_transfer.cpp
          test ! -e DemoV1/src/character_creation_presenter.cpp
          grep -q 'CharacterTransferTables::from_assets' DemoV1/src/character_transfer.cpp
          echo 'NEUTRAL_ORIGINAL_FRONTEND_DUAL_CONSUMER_SOURCE_PASS'
