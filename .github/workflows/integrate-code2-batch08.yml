name: Integrate CODE.2 batch 08
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch08.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 08
        run: python3 .github/code2_batch08.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 31278u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 246u;' in cpp
          for n in ['function_0518c','function_05578','function_05698','function_05984','function_05a14','function_05aa4','function_05bdc','function_05c84','function_05d34','function_05dd0','function_05e38','function_05eec']:
              assert n in cpp,n
          assert 'gate=static_cast<s8>(*dg(m,0x218F5u+rec));' in cpp
          assert 'const u8 saved[3]' in cpp
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S);assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16);b=int(b,16);n=int(n);assert b-a+1==n;total+=n
          assert total==246,total
          assert 31278+246+208174==239698
          assert ((0x5578-0x518c)+(0x5695-0x5578)+(0x5983-0x5698)+(0x5a11-0x5984)+(0x5aa3-0x5a14)+(0x5bdc-0x5aa4)+(0x5c81-0x5bdc)+(0x5d34-0x5c84)+(0x5dd0-0x5d34)+(0x5e38-0x5dd0)+(0x5ec3-0x5e38)+(0x6008-0x5eec))==3656
          print('CODE.2 batch 08 accounting verified: 31278 + 246 + 208174 = 239698')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Commit integrated batch
        run: |
          rm -f .github/code2_batch08.py Code2/batch08.inc .github/workflows/integrate-code2-batch08.yml
          git config user.name "Hyperbog"
          git config user.email "47282882+Hyperbog@users.noreply.github.com"
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 08"
          git push origin HEAD:code1-decompilation
