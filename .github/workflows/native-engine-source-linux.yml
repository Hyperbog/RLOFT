name: Native Engine source-only Linux build and regression

# Does not affect the owner's manual-only Windows release workflow.
# Original licensed game media must never be fetched, uploaded or cached.
on:
  push:
    branches: [native-engine]
    paths:
      - "NativeEngine/**"
      - ".github/workflows/native-engine-source-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-engine-source-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-only-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact native source HEAD
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show source identity and available compilers
        run: |
          git rev-parse HEAD
          cmake --version
          g++ --version
      - name: Configure independent replacement engine, no original files
        run: >
          cmake -S NativeEngine -B build/native-source-ci
          -DCMAKE_BUILD_TYPE=Debug
          -DRLOFT_NATIVE_SOURCE_SHA=${{ github.sha }}
      - name: Compile all portable native libraries, executables and regressions
        run: cmake --build build/native-source-ci --parallel 2
      - name: Run source-only NativeEngine CTest suite
        run: ctest --test-dir build/native-source-ci --output-on-failure
      - name: Diagnose native bank fixture failure on Linux
        if: failure()
        run: |
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gdb
          fi
          gdb --batch -ex run -ex "bt full" --args build/native-source-ci/native_bank_system_tests
      - name: Upload asset-free Linux validation executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RLOFT-native-source-linux-auditors
          path: |
            build/native-source-ci/rloft_native_payload_audit
            build/native-source-ci/rloft_native_world_audit
            build/native-source-ci/rloft_native_world_runtime_audit
            build/native-source-ci/rloft_native_scene_probe
            build/native-source-ci/rloft_native_res3_scene_audit
            build/native-source-ci/rloft_native_sintab_raster_audit
            build/native-source-ci/rloft_native_type7_vga_audit
            build/native-source-ci/rloft_native_scene_instances_audit
            build/native-source-ci/rloft_native_scene_frame_ranges_audit
            build/native-source-ci/rloft_native_type6_strip_audit
            build/native-source-ci/rloft_native_world_materials_audit
            build/native-source-ci/rloft_native_code2_wall_emission_audit
            build/native-source-ci/rloft_native_code2_projection_audit
            build/native-source-ci/rloft_native_vga_rgb6_scanout_audit
          if-no-files-found: error
          retention-days: 7
      - name: Check native payload and persistent world runtime auditors exist
        run: |
          test -x build/native-source-ci/rloft_native_payload_audit
          test -x build/native-source-ci/rloft_native_world_runtime_audit
          test -x build/native-source-ci/rloft_native_scene_probe
          test -x build/native-source-ci/rloft_native_res3_scene_audit
          test -x build/native-source-ci/rloft_native_sintab_raster_audit
          test -x build/native-source-ci/rloft_native_type7_vga_audit
          test -x build/native-source-ci/rloft_native_scene_instances_audit
          test -x build/native-source-ci/rloft_native_scene_frame_ranges_audit
          test -x build/native-source-ci/rloft_native_type6_strip_audit
          test -x build/native-source-ci/rloft_native_world_materials_audit
          test -x build/native-source-ci/rloft_native_code2_wall_emission_audit
          test -x build/native-source-ci/rloft_native_code2_projection_audit
          test -x build/native-source-ci/rloft_native_vga_rgb6_scanout_audit
      - name: Assert no original media was added by source-only test
        run: |
          test ! -f build/native-source-ci/LEVELS.DAT
          test ! -f build/native-source-ci/SINTAB
          test ! -f build/native-source-ci/game.gog
