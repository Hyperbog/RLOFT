name: Integrate CODE.2 batch 31

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch31.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 31
        run: python Code2/.integrate_batch31.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 103537u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2143u;' in code
          assert '**103,537**' in progress and '**2,143**' in progress
          assert '**105,680 / 239,698 = 44.0888% (44.09%)**' in progress
          assert 'static_assert(0x17838u-0x171FCu==1596u);' in code
          assert 'static_assert(0x179A2u-0x17838u==362u);' in code
          assert 'static_assert(0x181B4u-0x17A68u==1868u);' in code
          assert 'app31_write_local(m,b,handle,&off6,4u);' in code
          assert "(*dg(m,q+1u)&0x10u)==0u" in code
          assert 'static constexpr u32 blocked_with_37[]' in code
          assert 'static constexpr u32 blocked_without_37[]' in code
          assert 'case 0x4Eu:' in code and 'store_le32(dg(m,rec+0x08u),0x10000000u);' in code
          assert 'b.call_1c328?b.call_1c328(rank,8u,0u,0u):0u' in code
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2143,total
          assert 103537+2143==105680
          assert 239698-105680==134018
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch31_fragment.cpp Code2/.integrate_batch31.py .github/workflows/integrate-code2-batch31.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 31"
          git push origin HEAD:code1-decompilation
