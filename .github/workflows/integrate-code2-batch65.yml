name: Integrate CODE.2 Batch 65

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch65.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('Code2/.batch65.fragment.cpp').read_bytes()
          actual=hashlib.sha256(raw).hexdigest()
          print('staged-payload-sha256='+actual)
          assert actual == '9d2d248a59fb7945e026c75ce55e85cb7680f3fc05a94222aec6404561228a5d'
          text=raw.decode()
          assert '// Batch 65: 2C294..2D001' in text
          assert '==3418u);' in text
          PY

      - name: Integrate Batch 65
        run: python Code2/.batch65_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch65_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert all(x in cpp for x in ['function_2c294','function_2c800','function_2c8e4','function_2c9dc','function_2ca5c','function_2cad4','function_2cc88','function_2ceb8'])
          assert 'b.call_296c0(saved_rect[0],saved_rect[2],saved_rect[1],saved_rect[3]);' in cpp
          assert 'const u32 cell0=load_le32(dg(m,0x258ECu))+static_cast<u32>(frame);' in cpp
          assert 'const u32 cell1=load_le32(dg(m,0x258ECu))+static_cast<u32>(frame);' in cpp
          assert 'store_le16(dg(m,0x255D0u),load_le16(dg(m,0x255D4u)));' in cpp
          assert cpp.count('app65_clip_active(m)') >= 3
          assert '2D002..2D003 | alignment | 2' in led
          assert '191,262 / 239,698 = 79.7929% (79.79%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 65
        run: |
          cp Code2/.batch65_integrate.py /tmp/batch65_integrate.py
          rm -f Code2/.batch65.fragment.cpp Code2/.batch65_integrate.py .github/workflows/integrate-code2-batch65.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 65"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch65_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`2D004`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 65"
          git push origin HEAD:code1-decompilation
