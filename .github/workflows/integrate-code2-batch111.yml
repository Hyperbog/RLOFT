name: Integrate CODE.2 Batch 111
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch111.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 111
        run: |
          git merge-base --is-ancestor ceed8353d94bf7c2e55d5d2d954b29b3f76943ea HEAD
          test "$(git hash-object Code2/.batch111.fragment.cpp)" = "67cede814685de308a2f98a71192653958b07446"
          test "$(git hash-object Code2/.batch111_integrate.py)" = "aad778aaccb807ff2de945dc15a367c6593f5b6c"
          grep -F 'static_assert(0x353A2u-0x353A0u==2u);' Code2/.batch111.fragment.cpp
          grep -F 'return 0xFFFFFFFFu;' Code2/.batch111.fragment.cpp
      - name: Integrate Batch 111
        run: python Code2/.batch111_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch111_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime111Boundary','function_35286','function_352bd','function_352be','function_352d8','function_352ee','function_35349','function_353a0','app111_ctype','return 0xFFFFFFFFu;']:
              assert x in c,x
          assert '353A2..35417 | noncode | 118' in l
          assert '225,076 / 239,698 = 93.8998% (93.90%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 111
        run: |
          cp Code2/.batch111_integrate.py /tmp/batch111_integrate.py
          rm -f Code2/.batch111.fragment.cpp Code2/.batch111_integrate.py .github/workflows/integrate-code2-batch111.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 111"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch111_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`35418`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 111"
          git push origin HEAD:code1-decompilation
