name: Integrate CODE.2 batch 46
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch46.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 46
        run: python Code2/run_batch46.py
      - name: Verify accounting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 138937u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2667u;' in c
          assert 'static_assert(0x20E08u-0x20D7Cu==140u);' in c
          assert '**141,604 / 239,698 = 59.0760% (59.08%)**' in p
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2667,total
          print('accounting OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary integration files
        run: |
          rm -f Code2/batch46.staging.cpp Code2/integrate_batch46.py Code2/run_batch46.py .github/workflows/integrate-code2-batch46.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 46'
          git push origin HEAD:code1-decompilation
