name: Integrate CODE.2 Batch 132
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch132.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - run: python Code2/.batch132_integrate.py integrate
      - run: python Code2/.batch132_integrate.py verify
      - run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
          git diff --check
      - run: |
          rm Code2/.batch132.fragment.cpp .github/workflows/integrate-code2-batch132.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 132"
          git push origin HEAD:code1-decompilation
          SUB=$(git rev-parse HEAD)
          python Code2/.batch132_integrate.py checkpoint "$SUB"
          git rm Code2/.batch132_integrate.py
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 132"
          git push origin HEAD:code1-decompilation
