name: Integrate CODE.2 Batch 91
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch91.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 91
        run: |
          git merge-base --is-ancestor a937647b65e365ec23dc2cd3e57288a9180632a6 HEAD
          test "$(git hash-object Code2/.batch91.fragment.cpp)" = "a570ea1e7b90c22647ceecc2a85848da8d45eb38"
          test "$(git hash-object Code2/.batch91_integrate.py)" = "2ec153b7f68985a9970ab28bd7bd832f118278b5"
          grep -F 'static_assert(0x337C7u-0x335DCu==491u);' Code2/.batch91.fragment.cpp
      - name: Integrate Batch 91
        run: python Code2/.batch91_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch91_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_335dc','Application91Boundary','initial_width','reset_width','call_3263c','call_2f29c']:
              assert x in c,x
          assert '337C7..337C7 | alignment | 1' in l
          assert '217,828 / 239,698 = 90.8760% (90.88%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 91
        run: |
          cp Code2/.batch91_integrate.py /tmp/batch91_integrate.py
          rm -f Code2/.batch91.fragment.cpp Code2/.batch91_integrate.py .github/workflows/integrate-code2-batch91.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 91"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch91_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`337C8`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 91"
          git push origin HEAD:code1-decompilation
