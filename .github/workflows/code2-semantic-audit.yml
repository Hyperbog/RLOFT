name: CODE.2 semantic audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/code2-semantic-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Integrate checkpoint 6 audit
        run: python3 Code2/.audit06_integrate.py
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Verify checkpoint 6 corrections
        run: |
          grep -F 'if(row!=c)' Code2/Code2.cpp
          grep -F 'if(row!=a)' Code2/Code2.cpp
          grep -F '==load_le16(dg(m,0x218FEu+slot_off)))continue;' Code2/Code2.cpp
          grep -F '20,876 / 239,698 = 8.7093%' Code2/FINAL_SEMANTIC_AUDIT.md
      - name: Commit checkpoint 6 audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Code2/Code2.cpp Code2/FINAL_SEMANTIC_AUDIT.md Code2/PROGRESS.md Code2/RESUME_CHECKPOINT.md
          git commit -m 'Audit CODE.2 semantics through 0518B'
          git push
