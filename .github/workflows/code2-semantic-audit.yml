name: CODE.2 semantic audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/code2-semantic-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Integrate checkpoint 10 audit
        run: python3 Code2/.audit10_integrate.py
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Verify checkpoint 10
        run: |
          grep -F '54,592 / 239,698 = 22.7753%' Code2/FINAL_SEMANTIC_AUDIT.md
          grep -F 'Next frontier: **`0D550`**' Code2/FINAL_SEMANTIC_AUDIT.md
      - name: Commit checkpoint 10 audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Code2/FINAL_SEMANTIC_AUDIT.md Code2/PROGRESS.md Code2/RESUME_CHECKPOINT.md
          git commit -m 'Audit CODE.2 semantics through 0D54F'
          git push
