name: CODE.2 semantic audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/code2-semantic-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Integrate checkpoint 13
        run: python3 Code2/.audit13_integrate.py
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Verify checkpoint 13
        run: |
          grep -q '65,864 / 239,698 = 27.4779%' Code2/FINAL_SEMANTIC_AUDIT.md
          grep -q 'call_30ca2(0x62u,static_cast<u32>(x),3u,2u)' Code2/Code2.cpp
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Code2/Code2.cpp Code2/FINAL_SEMANTIC_AUDIT.md Code2/PROGRESS.md Code2/RESUME_CHECKPOINT.md
          git commit -m 'Audit CODE.2 semantics through 10157'
          git push
