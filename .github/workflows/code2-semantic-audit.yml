name: CODE.2 semantic audit
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/code2-semantic-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Integrate checkpoint 14
        run: python3 Code2/.audit14_integrate.py
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Verify checkpoint 14
        run: |
          grep -q '72,732 / 239,698 = 30.3432%' Code2/PROGRESS.md
          grep -q 'Checkpoint 14' Code2/FINAL_SEMANTIC_AUDIT.md
          grep -q 'checkpoint 14 handoff' Code2/RESUME_CHECKPOINT.md
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Code2/PROGRESS.md Code2/FINAL_SEMANTIC_AUDIT.md Code2/RESUME_CHECKPOINT.md
          git commit -m 'Audit CODE.2 semantics through 11C2B'
          git push
