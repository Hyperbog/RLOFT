name: Integrate CODE.2 batch 56
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch56.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch56.zb64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'b4c759a3b9e2d8f9e5d9b3f76fdba91f550f718c28c74f97d7af1345f7ba4234'
          text=raw.decode()
          assert 'function_2873c' in text and 'function_293ec' in text and '== 3214u);' in text
          print('batch56 payload OK',len(raw))
          PY
      - name: Apply Batch 56
        run: python Code2/integrate_batch56.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 172269u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 3651u;' in c
          assert '(0x273E7u-0x26018u) + 2797u + 2032u + 3214u);' in c
          assert 'static_assert(0x28789u-0x2873Cu==77u);' in c
          assert 'static_assert(0x29414u-0x293ECu==40u);' in c
          assert '== 3214u);' in c
          assert '290C3..290CF | padding | 13' in l
          assert '293EA..293EB | alignment | 2' in l
          assert '**175,920 / 239,698 = 73.3924% (73.39%)**' in p
          assert '**63,778**' in p
          assert 'sequential frontier is now **`29414`**' in p
          assert '## CODE.2 Batch 56 checkpoint' in a
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              x,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-x+1==n,(line,z-x+1)
              total+=n
          assert total==3651,total
          print('batch56 accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary staging files
        run: |
          rm -f Code2/batch56.zb64 Code2/integrate_batch56.py .github/workflows/integrate-code2-batch56.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name); p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit Batch 56
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 56'
          git push origin HEAD:code1-decompilation
