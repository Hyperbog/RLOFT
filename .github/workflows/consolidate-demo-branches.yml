name: Consolidate demo branches

on:
  push:
    branches:
      - demo-v1-part4-live-sim-ci
    paths:
      - ".github/workflows/consolidate-demo-branches.yml"

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote current demo head and remove branch fan-out
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f             .github/workflows/consolidate-demo-branches.yml             .github/workflows/part4-validation.yml
          git commit -m "repo: consolidate demo work on demo-v1"

          # demo-v1 is an ancestor of this branch; preserve every commit by
          # promoting the consolidated head without squashing or rewriting.
          git push origin HEAD:demo-v1

          # Historical staging/integration refs are redundant after promotion.
          git push origin --delete             demo-v1-level22-encounter-staging             demo-v1-level22-inventory-staging             demo-v1-level22-story-staging             demo-v1-level22-world-staging             demo-v1-npc-catalog-staging             demo-v1-part4-integration             demo-v1-part4-live-sim             demo-v1-part4-projection

          # Delete the temporary source branch last, after demo-v1 is safe.
          git push origin --delete demo-v1-part4-live-sim-ci
