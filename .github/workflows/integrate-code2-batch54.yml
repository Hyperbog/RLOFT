# retrigger after cumulative-assert fix
name: Integrate CODE.2 batch 54
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch54.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch54.zb64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'c0967d5e896c0019f952ee390eed00824cb6f7f290693a4f799efaae453a95a3'
          text=raw.decode()
          assert 'function_273f0' in text and 'function_27ecc' in text and '==2797u);' in text
          print('batch54 payload OK',len(raw))
          PY
      - name: Apply Batch 54
        run: python Code2/integrate_batch54.py
      - name: Advance cumulative translated assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Code2/Code2.cpp')
          s=p.read_text()
          old='''static_assert(kVerifiedTranslatedBytes == 159155u +
              (0x273E7u-0x26018u));'''
          new='''static_assert(kVerifiedTranslatedBytes == 159155u +
              (0x273E7u-0x26018u) + 2797u);'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 167023u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 3537u;' in c
          assert '(0x273E7u-0x26018u) + 2797u);' in c
          assert 'static_assert(0x274A2u-0x273F0u==178u);' in c
          assert 'static_assert(0x27F23u-0x27ECCu==87u);' in c
          assert '==2797u);' in c
          assert '273E7..273EF | alignment | 9' in l
          assert '27F23..27F23 | alignment | 1' in l
          assert '**170,560 / 239,698 = 71.1562% (71.16%)**' in p
          assert '**69,138**' in p
          assert 'next instruction-owned routine begins at `27F24`' in p
          assert '## CODE.2 Batch 54 checkpoint' in a
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              x,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-x+1==n,(line,z-x+1)
              total+=n
          assert total==3537,total
          print('batch54 accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary staging files
        run: |
          rm -f Code2/batch54.zb64 Code2/integrate_batch54.py .github/workflows/integrate-code2-batch54.yml .github/workflows/add-code2-interruption-recovery.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name); p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit Batch 54
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 54'
          git push origin HEAD:code1-decompilation
