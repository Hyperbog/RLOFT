name: Integrate CODE.2 batch 54
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch54.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch54.zb64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'c0967d5e896c0019f952ee390eed00824cb6f7f290693a4f799efaae453a95a3'
          text=raw.decode()
          assert 'function_273f0' in text and 'function_27ecc' in text and '==2797u);' in text
          print('batch54 payload OK',len(raw))
          PY
      - name: Apply Batch 54
        run: python Code2/integrate_batch54.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 167023u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 3537u;' in c
          assert 'static_assert(0x274A2u-0x273F0u==178u);' in c
          assert 'static_assert(0x27F23u-0x27ECCu==87u);' in c
          assert '==2797u);' in c
          assert '273E7..273EF | alignment | 9' in l
          assert '27F23..27F23 | alignment | 1' in l
          assert '**170,560 / 239,698 = 71.1562% (71.16%)**' in p
          assert '**69,138**' in p
          assert 'next instruction-owned routine begins at `27F24`' in p
          assert '## CODE.2 Batch 54 checkpoint' in a
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              x,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-x+1==n,(line,z-x+1)
              total+=n
          assert total==3537,total
          print('batch54 accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary staging files
        run: |
          rm -f Code2/batch54.zb64 Code2/integrate_batch54.py .github/workflows/integrate-code2-batch54.yml .github/workflows/add-code2-interruption-recovery.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name); p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit Batch 54 and refresh resume checkpoint
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 54'
          BATCH_SHA=$(git rev-parse HEAD)
          python - "$BATCH_SHA" <<'PY'
          from pathlib import Path
          import sys
          batch=sys.argv[1]
          text=f'''# CODE.2 resume checkpoint

This file is a durable handoff anchor. Read it together with `INTERRUPTION_RESUME_PROTOCOL.md`, `PROGRESS.md`, `RESIDUAL_LEDGER.md`, and the live `Code2.cpp`. If anything here disagrees with live repository/binary evidence, live evidence wins and this file must be corrected before forward accounting.

## Last committed substantive decompilation state

- Last substantive batch commit: `{batch}` — `Integrate CODE.2 decompilation batch 54`.
- Verified translated instruction bytes: **167,023**.
- Proven non-code/data bytes: **3,537**.
- Reconciled object bytes: **170,560 / 239,698 = 71.1562% (71.16%)**.
- Unresolved object bytes: **69,138**.
- Last integrated instruction ownership unit: `273F0..27F22`.
- `27F23` is proven one-byte NOP alignment and is already counted as non-code.
- Next independently decoded instruction boundary: **`27F24`**.

## Immutable identity

- `CODE.2` SHA-256: `853e0a4dfcabebcfeecb975cf2a92b92eb4d94806d835ad30a0bab3e265bd314`.
- Object-1 SHA-256: `014952c4f003c548d928984825bab57dff54ce962dbfae21d7260f19fd3a62f3`.
- Object-1 file start: `0x3AF24`.
- Object-1 length: `0x3A852`.
- Address convention: reconstruction addresses are object-relative offsets. For extracted-object `objdump -b binary`, use the tracked address directly; do not add `0x10000`.

## Mandatory overlap anchor for next resume

Re-disassemble at minimum `27ECC..27FAC` from freshly regenerated object 1 before doing new work.

- Window: object-relative `[0x27ECC, 0x27FAC)` — 224 bytes.
- SHA-256: `f0c5c69d10099faf0bd6bdfd6445aad71f344910be9c4c5eec5684bd41df9dff`.
- Narrow boundary window `[0x27EF9, 0x27F59)` — 96 bytes.
- Narrow SHA-256: `f98cffdd659e2a7eba5f4a846883c0d46a2652ad263c9c1a91718e3d84467619`.
- Narrow boundary bytes:
  `ff356cee0000e86ae7000083c4040fb70568ee000050e8d48e0000c70540ee00000000000083c4045bc39053565755833d40ee0000000f84b4000000803d70ee0000000f84a7000000ff3544ee0000ff742418e84b73000083c4088d70048b28`

Interpretation to re-prove on resume, not merely trust: `27ECC` is the final Batch-54 teardown routine; it returns at `27F22`; `27F23` is NOP alignment; `27F24` begins the next routine with `PUSH EBX / PUSH ESI / PUSH EDI / PUSH EBP`.

## Interrupted/in-progress state

**UNCOUNTED / NOT COMMITTED:** no Batch 55 bytes are authorized by this checkpoint. Any analysis beyond `27F23` must be revalidated against the overlap before counting.

## Resume rule

Do not rework Batch 54 merely because the overlap is re-disassembled. Verify the overlap and accounting, then proceed strictly forward from `27F24`. If any overlap/hash/accounting mismatch appears, freeze forward progress and repair the prior batch first.
'''
          Path('Code2/RESUME_CHECKPOINT.md').write_text(text)
          PY
          git add Code2/RESUME_CHECKPOINT.md
          git commit -m 'Refresh CODE.2 resume checkpoint after batch 54'
          git push origin HEAD:code1-decompilation
