name: Integrate CODE.2 Batch 99
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch99.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 99
        run: |
          git merge-base --is-ancestor cc99b2d98e20109e3efef7ecfb9472ab7c4759e1 HEAD
          test "$(git hash-object Code2/.batch99.fragment.cpp)" = "6209816c87786943f83c4365294810d989d57afb"
          test "$(git hash-object Code2/.batch99_integrate.py)" = "ef14a0651daa980fbcbc786a3e39eed3cfd8c4be"
          grep -F 'static_assert(0x33AF3u-0x33AA0u==83u);' Code2/.batch99.fragment.cpp
          grep -F 'static_assert(0x33B42u-0x33AF4u==78u);' Code2/.batch99.fragment.cpp
      - name: Integrate Batch 99
        run: python Code2/.batch99_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch99_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime99Boundary','function_33aa0','function_33af4','regs[5]=real_mode_frame','frame+0x22u','0x000053C1u']:
              assert x in c,x
          assert '33AF3..33AF3 | alignment | 1' in l
          assert '33B42..33B43 | alignment | 2' in l
          assert '218,720 / 239,698 = 91.2482% (91.25%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 99
        run: |
          cp Code2/.batch99_integrate.py /tmp/batch99_integrate.py
          rm -f Code2/.batch99.fragment.cpp Code2/.batch99_integrate.py .github/workflows/integrate-code2-batch99.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 99"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch99_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`33B44`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 99"
          git push origin HEAD:code1-decompilation
