name: Integrate CODE.2 batch 24
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch24.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 24
        run: python3 Code2/integrate_batch24.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 81609u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1499u;' in cpp
          assert 'static_assert(0x11FAEu-0x11C3Cu==882u);' in cpp
          assert 'static_assert(0x12986u-0x12724u==610u);' in cpp
          assert 'if(shift<8u)' in cpp
          assert 'while(shown<14u&&bit<=0x02000000u)' in cpp
          assert 'app24_replace_actor_bits' in cpp
          assert 'target==0x0F&&existing!=-1' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,z,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); z=int(z,16); n=int(n)
              assert z-a+1==n,(line,z-a+1,n)
              total+=n
          assert total==1499,total
          assert 81609+total==83108
          assert 239698-83108==156590
          assert '**83,108 / 239,698 = 34.6720% (34.67%)**' in prog
          print('CODE.2 batch 24 accounting verified: 81609 + 1499 = 83108')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch24.inc.cpp Code2/integrate_batch24.py .github/workflows/integrate-code2-batch24.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 24'
          git push origin code1-decompilation
