name: Integrate CODE.2 batch 33

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch33.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 33
        run: python Code2/.integrate_batch33.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 109352u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2172u;' in code
          assert '**109,352**' in progress and '**2,172**' in progress
          assert '**111,524 / 239,698 = 46.5269% (46.53%)**' in progress
          assert 'void function_18d90(Machine& m,Application33Boundary& b) noexcept' in code
          assert "if((*dg(m,0x165Cu+index)&0xE6u)!=0u)" in code
          assert 'return static_cast<s32>(biased)/14;' in code
          assert 'static constexpr u32 kFunction19464Dispatch[4]={0x194B5u,0x19529u,0x19644u,0x19688u};' in code
          assert 'if(event!=0u&&static_cast<u32>(current)<=3u)' in code
          assert 'page=(page&0xFFFFFF00u)|static_cast<u8>(static_cast<u8>(page)^1u);' in code
          assert 'static_assert(0x19886u-0x197B8u==206u);' in code
          assert '19454..19463 | table | 16' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2172,total
          assert 109352+2172==111524
          assert 239698-111524==128174
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch33_fragment.cpp.gz.b64 Code2/.integrate_batch33.py .github/workflows/integrate-code2-batch33.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 33"
          git push origin HEAD:code1-decompilation
