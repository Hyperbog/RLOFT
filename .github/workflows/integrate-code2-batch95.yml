name: Integrate CODE.2 Batch 95
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch95.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 95
        run: |
          git merge-base --is-ancestor 924a0aba1dbeaebd85c7e3b68e4ae7242cbaf99c HEAD
          test "$(git hash-object Code2/.batch95.fragment.cpp)" = "66bc8b8512da167f35a8d86de0d9e60a4accd932"
          test "$(git hash-object Code2/.batch95_integrate.py)" = "371ccc7c766a0234ae4dd61696ac9792866d8792"
          grep -F 'static_assert(0x339A2u-0x3395Cu==70u);' Code2/.batch95.fragment.cpp
      - name: Integrate Batch 95
        run: python Code2/.batch95_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch95_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_3395c','Runtime95Boundary','0x03C4u','function_33971','original_destination']:
              assert x in c,x
          assert '218,302 / 239,698 = 91.0738% (91.07%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 95
        run: |
          cp Code2/.batch95_integrate.py /tmp/batch95_integrate.py
          rm -f Code2/.batch95.fragment.cpp Code2/.batch95_integrate.py .github/workflows/integrate-code2-batch95.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 95"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch95_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`339A2`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 95"
          git push origin HEAD:code1-decompilation
