name: One-time verified branch retirement (2026-10-11)
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/branch-consolidation-once-20261011.yml']
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: rloft-one-time-branch-consolidation-20261011
  cancel-in-progress: false
jobs:
  archive-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Archive exact pinned refs and retire only proven redundant heads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const canonical = "code1-decompilation", disassembler = "disassembler-foundation";
            const active = new Set([
              canonical, "demo-v1", "native-engine", disassembler,
              "extractor-wpf-fluent", "DnD-Classics",
              "disassembler-g2-build-20261010-54247e"
            ]);
            // Reviewed via exact Oct 11 head + REST compare. No user project branches.
            const candidates = [
              ["native-engine-win64-build-20261011-0647","d71823f20c55170661a870b2506342f2f7222d84",canonical],
              ["native-assets-win64-20261011-1415-once","bb2e29f5a95208b52059c0b981085a6d4c54e373",canonical],
              ["native-browser-win64-20261011-1610-once","11865739a908a00473135aa81c1292335efca183",canonical],
              ["native-colors-win64-20261011-1730-once","14593e03e240847ede6b6efedaab2e2e916578de",canonical],
              ["native-complete-content-win64-20261011-once","2341129ef41aad5ac57f41944f41c7113333e55c",canonical],
              ["native-eh6-world-textures-win64-20261011-once","180f59a2a1b45d95bbfa74d688a7643dd7b4a067",canonical],
              ["native-fullbank-win64-20261011-once","e8b38433dc554261602808289a6d2ca9ec680180",canonical],
              ["native-palette-router-win64-20261011-once","91f8231b3d9490b491e8297dd98c98bfe75cbb51",canonical],
              ["native-raster-win64-20261011-1530-once","c10064f5e1500357940372305cc5302542ab9f00",canonical],
              ["disassembler-mz-desktop-build-20261010-244718","e5f520aa07e9394a11a2269ea2abc7323e50d3a4",disassembler],
              ["dosdis-windows-navigation-gate-20261011-9e1823","fb54de74c2874d48fca8b705dc138e439adf2005",disassembler],
              ["disassembler-g2-build-20261010","2945b1474289cb42c167000628255848b77b7896",disassembler],
              ["disassembler-g2-validation-20261010","5754331f44237c4f07aeb465d22facc753647cd7",disassembler],
              ["preservation-backup-code1-2026-10-07","373c7f10e6fc0f29c1e805125ef048150fcc7ba7",canonical]
            ];
            const prs = await github.paginate(github.rest.pulls.list,
              {owner,repo,state:"open",per_page:100});
            const headPrs = new Set(prs.filter(p=>p.head.repo &&
              p.head.repo.full_name===context.repo.owner+"/"+context.repo.repo)
              .map(p=>p.head.ref));
            const plan = [];
            for (const [branch,sha,base] of candidates) {
              if (active.has(branch) || branch===base || headPrs.has(branch))
                throw new Error("Active or PR-attached branch refused: "+branch);
              const ref = await github.rest.git.getRef({owner,repo,ref:"heads/"+branch});
              if (ref.data.object.sha!==sha)
                throw new Error("Branch changed since audit: "+branch);
              const details=await github.rest.repos.getBranch({owner,repo,branch});
              if (details.data.protected)
                throw new Error("Protected branch refused: "+branch);
              const comparison=await github.rest.repos.compareCommits({owner,repo,base,head:branch});
              const ahead=comparison.data.ahead_by;
              const diffs=comparison.data.files || [];
              if (!(ahead===0 || (ahead===1 && diffs.length===1 &&
                    /^\.github\/workflows\/[^/]+\.yml$/.test(diffs[0].filename))))
                throw new Error("Unique work detected; not retiring "+branch+
                  " ahead="+ahead+" files="+diffs.map(f=>f.filename).join(","));
              const tag="archive/retired-20261011/"+branch;
              plan.push({branch,sha,tag,ahead,base});
              core.info("PRECHECK_OK "+branch+" SHA="+sha+" behind="+comparison.data.behind_by+
                        " ahead="+ahead);
            }
            // Phase 1: create and re-read every recovery tag BEFORE deleting any branch.
            for (const x of plan) {
              try {
                const old=await github.rest.git.getRef({owner,repo,ref:"tags/"+x.tag});
                if(old.data.object.sha!==x.sha)
                  throw new Error("Recovery tag already points elsewhere: "+x.tag);
              } catch (err) {
                if(err.status!==404) throw err;
                await github.rest.git.createRef({owner,repo,
                  ref:"refs/tags/"+x.tag,sha:x.sha});
              }
              const t=await github.rest.git.getRef({owner,repo,ref:"tags/"+x.tag});
              if(t.data.object.sha!==x.sha) throw new Error("Recovery tag failed: "+x.tag);
              core.info("ARCHIVED "+x.tag+" "+x.sha);
            }
            // Phase 2: guarded deletion, no force update and no unrelated refs.
            for (const x of plan) {
              const present=await github.rest.git.getRef({owner,repo,ref:"heads/"+x.branch});
              if(present.data.object.sha!==x.sha)
                throw new Error("Branch moved after preflight: "+x.branch);
              await github.rest.git.deleteRef({owner,repo,ref:"heads/"+x.branch});
              core.info("RETIRED "+x.branch+" recover=refs/tags/"+x.tag);
            }
            core.summary.addHeading("Verified one-shot branch consolidation")
              .addRaw("Preserved all 14 branch tips as exact SHA recovery tags; retired "+
                     plan.length+" redundant branches. Active project branches untouched.")
              .write();
