name: Integrate CODE.2 Batch 100
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch100.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 100
        run: |
          git merge-base --is-ancestor e8115ca2a5a781495360eded69fc6af08b7fa084 HEAD
          test "$(git hash-object Code2/.batch100.fragment.cpp)" = "d972c9eb4346071a28e14622ac663528c9f28628"
          test "$(git hash-object Code2/.batch100_integrate.py)" = "11099b8736d04db771b606732396fe88a5e94708"
          grep -F 'static_assert(0x33C90u-0x33B44u==332u);' Code2/.batch100.fragment.cpp
      - name: Integrate Batch 100
        run: python Code2/.batch100_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch100_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime100Boundary','function_33b44','int33_reset','call_30d80','call_33aa0','call_30de8','cleanup_mask','0x2B7A2u']:
              assert x in c,x
          assert '219,052 / 239,698 = 91.3867% (91.39%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 100
        run: |
          cp Code2/.batch100_integrate.py /tmp/batch100_integrate.py
          rm -f Code2/.batch100.fragment.cpp Code2/.batch100_integrate.py .github/workflows/integrate-code2-batch100.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 100"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch100_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`33C90`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 100"
          git push origin HEAD:code1-decompilation
