name: Integrate CODE.2 Batch 112
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch112.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 112
        run: |
          git merge-base --is-ancestor 303fc4b04ef8cbb01bce3753032b59fa7e1e69ac HEAD
          test "$(git hash-object Code2/.batch112.fragment.cpp)" = "893a8953f1808e2fd4cb3c78ea57b598918e3499"
          test "$(git hash-object Code2/.batch112_integrate.py)" = "8ec042eb0f6a04efd09e61dd0e2b88e63f4bdd4a"
          grep -F 'static_assert(0x3562Fu-0x35418u==535u);' Code2/.batch112.fragment.cpp
          grep -F 'AND DL,F0 supplies ZF if REP count is zero.' Code2/.batch112.fragment.cpp
          grep -F '3562F starts with POP EAX' Code2/.batch112.fragment.cpp
      - name: Integrate Batch 112
        run: python Code2/.batch112_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch112_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['Runtime112Boundary','function_35418','app112_seg8','app112_seg16','app112_seg32','app112_seg_store8','app112_seg_store16']:
              assert x in c,x
          assert 'constexpr u32 kVerifiedTranslatedBytes = 221173u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 4438u;' in c
          assert '225,611 / 239,698 = 94.1230% (94.12%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 112
        run: |
          cp Code2/.batch112_integrate.py /tmp/batch112_integrate.py
          rm -f Code2/.batch112.fragment.cpp Code2/.batch112_integrate.py .github/workflows/integrate-code2-batch112.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 112"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch112_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`3562F`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 112"
          git push origin HEAD:code1-decompilation
