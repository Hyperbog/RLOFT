name: Integrate CODE.2 batch 30

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch30.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 30
        run: python Code2/.integrate_batch30.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 99711u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1945u;' in code
          assert '**99,711**' in progress and '**1,945**' in progress
          assert '**101,656 / 239,698 = 42.4100% (42.41%)**' in progress
          assert 'const u32 group_base=actor+group*0x0Au;' in code
          assert 'const u32 v10=app30_read_handle_word(b,handle,0x10u);' in code
          assert 'if(b.call_288f0)b.call_288f0(v10);' in code
          assert 'store_le16(dg(m,0x2710Cu),static_cast<u16>(-w));' in code
          assert 'const u32 wrote=b.call_31304?b.call_31304(src,count,handle):0u;' in code
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,b,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert b-a+1==n,(line,b-a+1)
              total+=n
          assert total==1945,total
          assert 99711+1945==101656
          assert 239698-101656==138042
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.integrate_batch30.py .github/workflows/integrate-code2-batch30.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 30"
          git push origin HEAD:code1-decompilation
