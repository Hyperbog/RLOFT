name: Add CODE.2 interruption recovery protocol
on:
  push:
    paths:
      - '.github/workflows/add-code2-interruption-recovery.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Append durable interruption recovery protocol
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md')
          s=p.read_text()
          heading='## Interruption-safe continuation protocol'
          assert heading not in s
          protocol=r'''

## Interruption-safe continuation protocol

This protocol is mandatory after any timeout, context/thread limit, token limit, tool failure, user interruption, branch advance, or other loss of working continuity. The repository's committed state is the only durable truth. Chat memory, uncommitted analysis, temporary disassembly, staging payloads, and partially completed workflows are never counted as completed work.

### Resume gate — run before translating any new byte

1. Fetch the live `code1-decompilation` HEAD and identify the latest substantive CODE.2 integration/repair commit. If HEAD advanced since the interrupted work began, discard the stale continuation plan and re-anchor to the new HEAD.
2. Read the tail/current checkpoint in `Code2/PROGRESS.md`, `Code2/RESIDUAL_LEDGER.md`, this addendum, and the end of `Code2/Code2.cpp`. The frontier written in the committed checkpoint controls; do not resume from a frontier remembered only from chat.
3. Cross-check accounting before proceeding:
   - `kVerifiedTranslatedBytes` in `Code2.cpp` must match `PROGRESS.md`.
   - `kVerifiedNonCodeBytes` must equal the exact sum of ranges in `RESIDUAL_LEDGER.md` and match `PROGRESS.md`.
   - reconciled + unresolved must equal the fixed object-1 denominator `239,698` (`0x3A852`).
   Any mismatch is an integrity problem to repair before new translation.
4. Reverify immutable source identity before substantive work:
   - CODE.2 SHA-256: `853e0a4dfcabebcfeecb975cf2a92b92eb4d94806d835ad30a0bab3e265bd314`
   - object-1 SHA-256: `014952c4f003c548d928984825bab57dff54ce962dbfae21d7260f19fd3a62f3`
   - object-1 extraction is exactly file offset `0x3AF24`, length `0x3A852`.
5. Address convention is a hard invariant: disassembly addresses used by this project are **logical offsets inside extracted object 1**, beginning at zero. For a logical object offset `X`, the original CODE.2 file offset is `0x3AF24 + X`. Do **not** add the LX virtual base `0x10000` to an object offset before disassembly or labeling. The repaired Batch 52 error was caused by violating this distinction.
6. Regenerate fresh disassembly with an overlap window before the committed frontier. Check at least the previous `0x80` bytes, expanded as needed to include the prior instruction boundary/table tail, plus enough bytes after the frontier to establish the next entry. Compare the overlap against the committed C++/ledger/checkpoint:
   - last several instruction boundaries/opcodes/targets must agree;
   - any owned table tail must have the same entries and owner;
   - the first uncounted byte/object after the checkpoint must match the recorded next routine/table/pad.
   If the overlap does not agree exactly, stop forward translation and perform a boundary/accounting repair first.
7. Never tread over committed ground. New translated ranges must begin at the first genuinely uncounted instruction/object after the verified frontier. Previously counted bytes may be changed only by an explicit integrity-repair commit that subtracts/reclassifies the old accounting before adding corrected ownership.

### Interrupted staging/workflow rule

A staging commit, payload file, integration script, workflow file, queued/running/failed Actions job, or locally syntax-checked snippet does not establish completion. On resume, inspect the live commit history and workflow state:

- If a final `Integrate CODE.2 ...` or explicit repair commit exists and the temporary files were cleaned, use that commit as the new anchor.
- If only staging/retrigger commits exist, verify their payload against fresh binary evidence before resuming or replacing them. Never assume the intended integration happened.
- If a workflow failed after modifying a checkout but before push, those runner-local edits are nonexistent for continuation purposes.
- If the branch advanced independently, rebuild the candidate patch against current HEAD; never blindly replay a stale full-file replacement.

### Pre-commit gate for every resumed batch

Before committing, re-run exact range arithmetic and prove that instruction ranges and newly classified residual ranges are non-overlapping and account for exactly the advertised batch bytes. Recompute global totals from the committed prior checkpoint rather than from remembered intermediate numbers. Re-scan any new padding/table classification for direct control-flow targets and, where relevant, absolute references. Then run:

```sh
g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
git diff --check
```

The integration must update `Code2.cpp`, `PROGRESS.md`, `RESIDUAL_LEDGER.md` when residual classifications change, and this addendum's latest checkpoint. After push, fetch HEAD again and verify the final integration commit and recorded totals before reporting success.

### Required resume capsule in each substantive checkpoint

Every substantive batch checkpoint should leave enough durable state to recover without chat history: final commit identity (or an unambiguous batch number), exact translated ranges/byte count, exact newly proven non-code/data ranges/byte count, cumulative translated/non-code/reconciled/unresolved totals, sequential frontier, the exact next routine/table/object, important shared-tail/table ownership facts, and any deliberately unresolved nearby bytes. If work is interrupted before such a committed capsule exists, treat that work as untrusted staging and restart from the previous committed capsule using the overlap check above.
'''
          p.write_text(s.rstrip()+protocol+'\n')
          PY
      - name: Verify protocol anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          for needle in (
              '## Interruption-safe continuation protocol',
              'previous `0x80` bytes',
              'Do **not** add the LX virtual base `0x10000`',
              'Never tread over committed ground',
              'A staging commit, payload file, integration script, workflow file',
              'Required resume capsule in each substantive checkpoint'):
              assert needle in s, needle
          print('interruption recovery protocol present')
          PY
      - name: Clean workflow and validate diff
        run: |
          rm -f .github/workflows/add-code2-interruption-recovery.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md')
          p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit protocol
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Add CODE.2 interruption recovery protocol'
          git push origin HEAD:code1-decompilation
