name: Integrate CODE.2 Batch 79
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch79.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 79
        run: |
          test "$(git hash-object Code2/.batch79.fragment.cpp)" = "cfe3967f8c9e05df5b291672db37a26ccf535a4c"
          test "$(git hash-object Code2/.batch79_integrate.py)" = "4ce7a16a6e92f614e9aa1788b72ee0314ef19189"
          grep -F 'static_assert(0x3221Fu-0x32150u==207u);' Code2/.batch79.fragment.cpp
      - name: Integrate Batch 79
        run: python Code2/.batch79_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch79_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for a in ['function_32150','strength*(0x3F-peak)+0x1F','target==0 || v==0u']: assert a in c,a
          assert '3221F..3221F | alignment | 1' in l and '212,284 / 239,698 = 88.5631% (88.56%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 79
        run: |
          cp Code2/.batch79_integrate.py /tmp/batch79_integrate.py
          rm -f Code2/.batch79.fragment.cpp Code2/.batch79_integrate.py .github/workflows/integrate-code2-batch79.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 79"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch79_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`32220`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 79"
          git push origin HEAD:code1-decompilation
