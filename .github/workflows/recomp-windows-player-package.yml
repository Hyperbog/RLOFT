name: RLOFT Recomp Windows player engineering package

on:
  workflow_dispatch:
  push:
    branches: [Recomp]
    paths:
      - 'Recomp/src/**'
      - 'Recomp/CMakeLists.txt'
      - 'Recomp/cmake/**'
      - 'Recomp/tools/Launch-RLOFT-Level22.ps1'
      - 'Recomp/tools/Play-RLOFT-Level22.cmd'
      - 'Recomp/tools/release_package_gate.py'
      - 'Recomp/ACCEPTANCE_GATES.json'
      - '.github/workflows/recomp-windows-player-package.yml'
permissions:
  contents: read

concurrency:
  group: rloft-recomp-windows-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build source-labelled Windows native host and CD extractor
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Windows x64 source build
        shell: pwsh
        run: |
          cmake -S Recomp -B build/player -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
      - name: Build authentic source native host and extractor
        shell: pwsh
        run: |
          cmake --build build/player --config Debug --parallel 2 --target rloft_code2_level22_window rloft_gog_cd_extract rloft_original_code2_cine00_player
          if ($LASTEXITCODE -ne 0) { throw "Native source host or extractor compilation failed" }
      - name: Sparse-checkout original owner media for mandatory native gameplay regression
        uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: original-media
          sparse-checkout: |
            MASTER/Ravenloft - Strahd's Possession/RLOFT
            MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE01
            MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT/CINE00.ANM
            MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT/CINE12.ANM
            MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT/RES9
            MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT/RES10
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require real source F590 keys, two saved-world frames, and original portal cycles before shipping
        shell: pwsh
        timeout-minutes: 6
        run: |
          # A successful MSVC compile is not a working player. Test this
          # exact executable against original unmodified source media.
          $root = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT").Path
          $cd = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT").Path
          $saved23 = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/cloud_saves/RLOFT/SAVE01").Path
          $saved22 = (Resolve-Path (Join-Path $root 'SAVE01')).Path
          $exe = (Resolve-Path "build/player/Debug/rloft_code2_level22_window.exe").Path
          $cases = @(
            @{ mode='--smoke'; slot=''; witness='RLOFT_LEVEL22_NATIVE_HOST_SMOKE_PASS' },
            @{ mode='--smoke-key-map'; slot=''; witness='RLOFT_30B40_F590_PHYSICAL_KEY_SOURCE_PASS' },
            @{ mode='--smoke-save'; slot=$saved22; witness='CODE2_07938_RETAINED_SAVED_LEVEL_1FC14_30B40_FULL_FRAME_PASS source_saved_restore=YES original_level=22 ' },
            @{ mode='--smoke-save'; slot=$saved23; witness='CODE2_07938_RETAINED_SAVED_LEVEL_1FC14_30B40_FULL_FRAME_PASS source_saved_restore=YES original_level=23 ' },
            @{ mode='--smoke-portal'; slot=''; witness='RLOFT_2D3D8_AUTHENTIC_PORTAL_NATIVE_SMOKE_PASS' }
          )
          foreach ($test in $cases) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $exe
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $argsList = @('--root',$root,'--cd-root',$cd,$test.mode)
            if ($test.slot) { $argsList += $test.slot }
            foreach ($arg in $argsList) { [void]$info.ArgumentList.Add($arg) }
            $p = [Diagnostics.Process]::Start($info)
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            try {
              $exited = $p.WaitForExit(90000)
              if (-not $exited) {
                $p.Kill($true)
                $p.WaitForExit()
              }
              $all = @($out.GetAwaiter().GetResult(),$err.GetAwaiter().GetResult()) -join "`n"
              $passed = $exited -and $p.ExitCode -eq 0 -and $all.Contains($test.witness)
              Write-Host "RLOFT_PLAYER_NATIVE_GATE mode=$($test.mode) slot=$($test.slot) passed=$passed exit=$($p.ExitCode)"
              if (-not $passed) {
                @($all -split "`r?`n" | Where-Object {
                  $_ -match 'SOURCE_STOP|NATIVE_HOST_FAIL|PHYSICAL_SCAN|07938|PORTAL|F590|FAIL'
                }) | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
                throw "Native original source player acceptance failed: $($test.mode)"
              }
            } finally {
              $p.Dispose()
            }
          }
      - name: Require authentic retained first-boot CODE.2 cinematic source frontier
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Stage a private copy, removing only CHARS to reproduce the
          # source 31218 missing-party branch. Original media is read-only.
          $root = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT").Path
          $cd = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT").Path
          $scratch = Join-Path $env:RUNNER_TEMP 'RLOFT-original-first-boot'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          Get-ChildItem -LiteralPath $root -File |
            Where-Object { $_.Name -ne 'CHARS' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $scratch }
          if (Test-Path -LiteralPath (Join-Path $scratch 'CHARS')) {
            throw 'First-boot diagnostic unexpectedly retained CHARS'
          }
          $exe = (Resolve-Path "build/player/Debug/rloft_code2_level22_window.exe").Path
          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $exe
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          foreach ($arg in @('--root',$scratch,'--cd-root',$cd,'--smoke-intro')) {
            [void]$info.ArgumentList.Add($arg)
          }
          $p = [Diagnostics.Process]::Start($info)
          try {
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            $exited = $p.WaitForExit(420000)
            if (-not $exited) {
              $p.Kill($true)
              $p.WaitForExit()
            }
            $all = [string]::Join([Environment]::NewLine, @($out.GetAwaiter().GetResult(),$err.GetAwaiter().GetResult()))
            $passed = $exited -and $p.ExitCode -eq 0 -and
              $all.Contains('CODE2_LIVE_20440_CINE00_19464_RENDER_INPUT_GATE_PASS') -and
              $all.Contains('CODE2_ORIGINAL_19464_RENDER_AND_INPUT_PASS') -and
              $all.Contains('CODE2_ORIGINAL_19464_SOURCE_TITLE_PRESENT') -and
              $all.Contains('cine00_frames=405')
            Write-Host "CODE2_RETAINED_INTRO_REAL_MEDIA_GATE passed=$passed exited=$exited code=$($p.ExitCode)"
            if (-not $passed) {
              @($all -split '[\r\n]+' | Where-Object {
                $_ -match 'LIVE_CODE2_SOURCE_STOP|CODE2_RETAINED_19888|CODE2_RETAINED_CINE_ORIGINAL_FRAMES|CODE2_LIVE_20440|CODE2_ORIGINAL_19464|CODE2_FIRST_BOOT_RESOURCE_PREFLIGHT|SOURCE_STAGE|ERROR|FAIL|ORIGINAL_INTRO'
              }) | Select-Object -Last 50 | ForEach-Object { Write-Host $_ }
              throw 'Real retained CODE.2 19888 CINE00 startup frontier failed'
            }
          } finally { $p.Dispose() }
      - name: Run authentic CINE00 through compiled original CODE.2 dispatch
        shell: pwsh
        timeout-minutes: 5
        run: |
          # CINE00 is read-only from the original preservation branch.
          # Neither cinematic media nor player frames leave this runner.
          $cine = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/CD_Extracted/RLOFT/CINE00.ANM").Path
          $text = (Resolve-Path "original-media/MASTER/Ravenloft - Strahd's Possession/RLOFT/T").Path
          $exe = (Resolve-Path "build/player/Debug/rloft_original_code2_cine00_player.exe").Path
          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $exe
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          foreach ($arg in @($cine,$text)) { [void]$info.ArgumentList.Add($arg) }
          $p = [Diagnostics.Process]::Start($info)
          try {
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            $exited = $p.WaitForExit(120000)
            if (-not $exited) {
              $p.Kill($true)
              $p.WaitForExit()
            }
            $all = @($out.GetAwaiter().GetResult(),$err.GetAwaiter().GetResult()) -join "`n"
            $passed = $exited -and $p.ExitCode -eq 0 -and $all.Contains('CODE2_CINE00_ORIGINAL_13834_PASS frames=405')
            Write-Host "ORIGINAL_CODE2_CINE00_SOURCE_GATE passed=$passed exited=$exited code=$($p.ExitCode)"
            if (-not $passed) {
              @($all -split "`r?`n" | Where-Object { $_ -match 'FAIL|ERROR|CODE2_CINE00' }) |
                Select-Object -Last 12 | ForEach-Object { Write-Host $_ }
              throw 'Original CODE.2 CINE00 source playback did not pass'
            }
          } finally { $p.Dispose() }
      - name: Package only source executables and scripts
        shell: pwsh
        run: |
          $out = "build/player/RLOFT-Recomp-Player"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($name in @('rloft_code2_level22_window.exe','rloft_gog_cd_extract.exe','rloft_original_code2_cine00_player.exe')) {
            $src = Join-Path 'build/player/Debug' $name
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { throw "Missing build target: $src" }
            Copy-Item -LiteralPath $src -Destination $out
          }
          foreach ($name in @('Launch-RLOFT-Level22.ps1','Play-RLOFT-Level22.cmd')) {
            Copy-Item -LiteralPath (Join-Path 'Recomp/tools' $name) -Destination $out
          }
          @(
            "SOURCE_COMMIT=${{ github.sha }}"
            'BRANCH=Recomp'
            'EXPERIMENTAL original CODE.2 Windows host, not a completed game.'
            'The original 07938 Level23 saved-load sentinel 0xFFFFFFFF remains an open native acceptance gate.'
            'Download your own original GOG game; no commercial resources, saves, media, palettes or pictures are included.'
            'Run Play-RLOFT-Level22.cmd or Launch-RLOFT-Level22.ps1 with -GameFolder and optionally -CdRoot.'
            'Original source CINE00 diagnostic: rloft_original_code2_cine00_player.exe CINE00.ANM T [LAST_FRAME.ppm].'
            'CINE00 diagnostic is silent, does not draw subtitle glyphs, and does not enter the title menu.'
            'Full portal framebuffer and independent original DOS parity are NOT certified.'
          ) | Set-Content -Path (Join-Path $out 'README-BUILD.txt')
          Get-ChildItem -File $out | Sort-Object Name | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant()) *$([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Path (Join-Path $out 'SHA256SUMS.txt')
          # Actions artifacts download as a ZIP already. Upload contents
          # directly to avoid an unnecessary ZIP nested inside another ZIP.
          Write-Host "BUILD_SOURCE_SHA=${{ github.sha }} package_dir=$out"
      - name: Set up Python for source-only package audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify package file whitelist, manifests and preview-only status
        shell: pwsh
        run: |
          python Recomp/tools/release_package_gate.py --package build/player/RLOFT-Recomp-Player --mode engineering
          if ($LASTEXITCODE -ne 0) { throw "Source-only Windows package audit failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: RLOFT-Recomp-Player-Windows-${{ github.run_number }}
          path: build/player/RLOFT-Recomp-Player/*
          if-no-files-found: error
          retention-days: 30
