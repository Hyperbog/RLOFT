name: Integrate CODE.2 Batch 64

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch64.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          raw=base64.b64decode(Path('Code2/.batch64.fragment.b64').read_text().strip())
          assert hashlib.sha256(raw).hexdigest() == 'bdd7582aa128422d39d8a022276dac204d43a02ddb5af9e772ac852541b490e4'
          text=raw.decode()
          assert '// Batch 64: 2B6D0..2C293' in text
          assert '==3005u);' in text
          PY

      - name: Integrate Batch 64
        run: python Code2/.batch64_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch64_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert all(x in cpp for x in ['function_2b6d0','function_2bba0','function_2bdf4','function_2bfec','function_2c230'])
          assert '0x27148u+load_le32(dg(m,0xC050u))*0x2260u+cursor*0x16u' in cpp
          assert 'const u32 meta_after=load_le32(dg(m,0x255D8u))+type_after*0x41u;' in cpp
          assert 'const u32 meta1=load_le32(dg(m,0x22234u))+type1*7u;' in cpp
          assert '2C22F..2C22F | alignment | 1' in led
          assert '187,824 / 239,698 = 78.3586% (78.36%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 64
        run: |
          cp Code2/.batch64_integrate.py /tmp/batch64_integrate.py
          rm -f Code2/.batch64.fragment.b64 Code2/.batch64_integrate.py .github/workflows/integrate-code2-batch64.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 64"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch64_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`2C294`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 64"
          git push origin HEAD:code1-decompilation
