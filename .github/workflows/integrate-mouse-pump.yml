name: Integrate verified mouse pump
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-mouse-pump.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Fold verified region
        run: python3 Code1/integrate_mouse_pump.py
      - name: Syntax check unified translation
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Remove one-shot integration machinery
        run: rm Code1/integrate_mouse_pump.py .github/workflows/integrate-mouse-pump.yml
      - name: Commit integrated translation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Integrate verified CODE.1 mouse pump and reconcile staging ledger'
          git push origin code1-decompilation
