name: Integrate CODE.2 batch 42

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch42.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 42
        run: python Code2/.integrate_batch42.py
      - name: Verify accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 128548u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2456u;' in code
          assert '**131,004 / 239,698 = 54.6538% (54.65%)**' in progress
          assert 'void function_1ce68(Machine& m,Application42Boundary& b) noexcept' in code
          assert 'if(load_le32(dg(m,0xBF44u))!=0x12u)' in code
          assert 'const bool any0=any1b?false:(function_1ca2c(m,0u)!=F);' in code
          assert 'const u32 slot=b.call_14a60?b.call_14a60(0x111Cu):0u;' in code
          assert '*dg(m,0x22211u)=static_cast<u8>(*dg(m,0x22211u)|0x04u);' in code
          assert '*dg(m,0x22213u)=static_cast<u8>(*dg(m,0x22213u)|0x10u);' in code
          assert '*dg(m,0x22217u)=static_cast<u8>(*dg(m,0x22217u)|0x01u);' in code
          assert 'app42_item_test(b,0x74u)!=0u&&app42_item_test(b,0x5Cu)!=0u&&' in code
          assert 'return 0x6Fu+((r+r)>>15u);' in code
          assert 'case 0x270Fu:' in code
          assert 'static_assert(0x1E4A0u-0x1CE68u==5688u);' in code
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2456,total
          assert 128548+2456==131004
          assert 239698-131004==108694
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch42.zb64 Code2/.integrate_batch42.py .github/workflows/integrate-code2-batch42.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 42"
          git push origin HEAD:code1-decompilation
