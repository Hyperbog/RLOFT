name: Integrate CODE.2 Batch 78
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch78.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 78
        run: |
          test "$(git hash-object Code2/.batch78.fragment.cpp)" = "28a356964e14d2d4c0472e2cc406b9654dff4654"
          test "$(git hash-object Code2/.batch78_integrate.py)" = "c4b9d2d5686d6cd5b410de965fd67a69fd7d9f95"
          grep -F 'static_assert(0x32142u-0x3210Fu==51u);' Code2/.batch78.fragment.cpp
      - name: Integrate Batch 78
        run: python Code2/.batch78_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch78_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for a in ['function_320f8','function_3210f','state+0x10u','0x320F8u']: assert a in c,a
          assert '32142..3214F | padding | 14' in l
          assert '212,076 / 239,698 = 88.4763% (88.48%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 78
        run: |
          cp Code2/.batch78_integrate.py /tmp/batch78_integrate.py
          rm -f Code2/.batch78.fragment.cpp Code2/.batch78_integrate.py .github/workflows/integrate-code2-batch78.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 78"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch78_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`32150`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 78"
          git push origin HEAD:code1-decompilation
