name: Integrate CODE.2 Batch 94
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch94.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 94
        run: |
          git merge-base --is-ancestor 8a172ee82e312274df35b5fdca6631abdcf6458a HEAD
          test "$(git hash-object Code2/.batch94.fragment.cpp)" = "4319cf4d61b4aefad019febee7715d54904f9a70"
          test "$(git hash-object Code2/.batch94_integrate.py)" = "763cd77130ccd23bc234d9e36cc83f1520b3e688"
          grep -F 'static_assert(0x3395Au-0x338C8u==146u);' Code2/.batch94.fragment.cpp
      - name: Integrate Batch 94
        run: python Code2/.batch94_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch94_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_338c8','Application94Boundary','stack_local_8_residue','iterations==0u','phase>>16','0x50u*start']:
              assert x in c,x
          assert '3395A..3395B | alignment | 2' in l
          assert '218,232 / 239,698 = 91.0446% (91.04%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 94
        run: |
          cp Code2/.batch94_integrate.py /tmp/batch94_integrate.py
          rm -f Code2/.batch94.fragment.cpp Code2/.batch94_integrate.py .github/workflows/integrate-code2-batch94.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 94"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch94_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`3395C`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 94"
          git push origin HEAD:code1-decompilation
