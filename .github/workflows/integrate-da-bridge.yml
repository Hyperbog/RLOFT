name: Integrate verified DA bridge
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-da-bridge.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Fold verified bridge
        run: python3 Code1/integrate_da_bridge.py
      - name: Syntax check unified translation
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Remove integrated staging and one-shot machinery
        run: rm Code1/DosMemoryNext.staging.cpp Code1/integrate_da_bridge.py .github/workflows/integrate-da-bridge.yml
      - name: Commit integrated translation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Integrate verified CODE.1 DA bridge'
          git push origin code1-decompilation
