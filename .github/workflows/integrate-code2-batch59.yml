# final transport retry: reconstruct payload from two short chunks
name: Integrate CODE.2 batch 59
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch59.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Reassemble staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('Code2/batch59.part1').read_text().strip()
          b=Path('Code2/batch59.part2').read_text().strip()
          assert len(a)==1526 and len(b)==1526
          Path('Code2/batch59.zb64').write_text(a+b+'\n')
          PY
      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch59.zb64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'b04032f9e8f9053c97626ac9af27c70ae291ae1cae3ee33ca0029446fa0a39eb'
          t=raw.decode(); assert 'function_29cec' in t and 'function_2a104' in t and '==1048u);' in t
          print('batch59 payload OK',len(raw))
          PY
      - name: Apply Batch 59
        run: python Code2/integrate_batch59.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text(); l=Path('Code2/RESIDUAL_LEDGER.md').read_text(); p=Path('Code2/PROGRESS.md').read_text(); a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 175537u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 3711u;' in c
          assert '+ 939u + 1048u);' in c
          assert 'static_assert(0x29EAAu-0x29CECu==446u);' in c
          assert 'static_assert(0x2A114u-0x2A104u==16u);' in c
          assert '==1048u);' in c
          assert '29EAA..29EAB | alignment | 2' in l and '2A103..2A103 | alignment | 1' in l
          assert '**179,248 / 239,698 = 74.7808% (74.78%)**' in p
          assert '**60,450**' in p and 'frontier is now `2A114`' in p
          assert '## CODE.2 Batch 59 checkpoint' in a
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line); assert m,line
              x,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3)); assert z-x+1==n,(line,z-x+1); total+=n
          assert total==3711,total
          print('batch59 accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary staging files
        run: |
          rm -f Code2/batch59.zb64 Code2/batch59.part1 Code2/batch59.part2 Code2/integrate_batch59.py .github/workflows/integrate-code2-batch59.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name); p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit Batch 59
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 59'
          git push origin HEAD:code1-decompilation
