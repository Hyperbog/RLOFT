# definition guard repaired v2
name: Integrate CODE.2 batch 58
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch58.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch58.zb64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'bd7bacc8dd49ca3e848a15c540f78cf196b75ee69864d4ec1cd9d6f6fd347cce'
          t=raw.decode(); assert 'function_29930' in t and 'function_29ca0' in t and '==939u);' in t
          print('batch58 payload OK',len(raw))
          PY
      - name: Repair definition-only staging guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Code2/integrate_batch58.py')
          s=p.read_text()
          old="assert 'u32 function_29930(' not in c"
          new="assert '[[nodiscard]] u32 function_29930(' not in c"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply Batch 58
        run: python Code2/integrate_batch58.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text(); l=Path('Code2/RESIDUAL_LEDGER.md').read_text(); p=Path('Code2/PROGRESS.md').read_text(); a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 174489u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 3695u;' in c
          assert '+ 1281u + 939u);' in c
          assert 'static_assert(0x29A84u-0x29930u==340u);' in c
          assert 'static_assert(0x29CE9u-0x29CA0u==73u);' in c
          assert '==939u);' in c
          assert '29B33..29B36 | table | 4' in l
          assert '**178,184 / 239,698 = 74.3369% (74.34%)**' in p
          assert '**61,514**' in p and 'frontier is now `29CEC`' in p
          assert '## CODE.2 Batch 58 checkpoint' in a
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line); assert m,line
              x,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3)); assert z-x+1==n,(line,z-x+1); total+=n
          assert total==3695,total
          print('batch58 accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary staging files
        run: |
          rm -f Code2/batch58.zb64 Code2/integrate_batch58.py .github/workflows/integrate-code2-batch58.yml .github/workflows/inspect-code2-batch58.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name); p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit Batch 58
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 58'
          git push origin HEAD:code1-decompilation
