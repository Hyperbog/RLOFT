name: Integrate CODE.2 batch 25
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch25.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 25
        run: python3 Code2/integrate_batch25.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 85661u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1579u;' in cpp
          assert 'static_assert(0x139ABu-0x13834u==375u);' in cpp
          assert 'return (pos&0xFFFFFF00u)|value;' in cpp
          assert 'return (p&0xFFFF0000u)|load_le16(dg(m,p));' in cpp
          assert 'const u32 left=load_le32(dg(m,0x7F9Cu))-1u;' in cpp
          assert 'case 9u:' in cpp
          assert 'CINE00.ANM' in led
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,z,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); z=int(z,16); n=int(n)
              assert z-a+1==n,(line,z-a+1,n)
              total+=n
          assert total==1579,total
          assert 85661+total==87240
          assert 239698-87240==152458
          assert '**87,240 / 239,698 = 36.3958% (36.40%)**' in prog
          print('CODE.2 batch 25 accounting verified: 85661 + 1579 = 87240')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch25.zb64 Code2/integrate_batch25.py .github/workflows/integrate-code2-batch25.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 25'
          git push origin code1-decompilation
