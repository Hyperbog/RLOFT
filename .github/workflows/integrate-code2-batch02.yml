name: Integrate CODE.2 batch 02
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch02.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 02
        run: python3 Code2/integrate_batch02.py
      - name: Verify markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Code2/Code2.cpp').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 7139u;' in s
          for x in ['function_002a8','function_006c0','function_00700','function_0083c','function_29930','function_29b40','function_2a1e8','function_2a308']:
              assert x in s,x
          assert 'static_assert(0x006B9u-0x002A8u==1041u);' in s
          assert 'static_assert(0x29C9Eu-0x29B40u==350u);' in s
          assert 'static_assert(0x2A380u-0x2A308u==120u);' in s
          print('CODE.2 batch 02 accounting marker: 7139 / 239698')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Whitespace check
        run: git diff --check
      - name: Commit verified integration
        run: |
          rm Code2/batch02_append.inc Code2/integrate_batch02.py .github/workflows/integrate-code2-batch02.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 02'
          git push origin HEAD:code1-decompilation
