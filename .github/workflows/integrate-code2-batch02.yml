name: Integrate CODE.2 batch 02
# retry after cumulative static-assert fix
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch02.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 02
        run: |
          python3 .github/code2_batch02.py
          python3 .github/code2_batch02_fix.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 8632u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 58u;' in cpp
          for needle in ['void function_002a8','function_29930','function_29cec','function_2a380','function_2a8a0']:
              assert needle in cpp, needle
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n
              total+=n
          assert total==58,total
          assert 8632+58+231008==239698
          print('CODE.2 batch 02 accounting verified: 8632 + 58 + 231008 = 239698')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Commit integrated batch
        run: |
          rm -f .github/code2_batch02.py .github/code2_batch02_fix.py Code2/batch02_append.inc Code2/integrate_batch02.py .github/workflows/integrate-code2-batch02.yml
          git config user.name "Hyperbog"
          git config user.email "47282882+Hyperbog@users.noreply.github.com"
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 02"
          git push origin HEAD:code1-decompilation
