name: Native Engine ORIGINAL ASSETS - Windows x64 (manual)

# Standalone native replacement engine. No DemoV1 gameplay, DOS binaries,
# or original media packaged. Manual per-run authorization only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-engine-original-assets-windows
  cancel-in-progress: false

jobs:
  native-asset-loader:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out independent native-engine branch
        uses: actions/checkout@v4
        with:
          ref: native-engine
          persist-credentials: false
      - name: Install Python for contract fixture
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent GOG ISO/RES/COLORS Windows asset engine
        shell: pwsh
        run: |
          & ./NativeEngine/Windows/Build-NativeAssets-Windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish original-data-free native asset preview
        uses: actions/upload-artifact@v4
        with:
          name: RLOFT-NativeEngine-Windows-x64-ASSET-PREVIEW
          path: |
            NativeEngine/Windows/dist/RLOFT-NativeEngine-Windows-x64-ASSET-PREVIEW.zip
            NativeEngine/Windows/dist/RLOFT-NativeEngine-Windows-x64-ASSET-PREVIEW.zip.sha256
          if-no-files-found: error
          retention-days: 30
