name: Integrate CODE.2 batch 35

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch35.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 35
        run: python Code2/.integrate_batch35.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 114822u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2246u;' in code
          assert '**114,822**' in progress and '**2,246**' in progress
          assert '**117,068 / 239,698 = 48.8398% (48.84%)**' in progress
          assert 'void function_1a288(Machine& m,Application35Boundary& b) noexcept' in code
          assert 'const u32 other=app35_xor_low16(page,1u); // encoded XOR SI,1 preserves the upper 16 bits.' in code
          assert 'const u16 depth=static_cast<u16>(load_le16(dg(m,0x9E37u))-1u); // encoded DEC occurs before the JNE.' in code
          assert '0x1ADBBu,0x1ADCBu,0x1ADD0u,0x1ADC6u,' in code
          assert 'store_le16(dg(m,0xA6BCu),static_cast<u16>(index+3u));' in code
          assert 'static_assert((0x1AE30u-0x1A220u)-46u==3042u);' in code
          assert '1AC18..1AC37 | table | 32' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2246,total
          assert 114822+2246==117068
          assert 239698-117068==122630
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch35_fragment.cpp.gz.b64 Code2/.integrate_batch35.py .github/workflows/integrate-code2-batch35.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 35"
          git push origin HEAD:code1-decompilation
