name: Integrate CODE.2 Batch 88
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch88.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 88
        run: |
          git merge-base --is-ancestor 5766af4d2a5e7d324850c8408f3346211cd7f382 HEAD
          test "$(git hash-object Code2/.batch88.fragment.cpp)" = "ec440c319b9ec003ecc5b3870d70f6ced6ebc53f"
          test "$(git hash-object Code2/.batch88_integrate.py)" = "12e5a0a4841e0764d556ca7c2dec9ec63aaca45e"
          grep -F 'static_assert(0x333BAu-0x332B4u==262u);' Code2/.batch88.fragment.cpp
      - name: Integrate Batch 88
        run: python Code2/.batch88_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch88_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_332b4','0xFCE4u','0x255E8u','0x256A2u+table_index','0x25622u+table_index']:
              assert x in c,x
          assert '333BA..333BB | alignment | 2' in l
          assert '216,792 / 239,698 = 90.4438% (90.44%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 88
        run: |
          cp Code2/.batch88_integrate.py /tmp/batch88_integrate.py
          rm -f Code2/.batch88.fragment.cpp Code2/.batch88_integrate.py .github/workflows/integrate-code2-batch88.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 88"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch88_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`333BC`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 88"
          git push origin HEAD:code1-decompilation
