name: Integrate CODE.2 batch 16
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch16.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 16
        run: python3 Code2/integrate_batch16.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 52825u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 475u;' in cpp
          assert 'static_assert(0x0B40Eu-0x0B02Cu==994u);' in cpp
          assert 'static_assert(0x0B516u-0x0B410u==262u);' in cpp
          assert 'if(app16_hiword(x)>height||app16_hiword(y)>width) { *dg(m,0xC02Fu)=saved_c02f; return; }' in cpp
          assert 'for(s32 i=0;i<=world_last;++i)' in cpp
          assert 'if(moving_type==0x0Bu)' in cpp
          assert 'for(u32 i=0;i<2u;++i)' in cpp
          assert '*dg(m,0x21A12u+target)=static_cast<u8>(*dg(m,0x21A12u+target)|0x20u);' in cpp
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n,(line,b-a+1,n)
              total+=n
          assert total==475,total
          assert 52825+total==53300
          assert 239698-53300==186398
          assert '**53,300 / 239,698 = 22.2363% (22.24%)**' in prog
          print('CODE.2 batch 16 accounting verified: 52825 + 475 = 53300')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch16.inc Code2/integrate_batch16.py .github/workflows/integrate-code2-batch16.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate CODE.2 decompilation batch 16'
          git push origin code1-decompilation
