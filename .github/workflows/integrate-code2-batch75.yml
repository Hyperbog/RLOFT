name: Integrate CODE.2 Batch 75

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch75.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify staged Batch 75
        run: |
          test "$(git hash-object Code2/.batch75.fragment.cpp)" = "3ffe3ba7e80d44195b9659f459f27501b3ead062"
          test "$(git hash-object Code2/.batch75_integrate.py)" = "bef23a9ad7c4f871554edfd218994d09c93f7c11"
          grep -F '// Batch 75: 31C58..31E71' Code2/.batch75.fragment.cpp
          grep -F 'static_assert(0x31E72u-0x31C58u==538u);' Code2/.batch75.fragment.cpp

      - name: Integrate Batch 75
        run: python Code2/.batch75_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch75_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          anchors=[
              'function_31c58',
              'middle2=0x81-left2-right2',
              '0xFE94u+static_cast<u32>(i)',
              '0xFE14u+static_cast<u32>(0x7F-i)',
              'static_assert(0x31E72u-0x31C58u==538u);'
          ]
          for a in anchors: assert a in cpp,a
          assert '31E72..31E73 | alignment | 2' in led
          assert '211,344 / 239,698 = 88.1709% (88.17%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 75
        run: |
          cp Code2/.batch75_integrate.py /tmp/batch75_integrate.py
          rm -f Code2/.batch75.fragment.cpp Code2/.batch75_integrate.py .github/workflows/integrate-code2-batch75.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 75"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch75_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`31E74`**.' Code2/RESUME_CHECKPOINT.md
          grep -F 'd43121acce1172188763eff2bf76c739ef5b9ed7fca5c4854c7ccd18c9466fa0' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 75"
          git push origin HEAD:code1-decompilation
