name: Restore runtime and integrate DAC9
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/restore-runtime-integrate-dac9.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Restore verified runtime and fold DAC9
        run: python3 Code1/restore_runtime_and_integrate_dac9.py
      - name: Assert preserved verified regions
        run: |
          grep -q 'function_dad9' Code1/Code1.cpp
          grep -q 'function_dc90' Code1/Code1.cpp
          grep -q 'function_d154' Code1/Code1.cpp
          grep -q 'function_e3b4' Code1/Code1.cpp
          grep -q 'function_f206' Code1/Code1.cpp
      - name: Syntax check unified translation
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code1/Code1.cpp
      - name: Remove one-shot integration machinery
        run: rm Code1/restore_runtime_and_integrate_dac9.py .github/workflows/restore-runtime-integrate-dac9.yml
      - name: Commit integrated translation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Restore verified runtime and integrate DAC9 wrapper'
          git push origin code1-decompilation
