name: Integrate D573
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-d573.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - run: python Code2/.batch141_integrate.py integrate
      - run: python Code2/.batch141_integrate.py verify
      - run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Code2/Code2.cpp Code2/PROGRESS.md Code2/CODE2_CONTINUITY_ADDENDUM.md Code2/RESUME_CHECKPOINT.md
          git commit -m 'Integrate CODE.2 decompilation batch 141'
          git push origin code1-decompilation
# temporary batch141 integration gate
