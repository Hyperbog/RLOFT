name: Repair CODE.2 batch 52
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch52-repair.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify staged repair payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch52_repair.zb64').read_text())).decode()
          assert 'function_24a9c' in raw
          assert 'function_25d24' in raw
          assert '==4937u);' in raw
          assert 'function_24a60' not in raw
          print('batch52 repair payload OK',len(raw))
          PY
      - name: Normalize repair guard to live source formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Code2/integrate_batch52_repair.py')
          s=p.read_text()
          old='''              (0x2527Du-0x2520Cu) +\n              (0x2531Fu-0x25280u) + (0x2538Bu-0x25320u) +'''
          new='''              (0x2527Du-0x2520Cu) + (0x2531Fu-0x25280u) +\n              (0x2538Bu-0x25320u) +'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply Batch 52 integrity repair
        run: python Code2/integrate_batch52_repair.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 159155u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2917u;' in c
          assert '(0x24A9Cu-0x24478u)==2771u);' in c
          assert 'static_assert(0x24B46u-0x24A9Cu==170u);' in c
          assert 'static_assert(0x25DFAu-0x25D24u==214u);' in c
          assert '==4937u);' in c
          assert 'function_24a60' not in c
          assert 'call_37c70' not in c
          assert '// Batch 52: repaired 24A60 boundary' not in c
          assert '24B46..24B47 | alignment | 2' in l
          assert '25DFA..25DFB | alignment | 2' in l
          assert '24A5E..24A5F | alignment | 2' not in l
          assert '24AB4..24ADB | table | 40' not in l
          assert '**162,072 / 239,698 = 67.6151% (67.62%)**' in p
          assert '**77,626**' in p
          assert 'next object begins at `25DFC`' in p
          assert 'erroneous `+10000h` shift' in p
          assert 'erroneous `+10000h` shift' in a
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              x,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-x+1==n,(line,z-x+1)
              total+=n
          assert total==2917,total
          print('repair accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary repair files
        run: |
          rm -f Code2/batch52_repair.zb64 Code2/integrate_batch52_repair.py .github/workflows/integrate-code2-batch52-repair.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name)
              p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit repaired Batch 52
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Repair and integrate CODE.2 batch 52'
          git push origin HEAD:code1-decompilation
