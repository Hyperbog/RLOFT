name: Integrate CODE.2 batch 07
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch07.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 07
        run: python3 .github/code2_batch07.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 27622u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 193u;' in cpp
          assert 'void function_0461c' in cpp
          assert 'u32 function_050dc' in cpp
          assert 'if(function_04100(m,a6,a3,a4)!=0u)' in cpp
          assert 'if(!cleanup_only)' in cpp
          assert 'load_le16(dg(m,rec+0x10u))&0xF240u' in cpp
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S);assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16);b=int(b,16);n=int(n);assert b-a+1==n;total+=n
          assert total==193,total
          assert (0x50d9-0x461c)+(0x518c-0x50dc)==2925
          assert 27622+193+211883==239698
          print('CODE.2 batch 07 accounting verified: 27622 + 193 + 211883 = 239698')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Commit integrated batch
        run: |
          rm -f .github/code2_batch07.py Code2/batch07.inc .github/workflows/integrate-code2-batch07.yml
          git config user.name "Hyperbog"
          git config user.email "47282882+Hyperbog@users.noreply.github.com"
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 07"
          git push origin HEAD:code1-decompilation
