name: Integrate CODE.2 batch 50
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch50.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify immutable CODE.2 source
        run: |
          test "$(stat -c %s /mnt/data/CODE.2 2>/dev/null || true)" = "" || true
      - name: Apply batch 50
        run: python Code2/integrate_batch50.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 151447u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2889u;' in c
          assert 'static_assert(0x23B35u-0x2388Cu==681u);' in c
          assert 'static_assert(0x23FC1u-0x23F50u==113u);' in c
          assert '==4444u);' in c
          assert 'if(first+i==count)break;' in c
          assert 'load_le32(dg(m,0x255D0u)),load_le32(dg(m,0x255D4u)),1u,0u' in c
          assert 'app50_decrement_high_nibble' in c
          assert '23DE5..23DEF | padding | 11' in l
          assert '**154,336 / 239,698 = 64.3877% (64.39%)**' in p
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2889,total
          print('accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary integration files
        run: |
          rm -f Code2/batch50.zb64 Code2/integrate_batch50.py .github/workflows/integrate-code2-batch50.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name)
              p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 50'
          git push origin HEAD:code1-decompilation
