name: Rename disassembler branch once
on:
  push:
    branches: [code1-decompilation]
    paths:
      - .github/workflows/rename-extractor-20261017.yml
permissions:
  contents: write
jobs:
  rename-disassembler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const oldName = 'disassembler-foundation';
            const newName = 'DosDis';
            const branch = await github.rest.repos.getBranch({owner, repo, branch: oldName});
            if (branch.data.commit.sha !== '0e01126646bc41671f00606fc9032b1e28ae7a71') {
              throw new Error('Disassembler changed since review; refusing rename');
            }
            const result = await github.request('POST /repos/{owner}/{repo}/branches/{branch}/rename', {
              owner, repo, branch: oldName, new_name: newName
            });
            core.info('Renamed disassembler to ' + result.data.name);
