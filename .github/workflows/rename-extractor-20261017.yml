name: Rename extractor branch once
on:
  push:
    branches: [code1-decompilation]
    paths:
      - .github/workflows/rename-extractor-20261017.yml
permissions:
  contents: write
jobs:
  rename-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const oldName = 'extractor-wpf-fluent';
            const newName = 'Ravenloft-Asset-Extractor';
            const branch = await github.rest.repos.getBranch({owner, repo, branch: oldName});
            if (branch.data.commit.sha !== '12b542176cacdeac2af61b2f44bac362578b005a') {
              throw new Error('Extractor changed since review; refusing rename');
            }
            const result = await github.request('POST /repos/{owner}/{repo}/branches/{branch}/rename', {
              owner, repo, branch: oldName, new_name: newName
            });
            core.info('Renamed extractor to ' + result.data.name);
