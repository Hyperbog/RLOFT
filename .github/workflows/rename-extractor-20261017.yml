name: Rename default branch once
on:
  push:
    branches: [code1-decompilation]
    paths:
      - .github/workflows/rename-extractor-20261017.yml
permissions:
  contents: write
jobs:
  rename-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const oldName = 'code1-decompilation';
            const newName = 'Decomp';
            const branch = await github.rest.repos.getBranch({owner, repo, branch: oldName});
            if (branch.data.commit.sha !== '2f00572d5e6387be30ce9ca96c92eb65f209d3e3') {
              throw new Error('Decompilation default changed since review; refusing rename');
            }
            const result = await github.request('POST /repos/{owner}/{repo}/branches/{branch}/rename', {
              owner, repo, branch: oldName, new_name: newName
            });
            core.info('Renamed default to ' + result.data.name);
