name: CODE.2 final audit gate
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/code2-final-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Preserve and identify authoritative source
        run: |
          set -euo pipefail
          test -s Code2/Code2.cpp
          wc -c Code2/Code2.cpp
          git hash-object Code2/Code2.cpp
          cp Code2/Code2.cpp /tmp/Code2.cpp.preserved
      - name: Inventory known semantic repair markers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Code2/Code2.cpp').read_text()
          checks={
            '372F6_fixed':'if((gate&3u)==0u)',
            '372F6_stale':'if((gate&3u)!=3u)',
            '3736D_fixed':'slot=q; value=slot;',
            '37433_fixed':'slot=r; const u32 index=slot; value=q;',
            '37810_fixed':'const u32 q=pos;',
            '37D60_fixed':'s32 seek_result=static_cast<s32>(s.pos);',
            '37EFA_fixed':'b.descriptor_is_device && !b.descriptor_is_device',
            '39C7B_cf_result':'Dpmi0501Result',
            '39C7B_stale':'u32 (*dpmi_alloc)(u32 bytes,u16* handle_hi,u16* handle_lo)',
            '39589_old':'m.cpu.esp-scratch+raw',
            '39589_base':'base+raw',
            '3908C_symbol':'function_3908c',
            '39A8A_symbol':'function_39a8a',
            '39D4D_symbol':'function_39d4d',
            '3A7DF_symbol':'function_3a7df',
            '3A844_symbol':'function_3a844',
          }
          for k,v in checks.items(): print(f'{k}={s.count(v)}')
          PY
      - name: Syntax check current consolidated source
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Verify audit did not modify source
        run: |
          set -euo pipefail
          cmp -s Code2/Code2.cpp /tmp/Code2.cpp.preserved
          git diff --exit-code -- Code2/Code2.cpp
