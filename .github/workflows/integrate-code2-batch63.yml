name: Integrate CODE.2 Batch 63

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch63.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          p=Path('Code2/.batch63.fragment.b64').read_text().strip()
          raw=base64.b64decode(p)
          assert hashlib.sha256(raw).hexdigest() == '6566a1a9053b90e23f9648e6413194551c77ef2675d4c3c50ee9179dc3aa79f1'
          text=raw.decode()
          assert '// Batch 63: 2B088..2B6CC' in text
          assert '==1600u);' in text
          PY

      - name: Integrate Batch 63
        run: python Code2/.batch63_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch63_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert 'function_2b088' in cpp and 'function_2b1bc' in cpp and 'function_2b2f4' in cpp
          assert 'store_le16(dg(m,0x2B608u+' in cpp
          assert 'code_minus2=static_cast<s32>(raw_code-2u);' in cpp
          assert 'const u16 mode_delta=load_le16(dg(m,0x27100u+raw_mode*2u));' in cpp
          assert '2B6CD..2B6CF | alignment | 3' in led
          assert '184,812 / 239,698 = 77.1020% (77.10%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 63
        run: |
          cp Code2/.batch63_integrate.py /tmp/batch63_integrate.py
          rm -f Code2/.batch63.fragment.b64 Code2/.batch63_integrate.py .github/workflows/integrate-code2-batch63.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 63"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch63_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`2B6D0`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 63"
          git push origin HEAD:code1-decompilation
