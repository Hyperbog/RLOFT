name: Integrate CODE.2 Batch 85
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch85.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 85
        run: |
          git merge-base --is-ancestor 892cfcd3c050990dd3dfe8b28d12c526ef1d7693 HEAD
          test "$(git hash-object Code2/.batch85.fragment.cpp)" = "9927cba57a0e9dc1cdbf17519f6b93b04baa644d"
          test "$(git hash-object Code2/.batch85_integrate.py)" = "eb5b6ec7db901768218508124a78026f4dd85ac9"
          grep -F 'static_assert(0x32F8Bu-0x32F4Cu==63u);' Code2/.batch85.fragment.cpp
      - name: Integrate Batch 85
        run: python Code2/.batch85_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch85_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          assert 'function_32f4c' in c
          assert '0x15A18u+load_le32(dg(m,0xC6FCu))*0x1Cu' in c
          assert '32F8B..32F8B | alignment | 1' in l
          assert '215,720 / 239,698 = 89.9966% (90.00%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 85
        run: |
          cp Code2/.batch85_integrate.py /tmp/batch85_integrate.py
          rm -f Code2/.batch85.fragment.cpp Code2/.batch85_integrate.py .github/workflows/integrate-code2-batch85.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 85"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch85_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`32F8C`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 85"
          git push origin HEAD:code1-decompilation
