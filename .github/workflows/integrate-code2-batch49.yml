name: Integrate CODE.2 batch 49
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch49.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 49
        run: python Code2/integrate_batch49.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 147003u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2849u;' in c
          assert 'static_assert(0x22891u-0x223F4u==1181u);' in c
          assert 'static_assert(0x22E3Eu-0x22D8Cu==178u);' in c
          assert '==2503u);' in c
          assert '22950..229A3 | table | 84' in l
          assert '229A4..229CB | table | 40' in l
          assert 'app49_xor_low_byte_1(load_le32(dg(m,0xC050u)))' in c
          assert 'y_work=static_cast<s32>(static_cast<u32>(y_work)-0x20u);' in c
          assert '**149,852 / 239,698 = 62.5170% (62.52%)**' in p
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2849,total
          print('accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary integration files
        run: |
          rm -f Code2/batch49.staging.cpp Code2/integrate_batch49.py .github/workflows/integrate-code2-batch49.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name)
              p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 49'
          git push origin HEAD:code1-decompilation
