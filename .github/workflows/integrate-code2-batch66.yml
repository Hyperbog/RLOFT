name: Integrate CODE.2 Batch 66

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch66.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify and unpack staged bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile
          raw=base64.b64decode(Path('Code2/.batch66.bundle.b64').read_text().strip())
          assert hashlib.sha256(raw).hexdigest() == '19f078180ca0e04ac683b517b98c991602bc2afde5363d1ccc78ca8829a08a35'
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              names=set(tf.getnames())
              assert names == {'Code2/.batch66.fragment.cpp','Code2/.batch66_integrate.py'}
              tf.extractall('.')
          frag=Path('Code2/.batch66.fragment.cpp').read_text()
          assert hashlib.sha256(frag.encode()).hexdigest() == '744c1192646bb8ff7c8e7bd28b6b2368a90cff97188c71c3baa84464ce882c7f'
          assert '// Batch 66: 2D004..2DF29' in frag
          assert '==3862u);' in frag
          PY

      - name: Integrate Batch 66
        run: python Code2/.batch66_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch66_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          assert all(x in cpp for x in ['function_2d004','function_2d234','function_2d2f4','function_2d3c4','function_2d3d8','function_2d5d0','function_2d9fc','function_2da7c','function_2dbac'])
          assert 'app66_high_sword(raw_y-0x5800u)' in cpp
          assert 'static_cast<u16>(r)!=0u || load_le32(dg(m,0xF048u))!=0u' in cpp
          assert 'base+static_cast<u32>(delta)+static_cast<u32>(delta)' in cpp
          assert 'const s32 wanted=app66_sword(m,0x258AAu+static_cast<u32>(j)*2u);' in cpp
          assert '2DF2A..2DF2B | alignment | 2' in led
          assert '195,144 / 239,698 = 81.4124% (81.41%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 66
        run: |
          cp Code2/.batch66_integrate.py /tmp/batch66_integrate.py
          rm -f Code2/.batch66.fragment.cpp Code2/.batch66_integrate.py Code2/.batch66.bundle.b64 .github/workflows/integrate-code2-batch66.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 66"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch66_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`2DF2C`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 66"
          git push origin HEAD:code1-decompilation
