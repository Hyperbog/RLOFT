name: Integrate CODE.2 batch 57
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch57.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch57.zb64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == '67b3fec9f410923d31d5c6b4edcfad4413aa3b8855af31e5f4686b1b8ccf6aa2'
          t=raw.decode(); assert 'function_29414' in t and 'function_298f0' in t and '== 1281u);' in t
          print('batch57 payload OK',len(raw))
          PY
      - name: Apply Batch 57
        run: python Code2/integrate_batch57.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text(); l=Path('Code2/RESIDUAL_LEDGER.md').read_text(); p=Path('Code2/PROGRESS.md').read_text(); a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 173550u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 3678u;' in c
          assert '+ 3214u + 1281u);' in c
          assert 'static_assert(0x29563u-0x29414u==335u);' in c
          assert 'static_assert(0x29922u-0x298F0u==50u);' in c
          assert '== 1281u);' in c
          assert '29922..2992F | padding | 14' in l
          assert '**177,228 / 239,698 = 73.9380% (73.94%)**' in p
          assert '**62,470**' in p and 'frontier is now `29930`' in p
          assert '## CODE.2 Batch 57 checkpoint' in a
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line); assert m,line
              x,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3)); assert z-x+1==n,(line,z-x+1); total+=n
          assert total==3678,total
          print('batch57 accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary staging files
        run: |
          rm -f Code2/batch57.zb64 Code2/integrate_batch57.py .github/workflows/integrate-code2-batch57.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name); p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit Batch 57
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 57'
          git push origin HEAD:code1-decompilation
