name: Integrate CODE.2 batch 37

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch37.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 37
        run: python Code2/.integrate_batch37.py
      - name: Verify accounting and anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text(); ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text(); progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 118743u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2273u;' in code
          assert '**121,016 / 239,698 = 50.4869% (50.49%)**' in progress
          assert 'void function_1bbd8(Machine& m,Application36Boundary& b,' in code
          assert 'function_1b760(m,b,rec,context,attempt);' in code
          assert 'const u16 tile=static_cast<u16>(static_cast<u16>(hi0*width)+hi4);' in code
          assert 'static_assert(0x1BD99u-0x1BBD8u==449u);' in code
          assert '1BD99..1BD9B | alignment | 3' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line); assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3)); assert z-a+1==n,(line,z-a+1); total+=n
          assert total==2273,total
          assert 118743+2273==121016
          assert 239698-121016==118682
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch37_fragment.cpp Code2/.integrate_batch37.py .github/workflows/integrate-code2-batch37.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 37"
          git push origin HEAD:code1-decompilation
