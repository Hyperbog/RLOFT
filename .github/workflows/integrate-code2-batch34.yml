name: Integrate CODE.2 batch 34

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch34.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 34
        run: python Code2/.integrate_batch34.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code2/Code2.cpp').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 111780u;' in code
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2200u;' in code
          assert '**111,780**' in progress and '**2,200**' in progress
          assert '**113,980 / 239,698 = 47.5515% (47.55%)**' in progress
          assert 'void function_19888(Machine& m,Application34Boundary& b) noexcept' in code
          assert 'if(deadline<=now)return false;' in code
          assert 'if(now>load_le32(dg(m,0xA790u)))' in code
          assert '*dg(m,0x140A0u+index)=static_cast<u8>(load_le32(dg(m,0xA7E8u)));' in code
          assert 'if(now<load_le32(dg(m,0xA790u)))' in code
          assert 'if((flags&0x1000u)!=0u)' in code and 'if((flags&0x4000u)!=0u)' in code and 'if((flags&0x2000u)!=0u)' in code
          assert 'for(u32 i=0u;i<8u;++i)store_le16(dg(m,0x9E21u+i*2u),0xFFFFu);' in code
          assert 'return static_cast<u32>(static_cast<u8>(buttons)&3u);' in code
          assert 'static_assert(0x1A21Du-0x1A1F4u==41u);' in code
          assert '19C72..19C7F | padding | 14' in ledger
          assert '1A21D..1A21F | alignment | 3' in ledger
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2200,total
          assert 111780+2200==113980
          assert 239698-113980==125718
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/.batch34_fragment.cpp.gz.b64 Code2/.integrate_batch34.py .github/workflows/integrate-code2-batch34.yml
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 34"
          git push origin HEAD:code1-decompilation
