name: Integrate CODE.2 batch 11
on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch11.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 11
        run: python3 Code2/integrate_batch11.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp=Path('Code2/Code2.cpp').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          cont=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 39537u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 343u;' in cpp
          assert '// Batch 11: 075CC..0808A filename editing' in cpp
          assert 'void function_07874(' in cpp
          assert '[[nodiscard]] u32 function_07874' not in cpp
          block=cpp[cpp.index('void function_077a0('):cpp.index('static_assert(0x07871u-0x077A0u==209u);')]
          i0=block.index('*dg(m,0xA79Du)=0u;')
          i1=block.index('b.call_171fc')
          i2=block.index('*dg(m,0xA79Du)=1u;')
          assert i0 < i1 < i2
          assert 'static_assert(0x0808Bu-0x0803Cu==79u);' in cpp
          assert '0808C..080AB | table | 32' in led
          assert '**Total proven non-code/data:** **343 bytes**.' in led
          m=re.search(r'<!-- RESIDUAL-RANGES-BEGIN -->\n(.*?)<!-- RESIDUAL-RANGES-END -->',led,re.S)
          assert m
          total=0
          for line in m.group(1).strip().splitlines():
              a,b,cat,n=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| (alignment|table|noncode) \| (\d+)',line).groups()
              a=int(a,16); b=int(b,16); n=int(n)
              assert b-a+1==n
              total += n
          assert total==343,total
          assert 39537+total==39880
          assert 39880 < 239698
          assert '**Reconciled object bytes:** **39,880 / 239,698 = 16.6376% (16.64%)**' in prog
          assert '**Unresolved object bytes:** **199,818**' in prog
          assert '## CODE.2 Batch 11 checkpoint' in cont
          for p in ['Code2/batch11.inc','Code2/integrate_batch11.py','.github/workflows/integrate-code2-batch11.yml']:
              assert not Path(p).exists(),p
          print('CODE.2 batch 11 accounting verified: 39537 + 343 = 39880 / 239698')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Diff check
        run: git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name "Hyperbog"
          git config user.email "47282882+Hyperbog@users.noreply.github.com"
          git add -A Code2 .github/workflows/integrate-code2-batch11.yml
          git diff --cached --quiet && { echo 'No staged integration changes'; exit 1; }
          git commit -m "Integrate CODE.2 decompilation batch 11"
          git push origin HEAD:code1-decompilation
