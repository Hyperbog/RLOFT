name: Integrate CODE.2 batch 26
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch26.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
      - name: Apply batch 26
        run: python Code2/integrate_batch26.py
      - name: Verify CODE.2 accounting and semantic anchors
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          progress=Path('Code2/PROGRESS.md').read_text()
          ledger=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 89498u;' in cpp
          assert 'constexpr u32 kVerifiedNonCodeBytes = 1650u;' in cpp
          assert 'read_13ad8_stale_local' in cpp
          assert 'function_13fd4' in cpp
          assert 'case 0x20u' in cpp
          assert 'token==0xFFFFu' in cpp
          assert '89,498 translated + 1,650 non-code = 91,148 / 239,698 = 38.0262% (38.03%)' in Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert '**Reconciled object bytes:** **91,148 / 239,698 = 38.0262% (38.03%)**' in progress
          assert '**Unresolved object bytes:** **148,550**' in progress
          block=ledger.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              m=re.match(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \|',line)
              if m: total+=int(m.group(2),16)-int(m.group(1),16)+1
          assert total==1650,total
          assert 89498+1650==91148
          assert 239698-91148==148550
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm Code2/batch26.zb64 Code2/integrate_batch26.py .github/workflows/integrate-code2-batch26.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name Hyperbog
          git config user.email 47282882+Hyperbog@users.noreply.github.com
          git add -A
          git commit -m "Integrate CODE.2 decompilation batch 26"
          git push origin HEAD:code1-decompilation
