name: Integrate CODE.2 batch 43
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch43.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Apply batch 43
        run: python Code2/integrate_batch43.py
      - name: Verify accounting and semantic anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          assert 'kVerifiedTranslatedBytes = 130855u' in c
          assert 'kVerifiedNonCodeBytes = 2465u' in c
          assert 'static_assert(0x1EDACu-0x1EA90u==796u);' in c
          assert '1E533..1E533 | alignment | 1' in l
          assert '**Total proven non-code/data:** **2,465 bytes**.' in l
          assert '133,320 / 239,698 = 55.6200% (55.62%)' in p
          print('accounting/anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean staging and diff check
        run: |
          rm -f Code2/batch43.zb64 Code2/integrate_batch43.py .github/workflows/integrate-code2-batch43.yml
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 43'
          git push origin HEAD:code1-decompilation
