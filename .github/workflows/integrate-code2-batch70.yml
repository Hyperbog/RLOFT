name: Integrate CODE.2 Batch 70

on:
  push:
    branches: [code1-decompilation]
    paths:
      - '.github/workflows/integrate-code2-batch70.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify staged Batch 70
        run: |
          test "$(git hash-object Code2/.batch70.fragment.cpp)" = "c358400dae39ac3ce38fecfc11e7800eb0b6263c"
          test "$(git hash-object Code2/.batch70_integrate.py)" = "2e0b60474ca170b512fc35893690afd8231da6ef"
          python - <<'PY'
          from pathlib import Path
          text=Path('Code2/.batch70.fragment.cpp').read_text()
          assert '// Batch 70: 2F580..305A5' in text
          assert '==4070u);' in text
          PY

      - name: Integrate Batch 70
        run: python Code2/.batch70_integrate.py integrate

      - name: Verify accounting
        run: python Code2/.batch70_integrate.py verify

      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp

      - name: Guard fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp=Path('Code2/Code2.cpp').read_text()
          led=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          prog=Path('Code2/PROGRESS.md').read_text()
          anchors=[
              'u32 result=m.cpu.esi;',
              'kApp70DecodeJumpTable[4]={0x2FEBCu,0x2FF32u,0x2FFA4u,0x2FFABu}',
              'eax=(eax&0xFFFF0000u)|static_cast<u16>(prod);',
              'static_cast<s32>(count)<=static_cast<s32>(avail)',
              'void function_3012c(Machine& m,Application70Boundary& b,u32 image,u32 header_word,s32 x,s32 y,s32 w,s32 h,u32 tag)',
              'function_2f868(m,b);',
              '==4070u);'
          ]
          for a in anchors:
              assert a in cpp,a
          assert '0x2B700u' not in cpp and '0x2B750u' not in cpp
          assert '2FD8C..2FD9B | table | 16' in led
          assert '305A6..305A7 | alignment | 2' in led
          assert '204,996 / 239,698 = 85.5226% (85.52%)' in prog
          PY
          git diff --check

      - name: Commit substantive Batch 70
        run: |
          cp Code2/.batch70_integrate.py /tmp/batch70_integrate.py
          rm -f Code2/.batch70.fragment.cpp Code2/.batch70_integrate.py .github/workflows/integrate-code2-batch70.yml
          git add -A
          git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 70"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch70_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`305A8`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md
          git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 70"
          git push origin HEAD:code1-decompilation
