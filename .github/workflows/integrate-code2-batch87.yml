name: Integrate CODE.2 Batch 87
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch87.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 87
        run: |
          git merge-base --is-ancestor c617f3de4f2ce625cae3884b74f8f031578500fd HEAD
          test "$(git hash-object Code2/.batch87.fragment.cpp)" = "0b9f725e93c7afff3bc918f97804dd756ecf7060"
          test "$(git hash-object Code2/.batch87_integrate.py)" = "e17c3e24ef3135e8e12d58344da0fc3d40591e9c"
          grep -F 'static_assert(0x332B3u-0x33124u==399u);' Code2/.batch87.fragment.cpp
      - name: Integrate Batch 87
        run: python Code2/.batch87_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch87_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_33124','0x256A2u+table_index','0x25622u+table_index','0x248E6u','0x25606u']:
              assert x in c,x
          assert '332B3..332B3 | alignment | 1' in l
          assert '216,528 / 239,698 = 90.3337% (90.33%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 87
        run: |
          cp Code2/.batch87_integrate.py /tmp/batch87_integrate.py
          rm -f Code2/.batch87.fragment.cpp Code2/.batch87_integrate.py .github/workflows/integrate-code2-batch87.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 87"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch87_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`332B4`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 87"
          git push origin HEAD:code1-decompilation
