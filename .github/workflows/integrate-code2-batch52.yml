name: Integrate CODE.2 batch 52
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch52.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch52.zb64').read_text())).decode()
          assert 'function_24a60' in raw
          assert 'function_253fc' in raw
          assert '==2538u);' in raw
          assert 'kApp52Table24ab4' in raw
          print('batch52 payload OK',len(raw))
          PY
      - name: Apply batch 52
        run: python Code2/integrate_batch52.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 156694u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 2962u;' in c
          assert 'static_assert(0x24A5Eu-0x24478u==1510u);' in c
          assert '==2709u);' in c
          assert 'static_assert(0x24AB2u-0x24A60u==82u);' in c
          assert 'static_assert(0x2548Cu-0x253FCu==144u);' in c
          assert '==2538u);' in c
          assert '0x14B79u,0x14B87u,0x14B95u,0x14BA3u,0x14BDAu' in c
          assert '24A5E..24A5F | alignment | 2' in l
          assert '24AB4..24ADB | table | 40' in l
          assert '**159,656 / 239,698 = 66.6071% (66.61%)**' in p
          assert 'next object is the **42-entry CS dispatch table at `2548C`**' in p
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              a,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-a+1==n,(line,z-a+1)
              total+=n
          assert total==2962,total
          print('accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary integration files
        run: |
          rm -f Code2/batch52.zb64 Code2/integrate_batch52.py .github/workflows/integrate-code2-batch52.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name)
              p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 52'
          git push origin HEAD:code1-decompilation
