name: Phase 1 - NPC and expanded LEVELS field reconstruction

on:
  push:
    branches: [Ravenloft-Enhanced]
    paths:
      - 'Tools/phase1_npc_level_fields.py'
      - 'Tools/phase1_npc_level_consumers.py'
      - 'Tools/phase1_npc_level_semantics.py'
      - 'Tools/phase1_npc_region_level_groups.py'
      - '.github/workflows/phase1-npc-level-fields.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npc-level-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research tools
        uses: actions/checkout@v4
      - name: Checkout authenticated original game media
        uses: actions/checkout@v4
        with:
          ref: DnD-Classics
          path: preservation
          sparse-checkout: |
            MASTER/Menzoberranzan
            MASTER/Ravenloft - Stone Prophet
            MASTER/Ravenloft - Strahd's Possession
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Audit original CODE.2 NPC and level field references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python Tools/phase1_npc_level_fields.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-npc-level-fields.json
          python -m py_compile Tools/phase1_npc_level_fields.py
      - name: Verify direct NPC and enlarged level-header CODE.2 consumers
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_npc_level_consumers.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-npc-level-consumers.json
          python -m py_compile Tools/phase1_npc_level_consumers.py

      - name: Authenticate NPC runtime field copies and header counts
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_npc_level_semantics.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-npc-level-semantic-witnesses.json
          python -m py_compile Tools/phase1_npc_level_semantics.py

      - name: Audit inserted NPC descriptor structure and indexed level table groups
        shell: bash
        run: |
          set -euo pipefail
          python Tools/phase1_npc_region_level_groups.py \
            --root preservation/MASTER --repo-root . \
            --json audit/phase1-npc-region-level-groups.json
          python -m py_compile Tools/phase1_npc_region_level_groups.py

      - name: Publish derived metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-npc-level-field-evidence
          path: audit/
          retention-days: 30
          if-no-files-found: error
