name: Integrate CODE.2 Batch 122
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch122.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Integrate Batch 122
        run: python Code2/.batch122_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch122_integrate.py verify
      - name: Syntax and diff checks
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
          git diff --check
      - name: Fidelity guards
        run: |
          grep -F 'function_36b9c' Code2/Code2.cpp
          grep -F 'function_36cbc' Code2/Code2.cpp
          grep -F '229,213 / 239,698 = 95.6257% (95.63%)' Code2/PROGRESS.md
      - name: Commit substantive Batch 122
        run: |
          cp Code2/.batch122_integrate.py /tmp/batch122_integrate.py
          rm -f Code2/.batch122.fragment.cpp Code2/.batch122_integrate.py .github/workflows/integrate-code2-batch122.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 122"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch122_integrate.py checkpoint
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 122"
          git push origin HEAD:code1-decompilation
