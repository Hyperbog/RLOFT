name: Integrate CODE.2 Batch 93
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch93.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 93
        run: |
          git merge-base --is-ancestor bf0b26e88d4475cf62fea0b4f5be87bce18ceafb HEAD
          test "$(git hash-object Code2/.batch93.fragment.cpp)" = "e7ad05024a5f5f51d749537ce4516bcb0aaf86ce"
          test "$(git hash-object Code2/.batch93_integrate.py)" = "0d18f1e894ec3ec14d2c0c536c90c7f86366d5b7"
          grep -F 'static_assert(0x338C5u-0x33808u==189u);' Code2/.batch93.fragment.cpp
      - name: Integrate Batch 93
        run: python Code2/.batch93_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch93_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();p=Path('Code2/PROGRESS.md').read_text()
          for x in ['function_33808','numerator/divisor','numerator%divisor','store_le16(dg(m,out_bucket),0xFFFFu)','0x18FE0u+table_index*4u']:
              assert x in c,x
          assert '338C5..338C7 | alignment | 3' in l
          assert '218,084 / 239,698 = 90.9828% (90.98%)' in p
          PY
          git diff --check
      - name: Commit substantive Batch 93
        run: |
          cp Code2/.batch93_integrate.py /tmp/batch93_integrate.py
          rm -f Code2/.batch93.fragment.cpp Code2/.batch93_integrate.py .github/workflows/integrate-code2-batch93.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 93"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch93_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`338C8`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 93"
          git push origin HEAD:code1-decompilation
