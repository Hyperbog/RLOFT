name: Integrate CODE.2 Batch 116
on:
  push:
    branches: [code1-decompilation]
    paths: ['.github/workflows/integrate-code2-batch116.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: code1-decompilation, fetch-depth: 0}
      - run: |
          git config user.name "CODE.2 Decompilation Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Verify staged Batch 116
        run: |
          git merge-base --is-ancestor 41d54242ca55a431b82bc7dcf88394a8df426c9b HEAD
          test "$(git hash-object Code2/.batch116.fragment.cpp)" = "bfe529cddc483476f2c594c585b2432fd6549ccd"
          test "$(git hash-object Code2/.batch116_integrate.py)" = "b5d7676d0f9221220510ccd354ad698a625734b9"
          grep -F 'static_assert(0x35A09u-0x358D4u==309u);' Code2/.batch116.fragment.cpp
          grep -F 'static_assert(0x35A0Cu-0x35A09u==3u);' Code2/.batch116.fragment.cpp
          grep -F 'call_35878_stack' Code2/.batch116.fragment.cpp
      - name: Integrate Batch 116
        run: python Code2/.batch116_integrate.py integrate
      - name: Verify accounting
        run: python Code2/.batch116_integrate.py verify
      - name: Syntax check
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Fidelity guards
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('Code2/Code2.cpp').read_text();p=Path('Code2/PROGRESS.md').read_text();l=Path('Code2/RESIDUAL_LEDGER.md').read_text();a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          for x in ['Runtime116Boundary','app116_read','function_358d4','call_37e77','call_35878_stack','call_27c70_stack','call_380f8']:
              assert x in c,x
          assert 'app116_read(m,b,handle,0x3Cu,flags,local+0xC4u,4u)' in c
          assert 'app116_read(m,b,handle,table_offset,flags,local,0xACu)' in c
          assert 'offset=app116_read(m,b,handle,offset,flags,local+0xACu,0x18u);' in c
          assert 'total+=load_le32(local+0xACu);' in c
          assert 'constexpr u32 kVerifiedTranslatedBytes = 222129u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 4471u;' in c
          assert '226,600 / 239,698 = 94.5356% (94.54%)' in p
          assert '35A09..35A0B | alignment | 3' in l
          assert 'seek-read-tell ordering' in a
          PY
          git diff --check
      - name: Commit substantive Batch 116
        run: |
          cp Code2/.batch116_integrate.py /tmp/batch116_integrate.py
          rm -f Code2/.batch116.fragment.cpp Code2/.batch116_integrate.py .github/workflows/integrate-code2-batch116.yml
          git add -A && git diff --cached --check
          git commit -m "Integrate CODE.2 decompilation batch 116"
          git push origin HEAD:code1-decompilation
          echo "BATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh durable resume checkpoint
        run: |
          BATCH_SHA="$BATCH_SHA" python /tmp/batch116_integrate.py checkpoint
          grep -F "$BATCH_SHA" Code2/RESUME_CHECKPOINT.md
          grep -F 'Next independently decoded instruction boundary: **`35A0C`**.' Code2/RESUME_CHECKPOINT.md
          git add Code2/RESUME_CHECKPOINT.md && git diff --cached --check
          git commit -m "Refresh CODE.2 resume checkpoint after batch 116"
          git push origin HEAD:code1-decompilation
