name: Integrate CODE.2 batch 53
on:
  push:
    paths:
      - '.github/workflows/integrate-code2-batch53.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code1-decompilation
          fetch-depth: 0
      - name: Verify staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          raw=zlib.decompress(base64.b64decode(Path('Code2/batch53.zb64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == '3ed6f7f385a08ac60a9d64e51a95610a7016756a4dcbd7c259804cd71f04f639'
          text=raw.decode()
          assert 'function_26018' in text
          assert 'kApp53Table25dfc[0x87]' in text
          assert 'static_assert(0x273E7u-0x26018u==5071u);' in text
          assert '273E7..273EF are left' in text
          print('batch53 payload OK',len(raw))
          PY
      - name: Apply batch 53
        run: python Code2/integrate_batch53.py
      - name: Verify accounting and fidelity anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('Code2/Code2.cpp').read_text()
          l=Path('Code2/RESIDUAL_LEDGER.md').read_text()
          p=Path('Code2/PROGRESS.md').read_text()
          a=Path('Code2/CODE2_CONTINUITY_ADDENDUM.md').read_text()
          assert 'constexpr u32 kVerifiedTranslatedBytes = 164226u;' in c
          assert 'constexpr u32 kVerifiedNonCodeBytes = 3457u;' in c
          assert 'static_assert(kVerifiedTranslatedBytes == 159155u +' in c
          assert '(0x273E7u-0x26018u));' in c
          assert 'static_assert(sizeof(kApp53Table25dfc)==0x21Cu);' in c
          assert 'kApp53Table25dfc[0x2Cu]==0x26300u' in c
          assert 'kApp53Table25dfc[0x86u]==0x26739u' in c
          assert 'return; // 2603F jumps past 19CF4.' in c
          assert 'peer=(peer&0xFFFFFF00u)|(static_cast<u8>(peer)^1u)' in c
          assert '25DFC..26017 | table | 540' in l
          assert '273E7..273EF |' not in l
          assert '**167,683 / 239,698 = 69.9559% (69.96%)**' in p
          assert '**72,015**' in p
          assert 'next independently decoded routine begins at `273F0`' in p
          assert '135-entry `25DFC` table' in a
          block=l.split('<!-- RESIDUAL-RANGES-BEGIN -->',1)[1].split('<!-- RESIDUAL-RANGES-END -->',1)[0]
          total=0
          for line in block.splitlines():
              line=line.strip()
              if not line: continue
              m=re.fullmatch(r'([0-9A-F]{5})\.\.([0-9A-F]{5}) \| [^|]+ \| (\d+)',line)
              assert m,line
              x,z,n=int(m.group(1),16),int(m.group(2),16),int(m.group(3))
              assert z-x+1==n,(line,z-x+1)
              total+=n
          assert total==3457,total
          print('batch53 accounting/fidelity anchors OK')
          PY
      - name: Syntax check CODE.2 C++
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only Code2/Code2.cpp
      - name: Clean temporary integration files
        run: |
          rm -f Code2/batch53.zb64 Code2/integrate_batch53.py .github/workflows/integrate-code2-batch53.yml
          python - <<'PY'
          from pathlib import Path
          for name in ('Code2/CODE2_CONTINUITY_ADDENDUM.md','Code2/PROGRESS.md','Code2/RESIDUAL_LEDGER.md'):
              p=Path(name)
              p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          git diff --check
      - name: Commit integrated batch
        run: |
          git config user.name 'Hyperbog'
          git config user.email '47282882+Hyperbog@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CODE.2 decompilation batch 53'
          git push origin HEAD:code1-decompilation
